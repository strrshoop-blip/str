<style>
  :root{
    --bg:#09090a;--surface:#111113;--surface-2:#18181b;--surface-3:#222226;
    --accent:#f5f5f6;--accent-soft:#ffffff;--accent-dim:#a1a1aa;--on-accent:#09090a;--rose:#c9605a;
    --text:#f5f5f6;--text-dim:#a9a9b1;--text-faint:#73737c;
    --positive:#5fcf93;--negative:#f0766b;--info:#6aa7ff;--warn:#e8b64c;
    --border:rgba(255,255,255,0.09);--border-strong:rgba(255,255,255,0.18);
    --stitch:repeating-linear-gradient(90deg, var(--border-strong) 0 6px, transparent 6px 12px);
    --radius:12px;--radius-sm:8px;--shadow:0 12px 32px rgba(0,0,0,0.5);
    --logo-filter:brightness(0) invert(1);
  }
  [data-theme="light"]{
    --bg:#f5f5f6;--surface:#ffffff;--surface-2:#f0f0f2;--surface-3:#e4e4e8;
    --accent:#09090a;--accent-soft:#000000;--accent-dim:#52525b;--on-accent:#ffffff;--rose:#c9605a;
    --text:#09090a;--text-dim:#52525b;--text-faint:#85858f;
    --positive:#16874f;--negative:#d2453a;--info:#2563eb;--warn:#b7791f;
    --border:rgba(0,0,0,0.09);--border-strong:rgba(0,0,0,0.2);
    --shadow:0 12px 32px rgba(0,0,0,0.12);--logo-filter:brightness(0);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans Arabic',sans-serif;
    font-size:15px;
    line-height:1.6;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  button,a,input,select,textarea,.model-card,.mobile-nav button,tbody tr{touch-action:manipulation;}
  button{min-height:38px;}
  .mobile-nav button{min-height:52px;}
  h1,h2,h3,h4{font-family:'Cairo',sans-serif;margin:0;font-weight:800;}
  ::selection{background:var(--accent);color:var(--on-accent);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}
  .hidden{display:none !important;}

  /* ---------- Lock screen ---------- */
  #lockScreen{
    position:fixed;inset:0;background:var(--bg);z-index:999;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;
  }
  #lockScreen .emblem{
    width:104px;height:auto;display:flex;align-items:center;justify-content:center;
  }
  #lockScreen .emblem img{width:100%;height:auto;display:block;filter:var(--logo-filter);}
  #lockScreen .brand{font-family:'Cairo',sans-serif;font-weight:800;font-size:26px;color:var(--accent-soft);letter-spacing:0.5px;}
  #lockScreen .sub{color:var(--text-dim);font-size:13.5px;margin-top:-6px;}
  #lockScreen input{
    background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);
    padding:14px 18px;border-radius:var(--radius-sm);font-size:22px;letter-spacing:8px;text-align:center;width:220px;
    font-family:'IBM Plex Sans Arabic',sans-serif;
  }
  #lockScreen .err{color:var(--negative);font-size:13px;min-height:18px;}

  /* ---------- Layout ---------- */
  .app{display:flex;min-height:100vh;}
  .sidebar{
    width:226px;flex:none;background:var(--surface);border-left:1px solid var(--border);
    display:flex;flex-direction:column;padding:24px 12px;position:sticky;top:0;height:100vh;
  }
  .sidebar .brand{padding:0 10px 18px 10px;display:flex;align-items:center;gap:10px;}
  .sidebar .brand .mark{
    width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;
  }
  .sidebar .brand .mark img{width:100%;height:100%;object-fit:contain;filter:var(--logo-filter);}
  .sidebar .brand .name{font-family:'Cairo',sans-serif;font-weight:800;font-size:19px;color:var(--accent-soft);line-height:1.1;}
  .sidebar .brand .tag{font-size:11px;color:var(--text-faint);margin-top:2px;}
  .sidebar-rule{height:1px;background:var(--stitch);margin:0 6px 14px;}
  .navlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:1px;flex:1;}
  .navlist li button{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:4px;
    color:var(--text-dim);text-decoration:none;font-size:14px;font-weight:500;transition:.15s;
    border-inline-start:2px solid transparent;
    width:100%;background:none;border-top:none;border-bottom:none;border-inline-end:none;
    text-align:inherit;font-family:inherit;min-height:auto;
  }
  .navlist li button .ic{font-size:16px;width:18px;text-align:center;}
  .navlist li button:hover{background:var(--surface-2);color:var(--text);}
  .navlist li button.active{background:var(--surface-2);color:var(--accent-soft);font-weight:700;border-inline-start-color:var(--accent);}
  .sidebar .foot{font-size:11px;color:var(--text-faint);padding:12px 10px 0;margin-top:10px;border-top:1px solid var(--border);}

  main{flex:1;min-width:0;padding:8px 30px 90px;}
  .main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
  .page-head{
    display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;
    margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--border);
  }
  .page-head h1{font-size:25px;font-weight:700;}
  .page-head .desc{color:var(--text-dim);font-size:13.5px;margin-top:5px;}

  .mobile-nav{display:none;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--border-strong);
    color:var(--text);padding:9px 16px;border-radius:6px;font-size:13.5px;font-weight:500;transition:.15s;
  }
  .btn:hover{background:var(--surface-3);border-color:var(--accent-dim);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700;}
  .btn.primary:hover{background:var(--accent-soft);border-color:var(--accent-soft);}
  .btn.danger{background:transparent;border-color:var(--negative);color:var(--negative);}
  .btn.danger:hover{background:color-mix(in srgb,var(--negative) 12%,transparent);}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--text-dim);}
  .btn.ghost:hover{color:var(--text);background:var(--surface-2);}
  .btn.sm{padding:6px 11px;font-size:12px;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}

  /* ---------- Cards / grid ---------- */
  .grid{display:grid;gap:12px;}
  .grid.stats{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px;}
  .stat-card .label{font-size:12px;color:var(--text-dim);margin-bottom:9px;}
  .stat-card .value{font-size:21px;font-weight:700;font-family:'Cairo',sans-serif;}
  .stat-card .value.pos{color:var(--positive);}
  .stat-card .value.neg{color:var(--negative);}
  .stat-card .value.accent{color:var(--accent-soft);}
  .stat-card .sub{font-size:11px;color:var(--text-faint);margin-top:7px;}
  .stat-card.hero{
    grid-column:span 2;background:linear-gradient(180deg,var(--surface-2),var(--surface));
    border-color:var(--accent-dim);
  }
  .stat-card.hero .label{font-size:13px;}
  .stat-card.hero .value{font-size:34px;}
  @media (max-width:520px){.stat-card.hero{grid-column:span 1;}}

  .section-title{
    font-family:'Cairo',sans-serif;font-size:16.5px;font-weight:800;margin:28px 0 12px;color:var(--text);
    display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px dashed var(--border-strong);
  }
  .section-title .ic{color:var(--accent);font-family:initial;}

  /* ---------- Toolbar / filters ---------- */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;justify-content:space-between;}
  .toolbar .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .field-inline{display:flex;flex-direction:column;gap:4px;}
  .field-inline label{font-size:11px;color:var(--text-faint);}
  input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{
    background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);
    padding:9px 11px;border-radius:6px;font-size:13.5px;outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  input[type=number],td.num,.compute-box b{font-family:'IBM Plex Sans Arabic',sans-serif;}
  textarea{resize:vertical;min-height:60px;}
  .search-box{min-width:190px;}

  /* ---------- Table ---------- */
  .table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px;}
  thead th{
    text-align:right;padding:11px 14px;color:var(--text-faint);font-weight:600;font-size:11.5px;
    border-bottom:1.5px solid var(--accent-dim);white-space:nowrap;background:transparent;
  }
  tbody td{padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  .num{font-variant-numeric:tabular-nums;font-family:'IBM Plex Sans Arabic',sans-serif;}
  .pos{color:var(--positive);}
  .neg{color:var(--negative);}
  .muted{color:var(--text-faint);}
  .empty-row td{text-align:center;color:var(--text-faint);padding:34px;}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;}
  .pill.in{background:color-mix(in srgb,var(--positive) 16%,transparent);color:var(--positive);}
  .pill.out{background:color-mix(in srgb,var(--negative) 16%,transparent);color:var(--negative);}
  .pill.wholesale{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);}
  .pill.retail{background:color-mix(in srgb,var(--text-dim) 16%,transparent);color:var(--text-dim);}

  /* ---------- Model cards ---------- */
  .model-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
  .model-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.15s;}
  .model-card:hover{border-color:var(--accent-dim);}
  .model-card .thumb{width:100%;aspect-ratio:1/1;background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--text-faint);font-size:12px;}
  .model-card .thumb img{width:100%;height:100%;object-fit:cover;}
  .model-card .info{padding:12px;}
  .model-card .code{font-size:11px;color:var(--accent-soft);font-weight:700;}
  .model-card .name{font-family:'Cairo',sans-serif;font-size:16px;font-weight:700;margin-top:3px;}
  .model-card .row{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--text-dim);}
  .add-model-card{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;border:1.5px dashed var(--border-strong);border-radius:var(--radius);color:var(--text-faint);min-height:180px;background:transparent;font-size:13px;}
  .add-model-card:hover{color:var(--accent);border-color:var(--accent-dim);}

  .gallery{display:flex;gap:8px;flex-wrap:wrap;}
  .gallery img{width:88px;height:88px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--border-strong);}
  .gallery .thumb-x{position:relative;}
  .gallery .thumb-x button{position:absolute;top:-6px;left:-6px;background:var(--negative);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1;}

  /* ---------- Modal ---------- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(10,8,10,0.6);display:flex;align-items:flex-start;justify-content:center;z-index:500;overflow-y:auto;padding:5vh 14px;}
  #confirmRoot .modal-backdrop{z-index:600;}
  .modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);width:100%;max-width:520px;box-shadow:var(--shadow);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);}
  .modal-head h3{font-family:'Cairo',sans-serif;font-size:19px;}
  .modal-head button{background:none;border:none;color:var(--text-dim);font-size:20px;}
  .modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:13px;max-height:64vh;overflow-y:auto;}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
  .form-row{display:flex;flex-direction:column;gap:5px;}
  .form-row label{font-size:12.5px;color:var(--text-dim);font-weight:500;}
  .form-row .hint{font-size:11px;color:var(--text-faint);}
  .form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .compute-box{background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;}

  /* ---------- Debt flow indicator ---------- */
  .flow-split{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .flow-chip{border-radius:var(--radius-sm);padding:10px 12px;display:flex;flex-direction:column;gap:3px;border:1px solid var(--border-strong);}
  .flow-chip .flow-amt{font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:15px;}
  .flow-chip .flow-dest{font-size:11px;color:var(--text-dim);}
  .flow-chip.is-profit{background:color-mix(in srgb,var(--positive) 12%,transparent);border-color:color-mix(in srgb,var(--positive) 40%,transparent);}
  .flow-chip.is-profit .flow-amt{color:var(--positive);}
  .flow-chip.is-debt{background:color-mix(in srgb,var(--warn) 10%,transparent);border-color:color-mix(in srgb,var(--warn) 35%,transparent);}
  .flow-chip.is-debt .flow-amt{color:var(--accent-soft);}
  @media (max-width:420px){.flow-split{grid-template-columns:1fr;}}

  /* ---------- Toast ---------- */
  #toastRoot{position:fixed;bottom:22px;left:22px;z-index:700;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--surface-3);border:1px solid var(--border-strong);color:var(--text);padding:11px 18px;border-radius:var(--radius-sm);box-shadow:var(--shadow);font-size:13.5px;animation:toastin .18s ease-out;}
  @keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- Bars (dashboard mini chart) ---------- */
  .bars{display:flex;align-items:flex-end;gap:14px;height:140px;padding:10px 4px 0;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .bar-track{width:100%;max-width:34px;height:100px;background:var(--surface-2);border-radius:6px 6px 0 0;display:flex;align-items:flex-end;overflow:hidden;}
  .bar-fill{width:100%;background:var(--accent);border-radius:6px 6px 0 0;}
  .bar-col .lbl{font-size:10.5px;color:var(--text-faint);}
  .legend{display:flex;gap:16px;font-size:11.5px;color:var(--text-dim);margin-bottom:6px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}

  /* ---------- Detail header ---------- */
  .detail-back{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-size:13px;margin-bottom:10px;background:none;border:none;}
  .detail-back:hover{color:var(--accent);}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:18px;}
  .detail-head .titles .code{color:var(--accent-soft);font-size:12.5px;font-weight:700;}
  .detail-head .titles h1{margin-top:3px;}

  .notes-add{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
  .notes-add textarea{min-height:84px;}
  .notes-add .btn{align-self:flex-start;}
  .note-item{border:1px solid var(--border);background:var(--surface-2);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;}
  .note-item:last-child{margin-bottom:0;}
  .note-text{white-space:pre-wrap;line-height:1.85;font-size:14px;word-break:break-word;}
  .note-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px;font-size:12px;color:var(--text-faint);}
  .notes-empty{text-align:center;color:var(--text-faint);padding:18px 0;font-size:13.5px;}

  @media print{
    .sidebar,.mobile-nav,.toolbar .btn,.no-print,.modal-backdrop,#toastRoot{display:none !important;}
    body{background:#fff;color:#000;}
    main{padding:0;}
    .card,.table-wrap{border-color:#ccc;background:#fff;}
    thead th{background:#f2f2f2;color:#000;}
  }

  @media (max-width:900px){
    .sidebar{display:none;}
    main{padding:16px 14px 90px;}
    .mobile-nav{
      display:flex;position:fixed;bottom:0;right:0;left:0;background:var(--surface);
      border-top:1px solid var(--border);z-index:400;overflow-x:auto;padding:6px 4px;gap:2px;
    }
    .mobile-nav button{
      flex:1;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:3px;
      padding:7px 4px;color:var(--text-faint);text-decoration:none;font-size:10px;border-radius:8px;
      background:none;border:none;font-family:inherit;min-height:52px;
    }
    .mobile-nav button .ic{font-size:18px;}
    .mobile-nav button.active{color:var(--accent-soft);font-weight:700;}
    .form-grid2{grid-template-columns:1fr;}
  }

  /* ===== v6 identity: black & white, motion, topbar ===== */
  body,.sidebar,.card,.table-wrap,.stat-card,.btn,input,select,textarea{transition:background-color .25s,color .25s,border-color .25s;}
  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 30px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
  .topbar .ttl{font-family:'Cairo',sans-serif;font-weight:800;font-size:15px;color:var(--text-dim);}
  .theme-btn{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;min-height:36px;}
  .theme-btn:hover{background:var(--surface-3);}
  .navlist button{transition:background .2s,transform .2s;} .navlist button:hover{transform:translateX(-3px);}
  .card,.stat-card,.table-wrap{border-radius:var(--radius);}
  .stat-card{transition:transform .2s,border-color .2s;} .stat-card:hover{transform:translateY(-2px);border-color:var(--border-strong);}
  @keyframes pageIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97);}to{opacity:1;transform:none;}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  main.page-enter{animation:pageIn .35s ease;}
  .modal-backdrop{animation:fadeIn .2s ease;} .modal-backdrop .modal{animation:modalIn .25s ease;}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px;}
  .tabs button{background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);padding:8px 16px;border-radius:999px;font-weight:700;font-size:13.5px;}
  .tabs button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
  .pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:transform .2s,border-color .2s;}
  .pcard:hover{transform:translateY(-3px);border-color:var(--border-strong);}
  .pcard .pn{font-family:'Cairo',sans-serif;font-weight:800;font-size:18px;display:flex;justify-content:space-between;align-items:center;}
  .pcard .pr{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;color:var(--text-dim);border-bottom:1px dashed var(--border);}
  .pcard .pr b{color:var(--text);} .pcard .big{font-size:22px;font-weight:800;margin:10px 0 2px;}
  .bars{display:flex;align-items:flex-end;gap:4px;height:170px;padding:10px 4px 0;overflow-x:auto;}
  .bars .b{flex:1;min-width:14px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;}
  .bars .b i{display:block;width:100%;background:var(--accent);border-radius:5px 5px 0 0;min-height:2px;opacity:.85;transition:opacity .2s;} .bars .b:hover i{opacity:1;}
  .bars .b span{font-size:10px;color:var(--text-faint);margin-top:4px;white-space:nowrap;}
  .split-bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface-3);margin:8px 0;}
  .split-bar i{display:block;height:100%;}
  .rule-box{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;line-height:1.9;color:var(--text-dim);}
  @media (max-width:900px){.topbar{padding:10px 14px;} .main-col{padding-bottom:0;}}
  @media print{.topbar{display:none !important;}}

  /* ===== v7 luxury ===== */
  :root{--ease:cubic-bezier(.22,.8,.3,1);--card-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);}
  [data-theme="dark"]{--card-shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);}
  body{background-image:radial-gradient(900px 420px at 85% -80px,color-mix(in srgb,var(--accent) 7%,transparent),transparent);background-attachment:fixed;}
  .card,.stat-card,.table-wrap,.pcard{box-shadow:var(--card-shadow);}
  .stat-card.hero{background:linear-gradient(135deg,var(--surface),var(--surface-2));border-color:var(--border-strong);}
  .stat-card,.pcard,.btn,.tabs button,.navlist button{transition:transform .28s var(--ease),box-shadow .28s var(--ease),background .25s,border-color .25s,color .25s;}
  .stat-card:hover,.pcard:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(0,0,0,.14);}
  .btn:hover{transform:translateY(-1px);} .btn:active,.tabs button:active{transform:scale(.97);}
  .btn.primary{box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 28%,transparent);}
  .sidebar .navlist button.active{box-shadow:inset -3px 0 0 var(--accent);}
  .table-wrap tbody tr{transition:background .2s;} .table-wrap tbody tr:hover{background:var(--surface-2);}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent);}
  *{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent;}
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  main.page-enter .stat-card,main.page-enter .pcard,main.page-enter .card,main.page-enter .table-wrap,main.page-enter .page-head,main.page-enter .section-title{animation:rise .55s var(--ease) both;}
  main.page-enter .grid>*:nth-child(2){animation-delay:.05s;} main.page-enter .grid>*:nth-child(3){animation-delay:.1s;} main.page-enter .grid>*:nth-child(4){animation-delay:.15s;}
  main.page-enter .grid>*:nth-child(5){animation-delay:.2s;} main.page-enter .grid>*:nth-child(n+6){animation-delay:.25s;}
  .modal-backdrop .modal{animation:modalIn .35s var(--ease);}
  .bars .b i{animation:grow .7s var(--ease) both;transform-origin:bottom;} @keyframes grow{from{transform:scaleY(0);}to{transform:none;}}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}

  /* ===== v8 polish ===== */
  html{scroll-behavior:smooth;}
  .page-head h1{font-size:30px;font-weight:800;letter-spacing:-.2px;position:relative;padding-bottom:10px;}
  .page-head h1::after{content:"";position:absolute;bottom:0;right:0;width:46px;height:3px;border-radius:3px;background:var(--accent);}
  .page-head .desc{max-width:640px;line-height:1.9;}
  .stat-card{position:relative;overflow:hidden;}
  .stat-card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--accent),transparent);opacity:.55;}
  .stat-card .label{font-size:12.5px;letter-spacing:.2px;color:var(--text-dim);}
  .stat-card .value{font-size:27px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px;}
  .stat-card.hero .value{font-size:34px;}
  td.num,.num{font-variant-numeric:tabular-nums;}
  .section-title{display:flex;align-items:center;gap:10px;font-weight:800;}
  .section-title::after{content:"";flex:1;height:1px;background:var(--border);margin-right:8px;}
  .table-wrap{overflow:auto;border:1px solid var(--border);}
  table{border-collapse:separate;border-spacing:0;}
  thead th{background:var(--surface-2);color:var(--text-dim);font-size:12px;font-weight:800;letter-spacing:.3px;position:sticky;top:0;z-index:1;}
  tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--surface-2) 45%,transparent);}
  tbody tr:hover td{background:var(--surface-2);}
  .empty-row td{padding:34px 12px;color:var(--text-faint);text-align:center;}
  .btn{border-radius:10px;font-weight:700;}
  .btn.ghost{border:1px solid var(--border-strong);background:transparent;}
  .btn.danger{background:color-mix(in srgb,var(--negative) 10%,transparent);border-color:color-mix(in srgb,var(--negative) 35%,transparent);color:var(--negative);}

.wr-dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;} .wr-l{flex:1 1 130px;font-weight:700;font-size:14px;}
.wr-v{font-size:16px;font-variant-numeric:tabular-nums;} .wr-p{min-width:46px;text-align:center;font-size:12.5px;font-weight:800;background:var(--surface-3,var(--surface-2));border-radius:999px;padding:2px 8px;}
.wr-d{font-size:11.5px;font-weight:800;} .wr-d.good{color:var(--positive);} .wr-d.bad{color:var(--negative);}
.wr-q{font-size:12px;color:var(--accent-soft,var(--text-dim));font-weight:700;margin-inline-start:auto;}
.hero-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:14px;}
.hk{background:var(--surface-2);border-radius:12px;padding:9px 12px;display:flex;flex-direction:column;gap:2px;} .hk small{font-size:11.5px;color:var(--text-faint);} .hk b{font-size:16px;font-variant-numeric:tabular-nums;}
.why-head{padding:12px 14px;border-radius:14px;font-weight:800;font-size:15px;margin-bottom:12px;background:var(--surface-2);}
.why-head.good{border-inline-start:5px solid var(--positive);} .why-head.warn{border-inline-start:5px solid var(--warn);} .why-head.bad{border-inline-start:5px solid var(--negative);}
.why-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:6px;} .why-facts div{background:var(--surface-2);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;} .why-facts small{font-size:11.5px;color:var(--text-faint);} .why-facts b{font-size:15px;font-variant-numeric:tabular-nums;}
.why-h{margin:16px 0 6px;font-size:14.5px;} .why-ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px;font-size:13.5px;line-height:1.7;} .why-ul .btn{margin-inline-start:6px;}
.wr2-card{padding:16px 18px;}
.wr2-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px;font-weight:800;font-size:14px;} .wr2-head small{font-weight:500;color:var(--text-faint);margin-inline-start:4px;}
.wr2-head i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-inline-end:6px;} .wr2-head .w i{background:var(--text);} .wr2-head .r i{background:var(--info);}
.wr2{padding:8px 0;border-top:1px dashed var(--border);} .wr2-l{text-align:center;font-size:12px;color:var(--text-faint);margin-bottom:5px;font-weight:700;}
.wr2-b{display:flex;align-items:center;gap:10px;} .wr2-b b{flex:0 0 auto;min-width:78px;font-size:14px;font-variant-numeric:tabular-nums;} .wr2-b b.w{text-align:start;} .wr2-b b.r{text-align:end;}
.wr2-bar{flex:1;display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--surface-2);} .wr2-bar i.w{background:var(--text);} .wr2-bar i.r{background:var(--info);}
.wr2-p{display:flex;justify-content:space-between;font-size:11px;color:var(--text-faint);margin-top:2px;padding-inline:2px;}
.tm-list{display:flex;flex-direction:column;} .tm-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px dashed var(--border);cursor:pointer;} .tm-row:first-child{border-top:0;} .tm-row:hover{background:var(--surface-2);border-radius:12px;}
.tm-rk{width:22px;height:22px;border-radius:7px;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:0 0 auto;}
.tm-img{width:54px;height:54px;border-radius:12px;overflow:hidden;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:22px;} .tm-img img{width:100%;height:100%;object-fit:cover;}
.tm-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;} .tm-mid b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} .tm-mid small{font-size:11.5px;color:var(--text-dim);}
.tm-num{text-align:end;display:flex;flex-direction:column;gap:2px;flex:0 0 auto;} .tm-num b{font-size:14px;font-variant-numeric:tabular-nums;} .tm-num small{font-size:11.5px;}
.pt-sec{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden;} .pt-sec>summary{cursor:pointer;padding:13px 16px;font-weight:800;font-size:14.5px;} .pt-sec[open]>summary{border-bottom:1px solid var(--border);} .pt-sec .table-wrap{border:0;border-radius:0;box-shadow:none;}
@media (max-width:640px){.hero-rev{text-align:start;width:100%;} .hero-rev b{font-size:24px;} .wr-q{display:none;} .wr2-b b{min-width:64px;font-size:13px;} .tm-img{width:46px;height:46px;} .hero-card{padding:14px;}}

.wr3-bar{display:flex;height:30px;border-radius:12px;overflow:hidden;gap:3px;margin-bottom:12px;} .wr3-bar i{display:flex;align-items:center;justify-content:center;min-width:0;} .wr3-bar i.w{background:var(--text);} .wr3-bar i.r{background:var(--info);} .wr3-bar em{font-style:normal;font-size:12px;font-weight:800;color:#fff;white-space:nowrap;}
.wr3{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.wrt{border:1px solid var(--border);border-radius:16px;padding:12px 14px;background:var(--surface);border-top:4px solid var(--text);} .wrt.r{border-top-color:var(--info);}
.wrt-h{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;flex-wrap:wrap;} .wrt-h i{width:10px;height:10px;border-radius:50%;background:var(--text);} .wrt.r .wrt-h i{background:var(--info);}
.wrt-best{margin-inline-start:auto;font-size:10.5px;font-weight:800;background:var(--positive);color:#fff;border-radius:999px;padding:2px 8px;}
.wrt-big{font-size:20px;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums;} .wrt-sub{font-size:11.5px;color:var(--text-faint);margin-bottom:8px;}
.wrt-rows{display:flex;flex-direction:column;} .wrt-rows div{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px dashed var(--border);font-size:13px;} .wrt-rows span{color:var(--text-dim);} .wrt-rows b{font-variant-numeric:tabular-nums;}
.rc-sum{gap:8px !important;margin:2px 0 12px !important;} .rc-sum>div{padding:7px 12px !important;border-radius:10px !important;} .rc-sum b{font-size:16px !important;}
@media (max-width:480px){.wrt{padding:10px;} .wrt-big{font-size:16px;} .wrt-rows div{font-size:12px;} .wrt-best{display:none;}}
</style>
</head>

/* =========================================================

========================================================= */
const STORAGE_KEY = 'setr_erp_state_v1';
/* مستند جديد (main2): النسخ القديمة من الموقع تبقى تكتب على main ولا تقدر تمسح بياناتك الجديدة.
   أول مرة ينقل الموقع بياناتك من main إلى main2 تلقائياً */
const FIRESTORE_DOC = 'erp_state/main2';
const LEGACY_FIRESTORE_DOC = 'erp_state/main';
const CLIENT_VERSION = 'v7'; const CLIENT_NUM = 7;
const DEVICE_ID = (()=>{ try{ let d = localStorage.getItem('str_device'); if(!d){ d = Math.random().toString(36).slice(2,7); localStorage.setItem('str_device', d); } return d; }catch(e){ return 'dev'; } })();
let lastSeenRev = null;
const hasCloudStorage = (typeof window.storage !== 'undefined' && window.storage !== null);

function defaultState(){
  return {
    settings:{ shopName:'ستر', pin:null, capitalBase:0 },
    expenses:[], tailors:[], tailorWork:[], tailorPayments:[],
    cutters:[], cutterWork:[], cutterPayments:[],
    hoodaris:[], hoodariWork:[], hoodariPayments:[],
    models:[], sales:[], profitAdjustments:[], debts:[], debtPayments:[], customerDebts:[], customerDebtPayments:[],
    materials:[], materialMoves:[], saleSeq:0, returns:[],
    notes:[],
    pieceAdjust:{},
    partnership:null
  };
}
let firebaseUserReady = null; // promise resolved once anonymous auth finishes (firestore mode only)
if(firebaseReady){
  firebaseUserReady = new Promise((resolve)=>{
    firebase.auth().onAuthStateChanged(user=>{
      if(user) resolve(user);
      else firebase.auth().signInAnonymously().catch(e=>{
        console.error('firebase auth failed', e);
        toast('⚠️ تعذر الاتصال بـ Firebase — تحقق من إعدادات المشروع');
        resolve(null);
      });
    });
  });
}

async function loadStateAsync(){
  if(firebaseReady){
    try{
      await firebaseUserReady;
      let doc = await db.doc(FIRESTORE_DOC).get();
      if(doc.exists){ lastSeenRev = doc.data()._savedAt || null; return await resolveCloudImages(Object.assign(defaultState(), doc.data())); }
      // أول تشغيل بالنسخة الجديدة: انقلي البيانات من المستند القديم
      const legacy = await db.doc(LEGACY_FIRESTORE_DOC).get();
      if(legacy.exists){ lastSeenRev = null; window._needsFirstSave = true; return await resolveCloudImages(Object.assign(defaultState(), legacy.data())); }
    }catch(e){ console.error('firestore load failed', e); window._loadFailed = true; toast('⚠️ تعذر تحميل البيانات من Firebase'); }
    return defaultState();
  }
  if(hasCloudStorage){
    try{
      const res = await window.storage.get(STORAGE_KEY, true); // shared=true: same data for anyone with the link
      if(res && res.value) return Object.assign(defaultState(), JSON.parse(res.value));
    }catch(e){ /* key not created yet on first run — use defaults */ }
    return defaultState();
  }
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    return Object.assign(defaultState(), JSON.parse(raw));
  }catch(e){ return defaultState(); }
}
let state = defaultState();

/* ---- وقت تسجيل العمليات ---- */
const TS_COLLS=['sales','expenses','debts','debtPayments','customerDebts','customerDebtPayments','materialMoves','returns'];
function saleNosAssign(){
  if(!state||!Array.isArray(state.sales)) return;
  let seq=num(state.saleSeq); const byOrder={};
  state.sales.forEach(x=>{ if(x.no && x.orderId) byOrder[x.orderId]=x.no; if(x.no) seq=Math.max(seq,num(x.no)); });
  const todo=state.sales.filter(x=>!x.no).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||String(a.createdAt||'').localeCompare(String(b.createdAt||'')));
  todo.forEach(x=>{ if(x.orderId && byOrder[x.orderId]){ x.no=byOrder[x.orderId]; return; } x.no=++seq; if(x.orderId) byOrder[x.orderId]=x.no; });
  state.saleSeq=seq;
}
function tsMigrate(){ if(!state) return; if(!Array.isArray(state.materials)) state.materials=[]; if(!Array.isArray(state.materialMoves)) state.materialMoves=[]; if(!Array.isArray(state.returns)) state.returns=[]; try{ saleNosAssign(); }catch(e){} if(state._ts) return; TS_COLLS.forEach(k=>(state[k]||[]).forEach(r=>{ if(r && r.createdAt===undefined) r.createdAt=''; })); state._ts=true; }
function tsStamp(){ try{ saleNosAssign(); }catch(e){} const now=new Date().toISOString(); TS_COLLS.forEach(k=>(state[k]||[]).forEach(r=>{ if(r && r.createdAt===undefined) r.createdAt=now; })); }
function tmLabel(r){ if(!r||!r.createdAt) return ''; const d=new Date(r.createdAt); if(isNaN(d)) return ''; let h=d.getHours(), m=d.getMinutes(); const ap=h>=12?'م':'ص'; h=h%12||12; return h+':'+String(m).padStart(2,'0')+' '+ap; }
function dtCell(r){ const t=tmLabel(r); return esc(r.date)+(t?`<div class="tm">🕐 ${t}</div>`:''); }

/* ---- دمج ثلاثي: إذا جهاز ثاني كتب قبلك، ندمج تغييراتك وتغييراته بدل ما نرمي عملك ---- */
let syncBaseJSON = null, conflictRetries = 0;
function mergeArrById(b,l,sv){
  const J=JSON.stringify, bm=new Map(b.map(x=>[x.id,x])), lm=new Map(l.map(x=>[x.id,x])), sm=new Map(sv.map(x=>[x.id,x]));
  const out=[];
  sv.forEach(x=>{
    const inB=bm.has(x.id), inL=lm.has(x.id);
    if(inB && !inL) return;                       // انحذف عندك
    if(inL){ const lx=lm.get(x.id), bx=bm.get(x.id); out.push(bx && J(lx)===J(bx) ? x : lx); } // عدّلتي: عدّلك يغلب، وإلا نسخة السيرفر
    else out.push(x);                              // جديد من الجهاز الثاني
  });
  l.forEach(x=>{ if(!sm.has(x.id)){ if(!bm.has(x.id)) out.push(x); else if(J(x)!==J(bm.get(x.id))) out.push(x); } }); // جديد عندك
  return out;
}
function mergeVal(b,l,sv,depth){
  const J=JSON.stringify;
  if(J(l)===J(b)) return sv===undefined ? l : sv;
  if(J(sv)===J(b)) return l;
  if(J(l)===J(sv)) return l;
  const isIdArr=a=>Array.isArray(a)&&a.every(x=>x&&typeof x==='object'&&x.id!==undefined);
  if(isIdArr(l)&&isIdArr(sv)&&(b===undefined||b===null||isIdArr(b))) return mergeArrById(b||[],l,sv);
  if(l&&sv&&typeof l==='object'&&typeof sv==='object'&&!Array.isArray(l)&&!Array.isArray(sv)&&depth<4){
    const o={}; new Set([...Object.keys(l),...Object.keys(sv)]).forEach(k=>{ o[k]=mergeVal(b&&typeof b==='object'?b[k]:undefined,l[k],sv[k],depth+1); }); return o;
  }
  return l;
}
function mergeStates(base,local,server){
  const out={}; new Set([...Object.keys(local),...Object.keys(server)]).forEach(k=>{ out[k]=mergeVal(base?base[k]:undefined,local[k],server[k],0); });
  return out;
}
let saveQueued = false;
/* ---- الصور: كل صورة تُضغط وتنحفظ بمستند Firestore مستقل، لأن المستند الواحد حده 1MB ---- */
function compressImageInto(file, reader){
  const fr = new FileReader();
  fr.onload = ev=>{
    const img = new Image();
    img.onload = ()=>{
      const MAX = 700;
      const k = Math.min(1, MAX/Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      reader.onload({target:{result: c.toDataURL('image/jpeg', 0.6)}});
    };
    img.onerror = ()=> toast('تعذر قراءة الصورة');
    img.src = ev.target.result;
  };
  fr.readAsDataURL(file);
}
function imgHashId(s){
  let a = 5381, b = 52711;
  for(let i=0;i<s.length;i++){ const c = s.charCodeAt(i); a = ((a<<5)+a) ^ c; b = ((b<<5)+b+i) ^ c; }
  return (a>>>0).toString(36)+(b>>>0).toString(36)+s.length.toString(36);
}
const uploadedImgIds = new Set();
const imgCache = {};
let lastImageError = null;
async function packStateForCloud(){
  const copy = JSON.parse(JSON.stringify(state));
  const jobs = [];
  const failed = new Set();
  (copy.models||[]).forEach(m=>{
    m.images = (m.images||[]).map(src=>{
      if(typeof src==='string' && src.startsWith('data:')){
        const id = imgHashId(src);
        imgCache[id] = src;
        if(!uploadedImgIds.has(id)){
          jobs.push(db.doc('erp_state/img_'+id).set({data:src}).then(()=>uploadedImgIds.add(id)).catch(e=>{ failed.add(id); console.error('image doc save failed', e); lastImageError = e; }));
        }
        return {id, src};
      }
      return src;
    });
  });
  (copy.materials||[]).forEach(m=>{
    const src=m.image;
    if(typeof src==='string' && src.startsWith('data:')){
      const id = imgHashId(src); imgCache[id] = src;
      if(!uploadedImgIds.has(id)) jobs.push(db.doc('erp_state/img_'+id).set({data:src}).then(()=>uploadedImgIds.add(id)).catch(e=>{ failed.add(id); console.error('image doc save failed', e); lastImageError = e; }));
      m.image = {id, src};
    }
  });
  await Promise.all(jobs);
  (copy.materials||[]).forEach(m=>{ if(m.image && typeof m.image==='object') m.image = failed.has(m.image.id) ? m.image.src : 'fsimg:'+m.image.id; });
  // الصور الي تعذر رفعها كمستند مستقل تنحفظ داخل المستند الرئيسي إذا الحجم يسمح
  (copy.models||[]).forEach(m=>{
    m.images = (m.images||[]).map(s=> (s && typeof s==='object') ? (failed.has(s.id) ? s.src : 'fsimg:'+s.id) : s);
  });
  return copy;
}
async function resolveCloudImages(st){
  const ids = new Set();
  (st.models||[]).forEach(m=>(m.images||[]).forEach(s=>{ if(typeof s==='string' && s.startsWith('fsimg:')) ids.add(s.slice(6)); }));
  (st.materials||[]).forEach(m=>{ if(typeof m.image==='string' && m.image.startsWith('fsimg:')) ids.add(m.image.slice(6)); });
  const map = {};
  await Promise.all([...ids].map(async id=>{
    if(imgCache[id]){ map[id] = imgCache[id]; return; }
    try{ const d = await db.doc('erp_state/img_'+id).get(); if(d.exists){ map[id] = d.data().data; imgCache[id] = map[id]; uploadedImgIds.add(id); } }catch(e){ console.error('image load failed', e); }
  }));
  (st.models||[]).forEach(m=>{
    m.images = (m.images||[]).map(s=> (typeof s==='string' && s.startsWith('fsimg:')) ? (map[s.slice(6)]||'') : s).filter(Boolean);
  });
  (st.materials||[]).forEach(m=>{ if(typeof m.image==='string' && m.image.startsWith('fsimg:')) m.image = map[m.image.slice(6)]||''; });
  return st;
}
/* حالة الحفظ: بانر ثابت يبين إذا آخر تغييراتك ما انحفظت، وما نسمح لنسخة قديمة من السحابة ترجّع المحذوفات */
let localRev = 0;
let pendingSaves = 0, saveChain = Promise.resolve(), saveFailure = null, lastSavedBytes = 0;
function showSyncBadge(ok){
  let el = document.getElementById('syncBadge');
  if(!el){
    el = document.createElement('div'); el.id = 'syncBadge';
    el.style.cssText = 'position:fixed;bottom:8px;left:8px;z-index:9998;background:var(--surface);border:1px solid var(--border-strong);color:var(--text-dim);padding:4px 10px;border-radius:999px;font-size:11.5px;pointer-events:none;';
    document.body.appendChild(el);
  }
  const d = new Date(), p2 = n=>String(n).padStart(2,'0');
  el.textContent = ok==='saving' ? '⏳ جاري الحفظ…' : ('☁️ ' + CLIENT_VERSION + ' · تأكد الحفظ بالسيرفر ' + p2(d.getHours()) + ':' + p2(d.getMinutes()));
}
function showSaveBanner(){
  let el = document.getElementById('saveBanner');
  if(!saveFailure){ if(el) el.remove(); return; }
  if(!el){
    el = document.createElement('div'); el.id = 'saveBanner';
    el.style.cssText = 'position:fixed;top:0;right:0;left:0;z-index:9999;background:#7a2e1f;color:#fff;padding:10px 16px;font-size:13.5px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;';
    document.body.appendChild(el);
  }
  el.innerHTML = '<span>⚠️ آخر تغييراتك ما انحفظت بالسحابة ('+esc(saveFailure.code)+') — '+esc(saveFailure.why)+' — لا تغلقين الصفحة.</span><span><button class="btn sm" style="min-height:30px" onclick="saveState()">إعادة المحاولة</button> <button class="btn sm ghost" style="min-height:30px" onclick="saveFailure=null;showSaveBanner()">إخفاء</button></span>';
}
function saveState(){
  if(firebaseReady){
    if(window._loadFailed){ saveFailure = {code:'load-failed', why:'ما انحمّلت بياناتك من السحابة فمنعت الحفظ حتى ما تنمسح بياناتك. حدّثي الصفحة (Ctrl+Shift+R) وتأكدي من الإنترنت'}; showSaveBanner(); return; }
    localRev++;
    pendingSaves++; saveQueued = true; showSyncBadge('saving');
    saveChain = saveChain.then(async ()=>{
      try{
        await firebaseUserReady;
        const snapNow = JSON.stringify(state);
        const packed = await packStateForCloud();
        lastSavedBytes = JSON.stringify(packed).length;
        packed._savedAt = Date.now() + '-' + Math.random().toString(36).slice(2,8);
        const ref = db.doc(FIRESTORE_DOC);
        // set() ما ترجع إلا بعد تأكيد السيرفر؛ إذا الاتصال محجوب تعلق للأبد، فنحط مهلة
        packed._by = DEVICE_ID + ':' + CLIENT_VERSION;
        await Promise.race([db.runTransaction(async tx=>{
          const s = await tx.get(ref);
          if(s.exists){
            const cd = s.data();
            const bv = parseInt(String(cd._by||'').split(':')[1].replace(/\D/g,''),10)||0;
            if(bv > CLIENT_NUM){ const x=new Error('outdated client'); x.code='outdated'; throw x; }
            if((cd._savedAt||null) !== lastSeenRev){ const x=new Error('conflict'); x.code='conflict'; throw x; }
            Object.keys(cd).forEach(k=>{ if(!(k in packed)) packed[k]=cd[k]; });
          }
          tx.set(ref, packed);
        }), new Promise((_,rej)=>setTimeout(()=>{ const x=new Error('no response from Firebase'); x.code='timeout'; rej(x); }, 12000))]);
        // نقرأ من السيرفر نفسه للتأكد إن التغيير فعلاً انحفظ ولا أحد كتب فوقه
        const back = await ref.get({source:'server'});
        lastSeenRev = packed._savedAt;
        if(!back.exists){ const x=new Error('doc missing after save'); x.code='verify-failed'; throw x; }
        if(back.data()._savedAt !== packed._savedAt){
          // لو الكاتب الأخير جهازك نفسه (حفظ أحدث) فهذا طبيعي؛ فقط جهاز ثاني يعتبر تعارض
          const by = String(back.data()._by||'');
          if(!by.startsWith(DEVICE_ID+':')){ const x=new Error('another device wrote'); x.code='conflict'; throw x; }
          lastSeenRev = back.data()._savedAt;
        }
        saveFailure = null; conflictRetries = 0; syncBaseJSON = snapNow;
        showSyncBadge(true);
      }catch(e){
        console.error('firestore save failed', e);
        if(e && e.code==='conflict'){
          // جهاز ثاني غيّر البيانات قبلك: حمّلي نسخته بدل ما نكتب فوقها
          try{
            const cur = await db.doc(FIRESTORE_DOC).get({source:'server'});
            if(cur.exists){
              const srv = await resolveCloudImages(Object.assign(defaultState(), cur.data()));
              const loc = JSON.parse(JSON.stringify(state)), base = syncBaseJSON ? JSON.parse(syncBaseJSON) : null;
              lastSeenRev = cur.data()._savedAt || null;
              state = mergeStates(base, loc, srv); tsMigrate(); syncBaseJSON = JSON.stringify(srv);
            }
          }catch(e2){ console.error('merge failed', e2); }
          saveFailure = null; pendingSaves--; saveQueued = pendingSaves>0; showSaveBanner(); render();
          conflictRetries++;
          if(conflictRetries<=4){ toast('🔄 جهاز ثاني غيّر البيانات — دمجت تغييراتك وياها وانحفظت'); saveState(); }
          else { saveFailure = {code:'conflict', why:'تعارض متكرر مع جهاز ثاني. اضغط «أعد المحاولة» أو حدّث الصفحة'}; showSaveBanner(); }
          return;
        }
        const code = (e && (e.code||e.message)) || 'unknown';
        const err = lastImageError || e;
        const why = (e && e.code==='outdated') ? 'نسخة التطبيق عندك قديمة وجهاز ثاني يستخدم نسخة أحدث — حدّث الصفحة (سكّر التطبيق وافتحه من جديد) حتى ما تضيع بيانات مثل المرتجعات'
                  : (e && e.code==='timeout') ? 'Firebase ما رد خلال 12 ثانية، غالباً شي يحجب الاتصال (إضافة حجب إعلانات أو برنامج حماية أو شبكة تمنع firestore.googleapis.com). جربي متصفح ثاني أو عطّلي الإضافات'
                  : (e && e.code==='verify-failed') ? 'انكتب التغيير بس السيرفر رجّع نسخة ثانية، احتمال جهاز ثاني يكتب فوقه. سكّري الموقع على كل الأجهزة الثانية'
                  : (err && err.code==='permission-denied') ? 'صلاحيات Firestore ما تسمح بالحفظ، افتحي Rules وخلي allow read, write: if request.auth != null; على كل المستندات'
                  : (/exceeds|size|too large|longer than/i.test(String(e&&e.message)) || lastSavedBytes>900000) ? 'حجم البيانات كبير ('+Math.round(lastSavedBytes/1024)+' KB من 1024)، قللي عدد الصور'
                  : 'تحقق من الاتصال بالإنترنت';
        saveFailure = {code, why};
      }
      pendingSaves--; saveQueued = pendingSaves>0;
      showSaveBanner();
    });
    return;
  }
  if(hasCloudStorage){
    saveQueued = true;
    window.storage.set(STORAGE_KEY, JSON.stringify(state), true)
      .then(()=>{ saveQueued = false; })
      .catch(e=>{ saveQueued = false; console.error('cloud save failed', e); toast('⚠️ تعذر حفظ البيانات — تحقق من الاتصال بالإنترنت'); });
  } else {
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }
}
window.addEventListener('beforeunload',e=>{ if(saveQueued||saveFailure){ e.preventDefault(); e.returnValue=''; return ''; } });
/* real-time sync across devices/tabs when using Firebase */
function attachFirestoreSync(){
  if(!firebaseReady) return;
  firebaseUserReady.then(()=>{
    db.doc(FIRESTORE_DOC).onSnapshot(async doc=>{
      if(!doc.exists || saveQueued || saveFailure) return; // ignore echoes of our own pending write / unsaved local changes
      if(doc.metadata && doc.metadata.hasPendingWrites) return;
      const rev0 = localRev;
      const next = await resolveCloudImages(Object.assign(defaultState(), doc.data()));
      // إذا سويتي تعديل وإحنا ننتظر الصور، هذي اللقطة صارت قديمة: لا ترجّعيها فوق تعديلك
      if(saveQueued || saveFailure || localRev!==rev0) return;
      lastSeenRev = doc.data()._savedAt || null;
      state = next; tsMigrate(); syncBaseJSON = JSON.stringify(next);
      render();
    });
  });
}

function toCSV(headers, rows){

function modelById(id){ return state.models.find(m=>m.id===id); }
function tailorById(id){ return state.tailors.find(t=>t.id===id); }

function modelCost(m){
  if(!m) return 0;
  if(m.unitCost!=null && m.unitCost!=='') return num(m.unitCost);
  return num(m.fabricCost)+num(m.sewingCost)+num(m.cuttingCost)+num(m.factoryCost)+num(m.accessoriesCost)+num(m.packagingCost)+num(m.otherCost);
}
function nextModelCode(){
  let mx = num(state.settings.modelSeq);
  state.models.forEach(m=>{ if(/^\d+$/.test(String(m.code||'').trim())) mx = Math.max(mx, parseInt(m.code,10)); });
  state.settings.modelSeq = mx + 1;
  return String(mx + 1);
}
function modelProfitPerPiece(m){ return num(m.sellingPrice) - modelCost(m); }
function modelWholesaleProfitPerPiece(m){ return num(m.wholesalePrice!=null && m.wholesalePrice!==''?m.wholesalePrice:m.sellingPrice) - modelCost(m); }
function modelPriceFor(m, type){
  if(!m) return 0;
  if(type==='wholesale' && m.wholesalePrice!=null && m.wholesalePrice!=='' && num(m.wholesalePrice)>0) return num(m.wholesalePrice);
  return num(m.sellingPrice);
}

function tailorTotals(tailorId){

    .reduce((s,p)=> s + num(p.amount), 0);

function debtById(id){ return state.debts.find(d=>d.id===id); }

/* ---- ربح تدريجي من ديون الزبائن: كل فلوس تستلمها (وقت التسجيل أو وقت التحصيل)
   تتحول لربح فوراً حسب هامش الربح المحفوظ على الدين وقت إنشائه ---- */
function customerDebtPaymentsOf(id){ return state.customerDebtPayments.filter(p=>p.customerDebtId===id); }
function customerDebtMargin(d){
  if(!d) return 0;
  if(d.profitMargin!=null && !isNaN(num(d.profitMargin))) return num(d.profitMargin);
  // ديون قديمة مسجلة قبل ميزة الربح التلقائي: نحسب الهامش من تكلفة الموديل الحالية
  // دين ناتج من عملية بيع: نفس هامش البيع
  const linkedSale = state.sales.find(s=>s.linkedDebtId===d.id);
  if(linkedSale) return saleMargin(linkedSale);
  const amount = num(d.amount), qty = num(d.quantity) || 1;
  const cost = d.costSnapshot!=null ? num(d.costSnapshot) : (d.modelId && modelById(d.modelId) ? modelCost(modelById(d.modelId)) : 0);
  return amount>0 ? (amount - qty*cost)/amount : 0;
}
function allDebtCashEvents(){
  return state.customerDebtPayments.map(p=>{
    const d = customerDebtById(p.customerDebtId);
    const margin = customerDebtMargin(d);
    const amount = num(p.amount);
    const profit = amount*margin;
    return {id:p.id, date:p.date, amount, profit, cost:amount-profit, modelId: d?d.modelId:null, debtId:p.customerDebtId};
  });
}
function debtCashEventsInRange(from,to){ return allDebtCashEvents().filter(e=>inRange(e.date, from, to)); }
function totalCustomerDebtCashProfit(){ return allDebtCashEvents().reduce((s,e)=>s+e.profit,0); }

/* الأرباح تُحسب على المبلغ المستلم فعلاً: كل دفعة تأخذ نسبتها من الربح، والمتبقي ينتظر التحصيل */
/* كلفة القطعة: البيع عبر الصفحة يستعمل «سعر القطعة للصفحة» (مفرد أو جملة حسب نوع البيع) إذا مكتوب بالموديل، وإلا الكلفة الأصلية. المعمل دائماً الكلفة الأصلية */
function unitCostFor(modelId, channel, customerType){
  const m = modelById(modelId); if(!m) return 0;
  if(channel==='page'){ const pp = customerType==='wholesale' ? num(m.pagePriceW) : num(m.pagePrice); if(pp>0) return pp; }
  return modelCost(m);
}
function saleUnitCost(s){ return num(s.costSnapshot!=null?s.costSnapshot:modelCost(modelById(s.modelId))); }
function saleMargin(s){
  const price = num(s.unitPrice);
  return price>0 ? (price - saleUnitCost(s))/price : 0;
}
function saleRevenue(s){ return s.amountReceived!=null ? num(s.amountReceived) : num(s.quantity)*num(s.unitPrice); }
function saleCost(s){ return saleRevenue(s)*(1-saleMargin(s)); }
function saleProfit(s){ return saleRevenue(s) - saleCost(s); }
function saleProductLabel(s){
  if(s.modelId){ const m = modelById(s.modelId); return m ? m.name : 'موديل محذوف'; }
  return s.productLabel || 'بيع بدون موديل';
}

/* مصدر المصروف: capital = يُخصم من رأس المال، profit = يُخصم من الأرباح، other = يُسجَّل فقط بدون خصم.
   المصاريف القديمة (بدون مصدر) تُعامل كأنها من الأرباح مثل ما كانت تنحسب سابقاً */
const EXPENSE_SOURCES = {capital:'رأس المال', profit:'الأرباح', other:'غير ذلك (بدون خصم)'};
function expenseSource(e){ return (e && e.source && EXPENSE_SOURCES[e.source]) ? e.source : 'profit'; }
function sumExpensesBySource(list, src){ return list.filter(e=>expenseSource(e)===src).reduce((s,x)=>s+num(x.amount),0); }

/* دفعات الخياطين والفصالين والهودارية: إذا الدفعة معلّمة "من رأس المال" تنخصم من رأس المال.
   الدفعات القديمة (بدون علامة) ما تنخصم حتى ما يتغير رأس المال المسجل سابقاً */
/* تسديد الديون اللي علينا: كل تسديد ينخصم من رأس المال (إلا إذا اتشال منه الخيار).
   الدين نفسه ما ينخصم وقت تسجيله — ينخصم بس لما تسدده، حتى ما ينخصم مرتين.
   التسديدات القديمة (بدون علامة) تنحسب مخصومة مثل ما كانت محسوبة سابقاً ضمن الدين */
function debtRepaymentsFromCapital(){
  return (state.debtPayments||[]).filter(p=>p.fromCapital!==false && debtById(p.debtId)).reduce((s,p)=>s+num(p.amount),0);
}
function workerPaymentsFromCapital(){
  const sum = list => (list||[]).filter(p=>p.fromCapital).reduce((s,p)=>s+num(p.amount),0);
  return sum(state.tailorPayments) + sum(state.cutterPayments) + sum(state.hoodariPayments);
}
function fromCapitalFieldHtml(item){
  const checked = item ? !!item.fromCapital : true;
  return `
      <label style="display:flex;gap:9px;align-items:center;cursor:pointer;font-size:13.5px;">
        <input type="checkbox" id="f_fromCapital" ${checked?'checked':''} style="width:auto;margin:0;">
        <span>خصم هذا المبلغ من رأس المال</span>
      </label>
      <div class="hint">${item && !item.fromCapital ? 'هذي دفعة قديمة ما انخصمت من رأس المال سابقاً. فعّل الخيار إذا تريد تنخصم هسه. ' : ''}إذا حذفت الدفعة يرجع المبلغ لرأس المال تلقائياً. لا تسجل نفس الدفعة كمصروف حتى ما تنخصم مرتين.</div>`;
}
function capitalTotal(){
  // كل مبلغ يوصلك (بيع أو تحصيل دين) يدخل رأس المال كاملاً، وحصته من الربح تدخل صافي الربح
  const totalReceived = state.sales.reduce((s,x)=> s + saleRevenue(x), 0) + allDebtCashEvents().reduce((s,e)=> s + e.amount, 0);
  const totalExpenses = sumExpensesBySource(state.expenses,'profit') + sumExpensesBySource(state.expenses,'capital');
  return num(state.settings.capitalBase) + totalReceived - totalExpenses - debtRepaymentsFromCapital() - workerPaymentsFromCapital();
}
function periodTotals(from, to){
  const sales = state.sales.filter(s=>inRange(s.date, from, to));
  const expenses = state.expenses.filter(e=>inRange(e.date, from, to));
  const work = state.tailorWork.filter(w=>inRange(w.date, from, to));
  const cutWork = state.cutterWork.filter(w=>inRange(w.date, from, to));
  const hoodWork = state.hoodariWork.filter(w=>inRange(w.date, from, to));
  const debtCash = debtCashEventsInRange(from, to);
  const revenue = sales.reduce((s,x)=>s+saleRevenue(x),0) + debtCash.reduce((s,e)=>s+e.amount,0);
  const cogs = sales.reduce((s,x)=>s+saleCost(x),0) + debtCash.reduce((s,e)=>s+e.cost,0);
  const expTotal = expenses.reduce((s,x)=>s+num(x.amount),0);
  const sewnPieces = work.reduce((s,x)=>s+num(x.pieceCount),0);
  const cutPieces = cutWork.reduce((s,x)=>s+num(x.pieceCount),0);
  const hoodPieces = hoodWork.reduce((s,x)=>s+num(x.pieceCount),0);
  const piecesProduced = Math.max(0, sewnPieces + pieceAdjustInRange(from, to));
  const piecesSold = sales.reduce((s,x)=>s+num(x.quantity),0);
  const sewingCostPeriod = work.reduce((s,x)=>s+num(x.pieceCount)*num(x.pricePerPiece),0);
  const cuttingCostPeriod = cutWork.reduce((s,x)=>s+num(x.pieceCount)*num(x.pricePerPiece),0);
  const hoodariCostPeriod = hoodWork.reduce((s,x)=>s+num(x.pieceCount)*num(x.pricePerPiece),0);
  const profitExpTotal = sumExpensesBySource(expenses,'profit');
  const capitalExpTotal = sumExpensesBySource(expenses,'capital');
  const otherExpTotal = sumExpensesBySource(expenses,'other');
  const profitAdj = (state.profitAdjustments||[]).filter(a=>inRange(a.date, from, to)).reduce((s,a)=>s+num(a.amount),0);
  const netProfit = revenue - cogs - profitExpTotal + profitAdj;
  return {revenue,cogs,expTotal,profitAdj,profitExpTotal,capitalExpTotal,otherExpTotal,piecesProduced,sewnPieces,cutPieces,hoodPieces,piecesSold,sewingCostPeriod,cuttingCostPeriod,hoodariCostPeriod,netProfit,salesCount:sales.length};
}
function tailorDuesOutstandingTotal(){
  return state.tailors.reduce((s,t)=> s + tailorTotals(t.id).remaining, 0);
}

  return {total:sl.reduce((a,x)=>a+saleRevenue(x),0)+ev.reduce((a,e)=>a+e.amount,0),

function statCard(label, value, cls, sub, hero, onClick, delta){

}

function monthOptionsList(selected){
  const opts = [];

  for(let i=0;i<12;i++){
    const d = new Date(base.getFullYear(), base.getMonth()-i, 1);
    const ym = ymOfDate(d);
    seen.add(ym);
    opts.push(`<option value="${ym}" ${ym===selected?'selected':''}>${monthLabelAr(ym)}</option>`);

/* =========================================================
   القطع المنتجة — سجل شهري قابل للتعديل والتصفير
   القيمة = قطع الخياطين المسجلة بالشهر + تعديل يدوي (pieceAdjust).
   تصفير/تعديل شهر يضبط الرقم، وأي شغل جديد ينضاف فوقه.
========================================================= */
function pieceAdjustFor(ym){ return num((state.pieceAdjust||{})[ym]); }
function pieceAdjustInRange(from, to){
  return Object.keys(state.pieceAdjust||{}).filter(ym=>inRange(ym+'-01', from, to)).reduce((s,ym)=>s+num(state.pieceAdjust[ym]),0)
       + Object.keys(state.pieceAdjustWeek||{}).filter(s=>inRange(s, from, to)).reduce((a,s)=>a+num(state.pieceAdjustWeek[s]),0);
}
function sewnPiecesForMonth(ym){
  return state.tailorWork.filter(w=>String(w.date||'').slice(0,7)===ym).reduce((s,w)=>s+num(w.pieceCount),0);
}
function weekAdjInMonth(ym){ return Object.keys(state.pieceAdjustWeek||{}).filter(s=>s.slice(0,7)===ym).reduce((a,s)=>a+num(state.pieceAdjustWeek[s]),0); }
function producedForMonth(ym){ return Math.max(0, sewnPiecesForMonth(ym) + pieceAdjustFor(ym) + weekAdjInMonth(ym)); }
function setProducedForMonth(ym, value){
  if(!state.pieceAdjust) state.pieceAdjust = {};
  state.pieceAdjust[ym] = Math.max(0, Math.round(num(value))) - sewnPiecesForMonth(ym) - weekAdjInMonth(ym);
}
function productionMonths(){
  const set = new Set([thisMonth()]);
  state.tailorWork.forEach(w=>{ if(w.date) set.add(String(w.date).slice(0,7)); });
  Object.keys(state.pieceAdjust||{}).forEach(k=>set.add(k));
  (state.productionMonthsExtra||[]).forEach(k=>set.add(k));
  return [...set].filter(k=>/^\d{4}-\d{2}$/.test(k)).sort().reverse();
}

function isoOfDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDaysISO(iso,n){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return isoOfDate(d); }
function weekStartOf(iso){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()-((d.getDay()+1)%7)); return isoOfDate(d); }
function weekEndOf(s){ return addDaysISO(s,6); }
function fmtShort(iso){ const p=String(iso).split('-'); return Number(p[2])+'/'+Number(p[1]); }
function weekLabel(s){ return fmtShort(s)+' ← '+fmtShort(weekEndOf(s)); }
function workIn(list,a,b){ return list.filter(w=>w.date && w.date>=a && w.date<=b); }
function sewnInRange(a,b){ return workIn(state.tailorWork,a,b).reduce((s,w)=>s+num(w.pieceCount),0); }
function weekAdjFor(s){ return num((state.pieceAdjustWeek||{})[s]); }
function weekProduced(s){ return Math.max(0, sewnInRange(s,weekEndOf(s)) + weekAdjFor(s)); }
function weekCosts(s){
  const e=weekEndOf(s), c=(l)=>workIn(l,s,e).reduce((a,w)=>a+num(w.pieceCount)*num(w.pricePerPiece),0);
  const p=(l)=>workIn(l,s,e).reduce((a,w)=>a+num(w.pieceCount),0);
  return {tailors:c(state.tailorWork),cutters:c(state.cutterWork),hoodaris:c(state.hoodariWork),cutPcs:p(state.cutterWork),hoodPcs:p(state.hoodariWork)};
}
function productionWeeks(){
  const set=new Set([weekStartOf(todayISO())]);
  [state.tailorWork,state.cutterWork,state.hoodariWork].forEach(l=>l.forEach(w=>{ if(w.date) set.add(weekStartOf(w.date)); }));
  Object.keys(state.pieceAdjustWeek||{}).forEach(k=>set.add(k));
  (state.productionWeeks||[]).forEach(k=>set.add(k));
  return [...set].filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort().reverse();
}

function prodMonthWeeks(ym){
  const first=ym+'-01', last=ym+'-'+String(new Date(Number(ym.slice(0,4)),Number(ym.slice(5,7)),0).getDate()).padStart(2,'0');

function settleTailor(id){
  const t = tailorById(id); if(!t) return;
  confirmDelete('تصفير حساب '+t.name+'؟ يصير المستحق والمدفوع والمتبقي صفر وتختفي سجلات شغله من صفحته. القطع المنتجة ورأس المال والتقارير ما تتغير.', ()=>{
    state.tailorWork.forEach(w=>{ if(w.tailorId===id) w.archived = true; });
    state.tailorPayments.forEach(p=>{ if(p.tailorId===id) p.archived = true; });
    saveState(); render(); toast('تم تصفير حساب '+t.name);
  });
}

function workModelPickerHtml(selectedModelId){
  return `

function onWorkModelSelectChange(){
  const val = document.getElementById('f_model').value;
  const box = document.getElementById('workNewModelFields');
  if(box) box.style.display = (val==='__NEW__') ? 'flex' : 'none';
}
function workModelGalleryPreviewHtml(){
  return pendingWorkModelImages.map((src,i)=>`<div class="thumb-x"><img src="${src}"><button type="button" onclick="removeWorkModelImage(${i})">×</button></div>`).join('');
}
function removeWorkModelImage(i){
  pendingWorkModelImages.splice(i,1);
  const el = document.getElementById('workModelGalleryPreview');
  if(el) el.innerHTML = workModelGalleryPreviewHtml();
}
function handleWorkModelImageUpload(evt){
  const files = Array.from(evt.target.files || []);
  if(!files.length) return;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = e=>{
      pendingWorkModelImages.push(e.target.result);
      const el = document.getElementById('workModelGalleryPreview');
      if(el) el.innerHTML = workModelGalleryPreviewHtml();
    };
    compressImageInto(file, reader);
  });
}
// Returns {ok:true, modelId} or {ok:false, msg}
function resolveWorkModelId(){
  const val = document.getElementById('f_model').value;
  if(val === '__NEW__'){
    const name = document.getElementById('f_newModelName').value.trim();
    if(!name) return {ok:false, msg:'الرجاء إدخال اسم الموديل الجديد، أو اختر "بدون تحديد"'};
    const newModel = {
      id: uid(), name,
      code: nextModelCode(),
      images: [...pendingWorkModelImages],
      fabricCost:0, sewingCost:0, accessoriesCost:0, packagingCost:0, otherCost:0,
      sellingPrice:0, notes:''
    };
    state.models.push(newModel);
    return {ok:true, modelId:newModel.id};
  }
  return {ok:true, modelId: val || null};
}

function modelPcs(id,from,to){ return state.sales.filter(x=>x.modelId===id && x.date>=from && x.date<=to).reduce((a,x)=>a+num(x.quantity),0); }
function modelTrend(id){
  const t=todayISO(), cm=t.slice(0,7), pm=ymAdd(cm,-1), d=t.slice(8,10);
  const cur=modelPcs(id,cm+'-01',t), prev=modelPcs(id,pm+'-01',pm+'-'+(d>'28'?'31':d));
  return {cur,prev};
}
function trendChip(id,full){
  const {cur,prev}=modelTrend(id); if(!cur && !prev) return '';
  let up,txt;
  if(!prev){ up=true; txt='▲'; } else { const p=Math.round((cur-prev)/prev*100); if(p===0) return '<span class="tr flat">▬</span>'; up=p>0; txt=(up?'▲ ':'▼ ')+Math.abs(p)+'%'; }
  return `<span class="tr ${up?'up':'dn'}" title="القطع المباعة هذا الشهر (${cur}) مقابل نفس الفترة بالشهر الماضي (${prev})">${txt}${full?` <small>${cur} مقابل ${prev}</small>`:''}</span>`;
}
function modelStale(id){
  const last=state.sales.filter(x=>x.modelId===id).map(x=>x.date).sort().pop(); if(!last) return false;
  return dayDiff(last,todayISO())>30;
}

let modelsTab='models', pendingMatImage='', matFilter='', matCat='ALL';
const MAT_UNITS=['متر','قطعة','كيلو','رول','بكرة','علبة','كرتون','دزينة'];
const MAT_CATS=['قماش','خيط','أزرار وكبسات','سحابات','بطانة','تطريز وتفاصيل','تغليف','أخرى'];
function matQty(id){ return state.materialMoves.filter(m=>m.matId===id).reduce((a,m)=>a+(m.type==='in'?1:-1)*num(m.qty),0); }
function matById(id){ return state.materials.find(m=>m.id===id); }
function matStatus(m){ const q=matQty(m.id), mn=num(m.min); if(m.need) return {k:'need',l:'مطلوب شراؤه',c:'neg'}; if(q<=0) return {k:'out',l:'نفذ',c:'neg'}; if(mn>0 && q<=mn) return {k:'low',l:'قارب يخلص',c:'warn'}; return {k:'ok',l:'متوفر',c:'pos'}; }
function lowMaterials(){ return state.materials.filter(m=>matStatus(m).k!=='ok'); }
function modelsTabs(){ return modelsTab==='materials' ? `<button class="detail-back" onclick="modelsTab='models';render();window.scrollTo(0,0)">→ رجوع للموديلات</button>` : ''; }
function matFiltered(){ const q=matFilter.trim().toLowerCase(); return state.materials.filter(m=>(!q||String(m.name||'').toLowerCase().includes(q)) && (matCat==='ALL'||(m.cat||'أخرى')===matCat)); }
function renderMaterials(){
  const value=state.materials.reduce((a,m)=>a+Math.max(0,matQty(m.id))*num(m.cost),0), need=state.materials.filter(m=>m.need), low=state.materials.filter(m=>!m.need && matStatus(m).k!=='ok');
  const cats=['ALL',...MAT_CATS.filter(c=>state.materials.some(m=>(m.cat||'أخرى')===c)),...[...new Set(state.materials.map(m=>m.cat||'أخرى'))].filter(c=>!MAT_CATS.includes(c))];
  return `${modelsTabs()}
  <div class="page-head"><div><h1>🧵 اللوازم</h1><div class="desc">أقمشتك وخيوطك وأزرارك وكل تفاصيل الموديل: الكمية والسعر، وإذا خلص صنف تضيفه لقائمة الطلب</div></div><button class="btn primary" onclick="openMatModal()">+ إضافة صنف</button></div>
  <div class="grid stats">${statCard('عدد الأصناف',state.materials.length+' صنف','accent','بالمخزون')}${statCard('قيمة المخزون الحالية',money(value),'pos','الكمية × سعر الوحدة')}${statCard('مطلوب شراؤها',need.length+' صنف',need.length?'neg':'','بقائمة الطلب')}${statCard('قاربت تخلص',low.length+' صنف',low.length?'neg':'','تحت حد التنبيه أو نفذت')}</div>
  ${need.length?`<div class="gcard" style="margin-top:14px"><div class="gcard-h"><b>🛒 قائمة الطلب (${need.length})</b><span class="btn-row"><button class="btn sm" onclick="copyNeedList()">📋 نسخ</button><button class="btn sm" onclick="shareNeedList()">💬 واتساب</button></span></div>
    ${need.map(m=>`<div class="pr" style="align-items:center;gap:8px;flex-wrap:wrap"><span><b>${esc(m.name)}</b> <span class="muted">${esc(m.cat||'')}${m.need.note?' · '+esc(m.need.note):''}</span></span><span class="btn-row"><span class="muted">آخر سعر ${money(m.cost)} للوحدة</span><button class="btn sm primary" onclick="openMatMove('${m.id}','in')">✔ اشتريته / وصل</button><button class="btn sm ghost" onclick="clearMatNeed('${m.id}')">إلغاء الطلب</button></span></div>`).join('')}</div>`:''}
  ${low.length?`<div class="galert">⚠️ قاربت تخلص: ${low.map(m=>esc(m.name)+' ('+matQty(m.id)+' '+esc(m.unit||'')+')').join(' · ')}</div>`:''}
  <div class="btn-row" style="margin:14px 0 8px">${cats.map(c=>`<button class="btn sm ${matCat===c?'primary':''}" onclick="matCat='${c.replace(/'/g,'')}';render()">${c==='ALL'?'الكل':c} <span class="muted">${c==='ALL'?state.materials.length:state.materials.filter(m=>(m.cat||'أخرى')===c).length}</span></button>`).join('')}</div>
  <div class="toolbar" style="margin:0 0 14px;"><input type="search" placeholder="بحث باسم الصنف" value="${esc(matFilter)}" oninput="matFilter=this.value;matListRefresh()" style="min-width:240px"></div>
  <div id="matList">${matListHtml(matFiltered())}</div>`;
}
function matListRefresh(){ const el=document.getElementById('matList'); if(el) el.innerHTML=matListHtml(matFiltered()); }
function matListHtml(list){
  if(!state.materials.length) return '<div class="card" style="text-align:center;padding:40px 20px;"><div style="font-size:34px;">🧵</div><div style="font-weight:800;margin:8px 0;">ما اكو أصناف بعد</div><div class="desc" style="margin-bottom:14px;">أضف قماش أو خيط أو أزرار أو أي تفصيلة تدخل بالموديل، بسعرها وكميتها. الصورة اختيارية.</div><button class="btn primary" onclick="openMatModal()">+ إضافة أول صنف</button></div>';

    return `<div class="model-card"><div class="thumb" onclick="openMatLog('${m.id}')" style="cursor:pointer">${img}</div><div class="info">

      <div class="btn-row" style="margin-top:6px"><button class="btn sm ghost" onclick="openMatModal('${m.id}')">تعديل</button><button class="btn sm danger" onclick="deleteMat('${m.id}')">حذف</button></div>
    </div></div>`; }).join('')}</div>`;

function needListText(){ return '🛒 مطلوب شراؤه:\n'+state.materials.filter(m=>m.need).map(m=>'• '+m.name+(m.cat?' ('+m.cat+')':'')+(m.need.note?' — '+m.need.note:'')+' — آخر سعر '+money(m.cost)).join('\n'); }
function copyNeedList(){ const t=needListText(); (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('اننسخت القائمة'),()=>{ prompt('انسخ القائمة:',t); }); }
function shareNeedList(){ window.open('https://wa.me/?text='+encodeURIComponent(needListText()),'_blank'); }
function clearMatNeed(id){ const m=matById(id); if(m){ delete m.need; saveState(); render(); toast('انشال من قائمة الطلب'); } }

  onSave(){ const q2=matQty(id); if(q2>0) state.materialMoves.push({id:uid(),matId:id,type:'out',qty:q2,cost:m.cost,date:todayISO(),notes:'خلص'}); m.need={date:todayISO(),note:document.getElementById('f_n').value.trim()}; saveState(); closeModal(); render(); toast('انضاف لقائمة الطلب'); }});

function matImgPreview(){ return pendingMatImage?`<img src="${pendingMatImage}" style="max-width:120px;max-height:120px;border-radius:10px;display:block;margin-bottom:8px"><button type="button" class="btn sm danger" onclick="pendingMatImage='';document.getElementById('matImgBox').innerHTML=matImgPreview()">إزالة الصورة</button>`:'<span class="muted">بدون صورة</span>'; }

function openMatModal(id){
  const m=id?matById(id):null; pendingMatImage=m?(m.image||''):'';
  openModal({title:m?'تعديل صنف':'إضافة صنف',bodyHtml:`<div class="form-row"><label>اسم الصنف</label><input type="text" id="f_mn" value="${esc(m?m.name:'')}" placeholder="مثال: كريب أسود، خيط أسود، كبسات نحاسية"></div>
    <div class="form-grid2"><div class="form-row"><label>النوع</label><input type="text" id="f_mt" list="matCats" value="${esc(m?m.cat||'':(matCat!=='ALL'?matCat:'قماش'))}"><datalist id="matCats">${MAT_CATS.map(u=>`<option value="${u}">`).join('')}</datalist><div class="hint">اختر من القائمة أو اكتب نوع جديد</div></div>

    saveState(); closeModal(); render(); toast('تم الحفظ');
  }});
}
function openMatMove(id,type){
  const m=matById(id); if(!m) return; const isIn=type==='in';

function openMatLog(id){

function deleteMatMove(mid,id){ confirmDelete('حذف هذي الحركة؟ الكمية المتوفرة ترجع تنحسب بدونها.',()=>{ state.materialMoves=state.materialMoves.filter(x=>x.id!==mid); saveState(); render(); openMatLog(id); toast('تم الحذف'); }); }
function deleteMat(id){ confirmDelete('حذف الصنف مع كل حركاته؟',()=>{ state.materials=state.materials.filter(m=>m.id!==id); state.materialMoves=state.materialMoves.filter(x=>x.matId!==id); saveState(); render(); toast('تم الحذف'); }); }

/* ===== طلبات الجملة والمفرد لكل موديل ===== */
function modelOrderStats(sales){
  const mm={};
  sales.forEach(x=>{ const k=x.modelId||('x:'+saleProductLabel(x)); const m=x.modelId?modelById(x.modelId):null;
    const o=mm[k]=mm[k]||{key:k,id:x.modelId||null,name:m?m.name:saleProductLabel(x),w:new Set(),r:new Set(),wq:0,rq:0,rev:0,profit:0};
    const oid=x.orderId||x.id, q=num(x.quantity);
    if(x.customerType==='wholesale'){ o.w.add(oid); o.wq+=q; } else { o.r.add(oid); o.rq+=q; }
    o.rev+=saleRevenue(x); o.profit+=saleProfit(x); });
  return Object.values(mm).map(o=>({...o,wn:o.w.size,rn:o.r.size,qty:o.wq+o.rq,n:o.w.size+o.r.size})).sort((a,b)=>b.n-a.n||b.qty-a.qty);
}
function modelOrdersRows(rows,limit){
  if(!rows.length) return '<div class="notes-empty">ماكو مبيعات بهذي الفترة</div>';
  const mx=Math.max(1,...rows.map(r=>r.n));
  return '<div class="mo-list">'+rows.slice(0,limit||8).map((r,i)=>`<div class="mo-row"${r.id?` onclick="openModelDetail('${r.id}');currentPage='models';render();" style="cursor:pointer"`:''}>
    <div class="mo-top"><span class="mo-i">${i+1}</span><b class="mo-n">${esc(r.name)}</b><span class="mo-t">${r.n} طلب · ${r.qty} قطعة</span></div>
    <div class="mo-bar" style="width:${Math.max(6,r.n/mx*100)}%"><i class="w" style="flex:${r.wn||0}"></i><i class="r" style="flex:${r.rn||0}"></i></div>
    <div class="mo-leg"><span><i class="dot w"></i>جملة <b>${r.wn}</b> طلب · ${r.wq} قطعة</span><span><i class="dot r"></i>مفرد <b>${r.rn}</b> طلب · ${r.rq} قطعة</span></div></div>`).join('')+'</div>';
}
function openModelDetail(id){ currentPage='models'; currentDetail = id; render(); }

function galleryPreviewHtml(){
  return pendingImages.map((src,i)=>`<div class="thumb-x"><img src="${src}"><button onclick="removeImage(${i})">×</button></div>`).join('');
}
function removeImage(i){ pendingImages.splice(i,1); document.getElementById('galleryPreview').innerHTML = galleryPreviewHtml(); }
function handleImageUpload(evt){
  const files = Array.from(evt.target.files || []);
  let remaining = files.length;
  if(!remaining) return;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = e=>{
      pendingImages.push(e.target.result);
      document.getElementById('galleryPreview').innerHTML = galleryPreviewHtml();
    };
    compressImageInto(file, reader);
  });
}
function onCostPartInput(){
  const ids = ['f_c_fabric','f_c_sewing','f_c_cutting','f_c_factory','f_c_acc','f_c_other'];
  const sum = ids.reduce((s,i)=>s+num(document.getElementById(i).value),0);
  document.getElementById('f_unitcost').value = sum || '';
  updateModelCompute();
}
function updateModelCompute(){
  const cost = num(document.getElementById('f_unitcost').value);
  const ws = num(document.getElementById('f_wholesale').value) || num(document.getElementById('f_sell').value);
  const rt = num(document.getElementById('f_sell').value);
  document.getElementById('computeProfitWholesale').textContent = money(ws - cost);
  document.getElementById('computeProfit').textContent = money(rt - cost);
}
function deleteModel(id){
  const usedInSales = state.sales.some(s=>s.modelId===id);
  const usedInWork = state.tailorWork.some(w=>w.modelId===id) || state.cutterWork.some(w=>w.modelId===id) || state.hoodariWork.some(w=>w.modelId===id);
  const msg = (usedInSales||usedInWork)
    ? 'هذا الموديل مرتبط بمبيعات أو سجلات شغل خياطين/فصالين. حذفه لن يحذف تلك السجلات لكنها ستفقد رابط الموديل. متابعة؟'
    : null;
  confirmDelete(msg, ()=>{
    state.models = state.models.filter(m=>m.id!==id);
    saveState(); currentDetail=null; render(); toast('تم الحذف');
  });
}

      <div class="form-row"><label>ملاحظات</label><textarea id="f_notes">${esc(item?.notes||'')}</textarea></div>

    onSave(){
      const selectVal = document.getElementById('f_model').value;
      const quantity = num(document.getElementById('f_qty').value);
      const unitPrice = num(document.getElementById('f_price').value);
      let modelId = null, productLabel = null, costSnapshot = 0;

      if(selectVal === '__NEW__'){
        const newName = document.getElementById('f_newModelName').value.trim();
        if(!newName) return toast('الرجاء إدخال اسم الموديل الجديد، أو اختر "بدون موديل"');
        const newModel = {
          id: uid(), name: newName, code: nextModelCode(),
          images: [...pendingSaleNewModelImages],
          unitCost: num(document.getElementById('f_newModelCost').value),
          wholesalePrice: unitPrice,
          sellingPrice: unitPrice, notes:''
        };
        state.models.push(newModel);
        modelId = newModel.id;
        costSnapshot = newModel.unitCost;
      } else if(selectVal === '__NONE__'){
        modelId = null;
        productLabel = document.getElementById('f_freeDesc').value.trim() || 'بيع بدون موديل';
        costSnapshot = 0;
      } else {
        modelId = selectVal;
        costSnapshot = modelCost(modelById(modelId));
      }

      const total = quantity*unitPrice;
      let received = num(document.getElementById('f_received').value);
      if(received>total) received = total;
      if(received<0) received = 0;
      let remaining = Math.max(0, total - received);
      const customerName = document.getElementById('f_customer').value.trim() || (remaining>0 ? 'بدون اسم' : '');
      const date = document.getElementById('f_date').value || todayISO();
      const channel = document.getElementById('f_channel').value;
      if(modelId && selectVal!=='__NEW__') costSnapshot = unitCostFor(modelId, channel, document.getElementById('f_stype').value);
      const data = {
        modelId, productLabel, quantity, unitPrice, date, channel,
        customerType: document.getElementById('f_stype').value,
        paymentMethod: document.getElementById('f_pay').value,
        customerName,
        amountReceived: received,
        amountRemaining: remaining,
        notes: document.getElementById('f_notes').value.trim(),
        costSnapshot
      };

      let linkedDebtId = item?.linkedDebtId || null;
      if(remaining > 0){
        const existingDebt = linkedDebtId ? customerDebtById(linkedDebtId) : null;
        if(existingDebt){
          Object.assign(existingDebt, {
            customerName, amount: remaining, date, modelId,
            notes: 'دين ناتج من عملية بيع بتاريخ ' + date
          });
        } else {
          const debt = {
            id: uid(), customerName, amount: remaining, customerType: data.customerType,
            date, modelId, notes: 'دين ناتج من عملية بيع بتاريخ ' + date
          };
          state.customerDebts.push(debt);
          linkedDebtId = debt.id;
        }
      } else if(linkedDebtId){
        const existingDebt = customerDebtById(linkedDebtId);
        if(existingDebt){
          const tot = customerDebtTotals(linkedDebtId);
          if(tot.paid > 0){ existingDebt.amount = tot.paid; }
          else{ state.customerDebts = state.customerDebts.filter(d=>d.id!==linkedDebtId); }
        }
        linkedDebtId = null;
      }
      data.linkedDebtId = linkedDebtId;

      if(item) Object.assign(item, data);
      else state.sales.push({id:uid(), ...data});
      saveState(); closeModal(); render();
      { const rs=(channel==='page' && PS().resetAt && date<PS().resetAt) ? PS().resetAt : null;
        if(rs) toast(`تم الحفظ، لكن تاريخ البيع قبل تصفير الشراكة (${rs}) فما يدخل بحساب الشراكة`);
        else toast(remaining>0 ? `تم الحفظ — سُجّل ${money(remaining)} كدين على ${customerName}` : 'تم الحفظ بنجاح'); }
    }
  });
  updateProfitPreview();
}
