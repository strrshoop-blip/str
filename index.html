function customerBulkAllocation(customerName, amount){
  const debts = state.customerDebts
    .filter(d=>(d.customerName||'').trim()===customerName)
    .sort((a,b)=> (a.date||'').localeCompare(b.date||''))
    .map(d=>({d, remaining: customerDebtTotals(d.id).remaining}))
    .filter(x=>x.remaining>0);
  let left = amount;
  const alloc = [];
  debts.forEach(x=>{
    if(left<=0) return;
    const take = Math.min(left, x.remaining);
    alloc.push({debt:x.d, take, before:x.remaining, after:x.remaining-take});
    left -= take;
  });
  return alloc;
}
function onBulkRepayRecalc(){
  const name = window._bulkCustomer;
  const el = document.getElementById('f_amount');
  const box = document.getElementById('bulkAllocBox');
  if(!el || !box) return;
  const totalRemaining = customerDebtGroupTotals(state.customerDebts.filter(d=>(d.customerName||'').trim()===name)).remaining;
  let amount = num(el.value);
  if(amount>totalRemaining){ amount = totalRemaining; el.value = amount; }
  const alloc = customerBulkAllocation(name, amount);
  const after = totalRemaining - amount;
  const afterEl = document.getElementById('bulkAfter');
  if(afterEl) afterEl.textContent = money(Math.max(0, after));
  box.innerHTML = alloc.length ? alloc.map(a=>`
    <tr>
      <td>${a.debt.modelId? esc(modelById(a.debt.modelId)?.name||'—') : 'بدون تحديد'} <span class="muted">(${esc(a.debt.date)})</span></td>
      <td class="num">${money(a.before)}</td>
      <td class="num pos">− ${money(a.take)}</td>
      <td class="num ${a.after>0?'accent':'pos'}">${a.after>0?money(a.after):'مسدد ✅'}</td>
    </tr>`).join('') : `<tr class="empty-row"><td colspan="4">اكتب المبلغ لتشوف التوزيع</td></tr>`;
}
function openCustomerBulkRepayModal(encodedName){
  const customerName = decodeURIComponent(encodedName);
  window._bulkCustomer = customerName;
  const debts = state.customerDebts.filter(d=>(d.customerName||'').trim()===customerName);
  const totals = customerDebtGroupTotals(debts);
  if(totals.remaining<=0) return toast('ما عليه ديون متبقية');
  openModal({
    title: 'تحصيل من: ' + customerName,
    bodyHtml:`
      <div class="compute-box"><span>إجمالي المتبقي عليه</span><span><b class="accent">${money(totals.remaining)}</b></span></div>
      <div class="form-grid2">
        <div class="form-row"><label>المبلغ المحصّل الآن</label><input type="number" id="f_amount" value="" placeholder="مثال: 300000" oninput="onBulkRepayRecalc()"></div>
        <div class="form-row"><label>التاريخ</label><input type="date" id="f_date" value="${todayISO()}"></div>
      </div>
      <div class="hint">المبلغ يُخصم تلقائياً من ديونه من الأقدم للأحدث.</div>
      <div class="table-wrap" style="border:none;">
        <table>
          <thead><tr><th>الدين</th><th>قبل</th><th>يُخصم</th><th>بعد</th></tr></thead>
          <tbody id="bulkAllocBox"><tr class="empty-row"><td colspan="4">اكتب المبلغ لتشوف التوزيع</td></tr></tbody>
        </table>
      </div>
      <div class="compute-box"><span>المتبقي عليه بعد التحصيل</span><span><b id="bulkAfter" class="accent">${money(totals.remaining)}</b></span></div>
      <div class="form-row"><label>ملاحظات (اختياري)</label><textarea id="f_notes"></textarea></div>
    `,
    onSave(){
      const amount = num(document.getElementById('f_amount').value);
      if(amount<=0) return toast('الرجاء إدخال مبلغ صحيح');
      if(amount>totals.remaining) return toast('المبلغ أكبر من إجمالي المتبقي على الزبون');
      const date = document.getElementById('f_date').value || todayISO();
      const userNotes = document.getElementById('f_notes').value.trim();
      const alloc = customerBulkAllocation(customerName, amount);
      const batchId = uid();
      alloc.forEach(a=>{
        state.customerDebtPayments.push({
          id:uid(), batchId:batchId, customerDebtId:a.debt.id, amount:a.take, date,
          notes: 'تحصيل شامل ' + money(amount) + (userNotes ? ' — '+userNotes : '')
        });
      });
      saveState(); closeModal(); render();
      const left = totals.remaining - amount;
      toast(left<=0 ? 'تم تحصيل كل ديون الزبون ✅' : 'تم التحصيل، المتبقي عليه: '+money(left));
    }
  });
}

  const debtCashRows = debtCashEventsInRange(from, to);

  sales.forEach(s=>{ const k=s.date.slice(0,7); byMonth[k]=byMonth[k]||{revenue:0,cogs:0}; byMonth[k].revenue+=saleRevenue(s); byMonth[k].cogs+=saleCost(s); });

let noteDraft = '';
function noteStamp(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return String(iso).slice(0,10);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} - ${p(d.getHours())}:${p(d.getMinutes())}`;
}

      <button class="btn primary" onclick="addNote()">+ إضافة ملاحظة</button>
    </div>
    ${list.length ? list.map(n=>`
      <div class="note-item">
        <div class="note-text">${esc(n.text)}</div>
        <div class="note-meta">
          <span>${esc(noteStamp(n.createdAt))}${n.updatedAt && n.updatedAt!==n.createdAt ? ' · معدّلة '+esc(noteStamp(n.updatedAt)) : ''}</span>

function ptMargins(D){ const f=l=>({rev:l.reduce((a,x)=>a+saleRevenue(x),0),profit:l.reduce((a,x)=>a+saleProfit(x),0),pcs:l.reduce((a,x)=>a+num(x.quantity),0),n:l.length}); return {w:f(D.ps.filter(x=>x.customerType==='wholesale')),r:f(D.ps.filter(x=>x.customerType!=='wholesale'))}; }

function openWhy(kind){

function ptCloseReviewData(ym){
  const P=PS(), [f,t]=mRange(ym), D=pageData(f,t), warns=[];
  if(Math.abs(P.partners.reduce((a,p)=>a+num(p.pct),0)-100)>0.001) warns.push('مجموع نسب الشركاء مو 100%');
  const noCost=D.ps.filter(x=>x.modelId && !num(x.costSnapshot)).length; if(noCost) warns.push(noCost+' بيع بدون كلفة محفوظة');
  const ra=retRateInfo(D); if(ra.over) warns.push('نسبة الرجوع '+ra.rateTxt+'% أعلى من الحد ('+ra.limit+'%)');
  if(D.profit>0 && D.ads>D.profit*((P.goal&&P.goal.adsPct)||30)/100) warns.push('الإعلانات أكلت '+Math.round(D.ads/D.profit*100)+'% من الأرباح');
  if(D.net<0) warns.push('صافي الأرباح سالب');
  return {D,warns};
}

function ymAdd(ym,k){ return ymOfDate(new Date(+ym.slice(0,4), +ym.slice(5,7)-1+k, 1)); }

function dayDiff(a,b){ return Math.floor((Date.parse(b)-Date.parse(a))/864e5); }
function buildAlertsRaw(){

    if(prev.net>0 && day>=3){ const pd=(cur.net-prev.net)/prev.net*100; if(pd<=-A.profitDrop) out.push({id:cm+':pdrop',kind:'bad',ic:'📉',t:'أرباح الصفحة نزلت عن الشهر الماضي',d:`الصافي أقل بـ ${Math.round(-pd)}% (${money(cur.net)} مقابل ${money(prev.net)})`,go:'partnership'}); }
    if(cur.net<0 && day>=7) out.push({id:cm+':loss',kind:'bad',ic:'⚠️',t:'صافي أرباح الصفحة سالب هذا الشهر',d:`الصافي الحالي ${money(cur.net)}`,go:'partnership'});
    const lim=num((PS().goal||{}).adsPct)||30; if(cur.profit>0 && cur.ads>cur.profit*lim/100) out.push({id:cm+':adsshare',kind:'warn',ic:'📣',t:'الإعلانات تاكل من الأرباح',d:`${Math.round(cur.ads/cur.profit*100)}% من الأرباح (الحد ${lim}%) — راجع الحملات`,go:'partnership',act:`navigate('partnership');homeTab='over';currentDetail='ads';render();window.scrollTo(0,0)`});
  }catch(e){}
  { const st=state.models.filter(m=>modelStale(m.id)); if(st.length) out.push({id:cm+':stale',kind:'warn',ic:'💤',t:st.length+' موديل راكد',d:'ما انباعوا من أكثر من 30 يوم: '+st.slice(0,3).map(m=>m.name).join('، ')+(st.length>3?'…':''),go:'models'}); }
  try{ const lb=localStorage.getItem('str_lastbackup'); const age=lb?dayDiff(lb.slice(0,10),today):999; if(age>14) out.push({id:cm+':bk:'+Math.floor(Date.now()/(14*864e5)),kind:'info',ic:'💾',t:'نزّل نسخة احتياطية على جهازك',d:lb?'آخر ملف نزّلته قبل '+age+' يوم':'ما نزّلت ملف نسخة احتياطية لحد الآن',go:'safety'}); }catch(e){}
  const late=state.customerDebts.map(d=>{ const t=customerDebtTotals(d.id); const last=[d.date,...customerDebtPaymentsOf(d.id).map(p=>p.date)].sort().pop(); return {d,rem:t.remaining,age:dayDiff(last,today)}; }).filter(x=>x.rem>0 && x.age>A.lateDays);
  if(late.length){ const top=late.slice().sort((a,b)=>b.rem-a.rem)[0]; out.push({id:cm+':cdebt',kind:'warn',ic:'⏰',t:`تأخر تحصيل ${late.length} دين زبائن`,d:`إجمالي ${money(late.reduce((s,x)=>s+x.rem,0))} — الأكبر: ${top.d.customerName||'زبون'} (${money(top.rem)}) من ${top.age} يوم`,go:'customerdebts'}); }
  const lateW=state.debts.map(d=>{ const t=debtTotals(d.id); const last=[d.date,...state.debtPayments.filter(p=>p.debtId===d.id).map(p=>p.date)].sort().pop(); return {d,rem:t.remaining,age:dayDiff(last,today)}; }).filter(x=>x.rem>0 && x.age>A.lateDays);
  if(lateW.length) out.push({id:cm+':wdebt',kind:'bad',ic:'📒',t:`تأخر تسديد ${lateW.length} دين علينا`,d:`إجمالي ${money(lateW.reduce((s,x)=>s+x.rem,0))} — أقدمها من ${Math.max(...lateW.map(x=>x.age))} يوم`,go:'debts'});
  try{ const D0=pageData(cm+'-01',cm+'-31'), ra=retRateInfo(D0); if(ra.over) out.push({id:cm+':retrate',kind:'bad',ic:'↩️',t:`نسبة الرجوع ${ra.rateTxt}% (الحد ${A.retRate}%)`,d:`${D0.retOrders} طلب راجع من ${D0.ordersAll}${ra.topModel?' — أكثر موديل: '+ra.topModel.name+' ('+ra.topModel.n+')':''}${ra.topReason?' — أكثر سبب: '+ra.topReason.name:''}`,go:'partnership'}); }catch(e){}
  try{ const P=PS(), D=pageData(pm+'-01',pm+'-31'); if(D.orders>0 && !P.closes.find(c=>c.month===pm)) out.push({id:cm+':close',kind:'info',ic:'🔒',t:'شهر الشراكة السابق غير مقفل',d:`${monthLabelAr(pm)} فيه ${D.orders} بيع بالصفحة وما انقفل بعد`,go:'partnership'}); }catch(e){}
  try{ const fr=addDaysISO(today,-29), byM={}, byR={};
    (state.returns||[]).forEach(r=>{ if((r.date||'')>=fr){ const m=r.product||'—', k=normReason(r.reason); byM[m]=(byM[m]||0)+1; byR[k]=(byR[k]||0)+1; } });
    Object.entries(byM).filter(([,n])=>n>=A.retRepeat).sort((a,b)=>b[1]-a[1]).slice(0,3).forEach(([k,n])=>out.push({id:cm+':retm:'+k+':'+n,kind:'bad',ic:'🛑',t:'موديل يتكرر رجوعه: '+k,d:`رجع ${n} مرات خلال آخر 30 يوم — راجع المقاس أو الجودة قبل ما تكمل إنتاجه`,go:'partnership'}));
    Object.entries(byR).filter(([,n])=>n>=A.retRepeat).sort((a,b)=>b[1]-a[1]).slice(0,2).forEach(([k,n])=>out.push({id:cm+':retr:'+k+':'+n,kind:'warn',ic:'↩️',t:'سبب ترجيع يتكرر: '+k,d:`تكرر ${n} مرات خلال آخر 30 يوم`,go:'partnership'})); }catch(e){}
  try{ (PS().emps||[]).forEach(E=>{ const S=empStats(E), I=empPayInfo(E); if(!S||S.remaining<=0) return;
      const sl=dayDiff(I.last,today), tn=dayDiff(today,I.next);
      if(sl<=4 || tn<=1){ const key=sl<=4?I.last:I.next, ttl=sl===0?'اليوم موعد راتب '+E.name:(sl<=4?'مرّ موعد راتب '+E.name+' ('+I.last+')':'غداً موعد راتب '+E.name);
        out.push({id:cm+':pay:'+E.id+':'+key,kind:sl<=4?'bad':'warn',ic:'💵',t:ttl,d:`المتبقي له ${money(S.remaining)} — ${I.label}`,go:'partnership',act:`navigate('partnership');currentDetail='emp:${E.id}';render();window.scrollTo(0,0)`}); } }); }catch(e){}
  return out;
}
var _alDirty=false;
function buildAlerts(){
  const raw=buildAlertsRaw(), today=todayISO(), seen=state.notifSeen||(state.notifSeen={}), dis=state.notifDismissed||(state.notifDismissed={});
  return raw.filter(a=>{ if(dis[a.id]) return false; if(!seen[a.id]){ seen[a.id]=today; _alDirty=true; } return dayDiff(seen[a.id],today)<5; });
}
function dismissAlert(i,ev){ if(ev) ev.stopPropagation(); const a=(window._alList||[])[i]; if(!a) return; (state.notifDismissed||(state.notifDismissed={}))[a.id]=todayISO(); saveState(); openNotifPanel(true); refreshBell(); render(); }
function dismissAllAlerts(ev){ if(ev) ev.stopPropagation(); const d=state.notifDismissed||(state.notifDismissed={}); (window._alList||[]).forEach(a=>{ d[a.id]=todayISO(); }); saveState(); openNotifPanel(true); refreshBell(); render(); }
function unreadAlerts(){ const r=state.notifRead||{}; return buildAlerts().filter(a=>!r[a.id]); }
function refreshBell(){
  if(state && state.sales && !_opsPrev){ try{ _opsPrev=opsSnap(); }catch(e){} }
  const b=document.getElementById('bellBadge'); if(!b || !state || !state.sales) return;
  let n=0; try{ n=unreadAlerts().length; }catch(e){}
  if(_alDirty){ _alDirty=false; try{ const t=todayISO(); ['notifSeen','notifDismissed'].forEach(k=>{ const o=state[k]||{}; Object.keys(o).forEach(id=>{ if(dayDiff(o[id],t)>45) delete o[id]; }); }); saveState(); }catch(e){} }
  b.textContent=n>9?'9+':n; b.style.display=n?'flex':'none';
}
function openNotifPanel(keepOpen){
  const p=document.getElementById('notifPanel'); if(!p) return;
  const cm=todayISO().slice(0,7), r=state.notifRead||(state.notifRead={}), al=buildAlerts(); window._alList=al;
  p.innerHTML=`<div class="np-head"><b>🔔 الإشعارات</b><span>${al.length?`<a style="cursor:pointer;text-decoration:underline" onclick="dismissAllAlerts(event)">حذف الكل</a>`:monthLabelAr(cm)}</span></div>
    ${al.length?al.map((a,i)=>`<div class="np-item ${a.kind}" onclick="${a.act||`navigate('${a.go}')`};document.getElementById('notifPanel').classList.remove('open')"><span class="np-ic">${a.ic}</span><div style="flex:1"><b>${esc(a.t)}${r[a.id]?'':' <em>جديد</em>'}</b><div>${esc(a.d)}</div></div><button type="button" class="np-x" title="حذف الإشعار" onclick="dismissAlert(${i},event)">✕</button></div>`).join(''):'<div class="np-empty">ماكو إشعارات مهمة هسه 👌</div>'}
    <div class="np-foot"><a style="cursor:pointer;text-decoration:underline" onclick="openAlertCfgModal()">⚙️ ضبط الإشعارات</a><br>الإشعار يختفي تلقائياً بعد 5 أيام من ظهوره، أو تحذفه بـ ✕</div>`;
  p.classList.add('open');
  Object.keys(r).forEach(k=>{ if(!al.some(a=>a.id===k)) delete r[k]; });
  al.forEach(a=>{ r[a.id]=true; });
  saveState(); refreshBell();
}
function toggleNotif(ev){

function spark(vals,color){
  const w=120,h=36,mx=Math.max(...vals),mn=Math.min(...vals),r=(mx-mn)||1,st=w/Math.max(1,vals.length-1);
  const pts=vals.map((v,i)=>`${(i*st).toFixed(1)},${(h-4-(v-mn)/r*(h-10)).toFixed(1)}`);
  const lp=pts[pts.length-1].split(',');
  return `<svg viewBox="0 0 ${w} ${h}" class="spark" preserveAspectRatio="none"><polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${lp[0]}" cy="${lp[1]}" r="3" fill="${color}"/></svg>`;
}
function insData(){
  const L=[],rev=[],profit=[],exp=[], cm=todayISO().slice(0,7);
  if(insMode==='d'){ for(let i=29;i>=0;i--){ const d=addDaysISO(todayISO(),-i), t=periodTotals(d,d); L.push(d.slice(8)+'/'+d.slice(5,7)); rev.push(t.revenue); profit.push(t.netProfit); exp.push(t.expTotal); } }
  else { for(let i=11;i>=0;i--){ const ym=ymAdd(cm,-i), t=periodTotals(ym+'-01',ym+'-31'); L.push(ym.slice(5)+'/'+ym.slice(2,4)); rev.push(t.revenue); profit.push(t.netProfit); exp.push(t.expTotal); } }
  return {L,rev,profit,exp};
}
function insChart(D){
  const W=720,H=240,pl=8,pr=8,pt=14,pb=26,n=D.L.length;
  const vs=[...(insOn.rev?D.rev:[]),...(insOn.profit?D.profit:[]),...(insOn.exp?D.exp:[]),0];
  const mx=Math.max(1,...vs), mn=Math.min(0,...vs), rg=(mx-mn)||1;
  const x=i=>pl+(i+.5)*(W-pl-pr)/n, y=v=>pt+(mx-v)/rg*(H-pt-pb), bw=Math.max(5,(W-pl-pr)/n*.46);
  let g='<defs><linearGradient id="gRev" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c-rev)" stop-opacity=".28"/><stop offset="1" stop-color="var(--c-rev)" stop-opacity="0"/></linearGradient></defs>';
  for(let k=0;k<=3;k++){ const yy=pt+k*(H-pt-pb)/3; g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--border)" stroke-dasharray="3 5"/>`; }
  if(insOn.exp) D.exp.forEach((v,i)=>{ g+=`<rect x="${x(i)-bw/2}" y="${y(v)}" width="${bw}" height="${Math.max(1,y(0)-y(v))}" rx="3" fill="var(--c-exp)" opacity=".55"/>`; });
  const path=a=>a.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  if(insOn.rev){ g+=`<path d="${path(D.rev)} L${x(n-1)},${y(0)} L${x(0)},${y(0)}Z" fill="url(#gRev)"/><path d="${path(D.rev)}" fill="none" stroke="var(--c-rev)" stroke-width="2.6" stroke-linejoin="round"/>`; }
  if(insOn.profit) g+=`<path d="${path(D.profit)}" fill="none" stroke="var(--c-profit)" stroke-width="2.6" stroke-linejoin="round"/>`;
  const step=Math.ceil(n/8);
  D.L.forEach((l,i)=>{ if(i%step===0||i===n-1) g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="var(--text-faint)">${l}</text>`; });
  D.L.forEach((l,i)=>{ g+=`<rect x="${x(i)-(W-pl-pr)/n/2}" y="0" width="${(W-pl-pr)/n}" height="${H}" fill="transparent" onmousemove="insTip(event,${i})" onmouseleave="insTipHide()" ontouchstart="insTip(event,${i})"/>`; });
  return `<svg viewBox="0 0 ${W} ${H}" class="ins-svg">${g}</svg>`;
}
function insTip(e,i){

let orderLines=[], ordRecTouched=false, ordEditId=null;
function orderBuild(sp){
  const L=sp.lines.map(l=>({modelId:l.modelId,qty:num(l.qty),price:num(l.price),cost:unitCostFor(l.modelId,sp.channel,sp.type)}));
  const T=L.reduce((s,l)=>s+l.qty*l.price,0), C=L.reduce((s,l)=>s+l.qty*l.cost,0);
  const R=Math.min(Math.max(num(sp.received),0),T), rem=T-R, margin=T>0?(T-C)/T:0;
  let used=0;
  L.forEach((l,i)=>{ const tot=l.qty*l.price; let rec=T>0?(i===L.length-1?R-used:Math.round(R*tot/T)):0; rec=Math.max(0,Math.min(tot,rec)); l.rec=rec; l.remn=tot-rec; used+=rec; });
  return {lines:L,total:T,cost:C,received:R,remaining:rem,margin,pieces:L.reduce((s,l)=>s+l.qty,0),profit:T-C};
}

function openEmpPayModal(eid,payId){
  const S=empStats(eid); if(!S) return; const E=S.E, it=payId?E.pays.find(x=>x.id===payId):null;
  openModal({title:(it?'تعديل تسديد — ':'تسديد مبلغ — ')+E.name,bodyHtml:`<div class="rule-box" style="margin-bottom:12px;">المتبقي له الآن: <b>${money(S.remaining)}</b><br>المبلغ اللي تسدده يتسجل بحساب الموظف فقط، وما يُخصم من أرباح الشركاء.</div>
    <div class="form-grid2"><div class="form-row"><label>المبلغ</label><input type="number" id="f_amount" value="${it?it.amount:(S.remaining>0?S.remaining:'')}"></div><div class="form-row"><label>التاريخ</label><input type="date" id="f_date" value="${it?.date||todayISO()}"></div></div>
    <div class="form-row"><label>ملاحظات</label><textarea id="f_notes">${esc(it?.note||'')}</textarea></div>`,
  onSave(){
    const amount=num(document.getElementById('f_amount').value); if(amount<=0) return toast('اكتب مبلغ صحيح');
    const d={amount,date:document.getElementById('f_date').value||todayISO(),note:document.getElementById('f_notes').value.trim()};
    if(!E.pays) E.pays=[]; if(it) Object.assign(it,d); else E.pays.push({id:uid(),...d});
    saveState(); closeModal(); render(); toast('تم تسجيل التسديد');
  }});
}
function deleteEmpPay(eid,payId){ confirmDelete('حذف هذا التسديد؟',()=>{ const E=empById(eid); E.pays=E.pays.filter(p=>p.id!==payId); saveState(); render(); toast('تم الحذف'); }); }
function openEmpEditModal(eid){

    <div class="form-row" id="f_epm_r" style="${pf==='month'?'':'display:none'}"><label>يوم التسليم بالشهر (1 – 31)</label><input type="number" id="f_epm" min="1" max="31" value="${md}"></div>
    <div class="hint">يجيك إشعار بالنظام 🔔 قبل الموعد بيوم، ويبقى 5 أيام أو لحد ما تحذفه.</div>`,
  onSave(){
    const name=document.getElementById('f_en').value.trim(), rate=num(document.getElementById('f_er').value);
    if(!name) return toast('اكتب الاسم'); if(rate<0) return toast('الأجرة غير صحيحة');
    const freq=document.getElementById('f_epf').value, day=freq==='week'?num(document.getElementById('f_epw').value):Math.min(31,Math.max(1,num(document.getElementById('f_epm').value)||1));
    const from=document.getElementById('f_efrom').value;
    if(!E){ const n={id:'e_'+uid(),name,rate,from:null,skip:[],pays:[],adjs:{},payFreq:freq,payDay:day}; empFreshStart(n,false); if(from) n.from=from; P.emps.push(n); }

  }});
}

function closedMonthOf(rec){
  const P=state.partnership; if(!P||!P.closes||!rec||(rec.channel||'shop')!=='page') return null;
  const m=(rec.date||'').slice(0,7); return P.closes.find(c=>c.month===m)?m:null;
}
function lockConfirm(month,go){
  openModal({title:'🔒 شهر مقفل بالشراكة',bodyHtml:`<div class="rule-box" style="border-color:var(--negative);margin-bottom:12px;">هذا السجل يخص <b>${monthLabelAr(month)}</b> وهو <b>مقفل</b> بنظام الشراكة. تعديله أو حذفه يغيّر أرقام الشركاء بعد توزيع الأرباح.</div>
    <div class="form-row"><label>اكتب كلمة «تأكيد» للمتابعة</label><input type="text" id="f_lock" placeholder="تأكيد" autocomplete="off"></div>
    <div class="hint">بعد التعديل افتح نظام الشراكة وحدّث إقفال الشهر إذا التغيير مقصود.</div>`,
  onSave(){ if(document.getElementById('f_lock').value.trim()!=='تأكيد') return toast('اكتب كلمة تأكيد للمتابعة'); closeModal(); go(); }});
  const sb=document.getElementById('modalSaveBtn'); if(sb){ sb.textContent='متابعة'; }
}
function installClosedLocks(){
  const wrap=(name,getRec)=>{ const f=window[name]; if(typeof f!=='function'||f.__locked) return;
    const w=function(...a){ let m=null; try{ m=closedMonthOf(getRec(...a)); }catch(e){} if(m){ lockConfirm(m,()=>f.apply(this,a)); return; } return f.apply(this,a); }; w.__locked=true; window[name]=w; };
  wrap('openSaleModal',id=>id?state.sales.find(x=>x.id===id):null);
  wrap('openOrderModal',oid=>oid?state.sales.find(x=>x.orderId===oid):null);
  wrap('deleteSale',id=>state.sales.find(x=>x.id===id));
  wrap('openExpenseModal',id=>{ const e=id?state.expenses.find(x=>x.id===id):null; return e&&e.type==='إعلانات'?e:null; });
  wrap('deleteExpense',id=>{ const e=state.expenses.find(x=>x.id===id); return e&&e.type==='إعلانات'?e:null; });
  wrap('openReturnModal',id=>state.sales.find(x=>x.id===id));
}
installClosedLocks();

function exportModelReportCSV(){
  const from = reportRange.from||null, to = reportRange.to||null;
  const sales = state.sales.filter(s=>inRange(s.date,from,to));
  const byModel = {};
  sales.forEach(s=>{ byModel[s.modelId]=byModel[s.modelId]||{qty:0,revenue:0,profit:0}; byModel[s.modelId].qty+=num(s.quantity); byModel[s.modelId].revenue+=saleRevenue(s); byModel[s.modelId].profit+=saleProfit(s); });
  const rows = Object.entries(byModel).map(([id,v])=>({model:modelById(id), ...v})).filter(x=>x.model);
  const csv = toCSV(['الموديل','الكود','القطع المباعة','الوارد','الربح'], rows.map(r=>[r.model.name,r.model.code,r.qty,r.revenue,r.profit]));
  downloadBlob(csv,'تقرير_الموديلات.csv','text/csv;charset=utf-8;');
}

function downloadDesktopShortcut(){
  const b64 = s => btoa(unescape(encodeURIComponent(s)));
  const url = b64(location.href);
  const ps = "$t=[IO.File]::ReadAllText('%~f0');"
    + "function G($a){[regex]::Match($t,'(?s)::'+$a+'<(.*?)>'+$a+'::').Groups[1].Value.Trim()};"
    + "$d=Join-Path $env:USERPROFILE 'STR';New-Item -ItemType Directory -Force $d|Out-Null;"
    + "$ico=Join-Path $d 'STR.ico';[IO.File]::WriteAllBytes($ico,[Convert]::FromBase64String((G 'ICO')));"
    + "$u=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String((G 'URL')));"
    + "$desk=[Environment]::GetFolderPath('Desktop');"
    + "$c='[InternetShortcut]'+[char]13+[char]10+'URL='+$u+[char]13+[char]10+'IconFile='+$ico+[char]13+[char]10+'IconIndex=0'+[char]13+[char]10;"
    + "[IO.File]::WriteAllText((Join-Path $desk 'STR.url'),$c)";
  const bat = ['@echo off',
    'powershell -NoProfile -ExecutionPolicy Bypass -Command "' + ps + '"',
    'echo Done - STR shortcut created on Desktop.',
    'pause',
    'exit /b',
    '::ICO<', STR_ICO_B64, '>ICO::',
    '::URL<', url, '>URL::', ''].join('\r\n');
  downloadBlob(bat, 'STR-desktop-shortcut.bat', 'application/octet-stream');
  toast('نزل الملف — دوسي عليه مرتين لإنشاء الاختصار');
}
function openProfitModal(){
  const all = dashboardMonth==='ALL';
  const from = all ? null : dashboardMonth+'-01', to = all ? null : dashboardMonth+'-31';
  const t = periodTotals(from, to);
  const adjs = (state.profitAdjustments||[]).filter(a=>inRange(a.date, from, to)).sort((a,b)=>b.date.localeCompare(a.date));
  openModal({
    title: 'صافي الربح — ' + (all ? 'كل الفترات' : dashboardMonth),
    bodyHtml: `
      <div class="compute-box"><span>صافي الربح الحالي</span><span><b class="${t.netProfit>=0?'pos':'neg'}">${money(t.netProfit)}</b></span></div>
      <div class="desc" style="margin:10px 0;">الربح المحسوب من المبيعات والتحصيلات والمصاريف: ${money(t.netProfit - t.profitAdj)}${t.profitAdj? ' — تعديلاتك اليدوية: '+money(t.profitAdj):''}. التعديل ما يحذف مبيعات ولا موديلات، يضيف سطر تصحيح فقط.</div>
      <div class="form-row"><label>اجعل صافي الربح يساوي (د.ع)</label><input type="number" id="f_profit_target" placeholder="مثال: 0 للتصفير"></div>
      <div class="form-grid2">
        <div class="form-row"><label>أضف مبلغ</label><input type="number" id="f_profit_add" placeholder="0"></div>
        <div class="form-row"><label>انقص مبلغ</label><input type="number" id="f_profit_sub" placeholder="0"></div>
      </div>
      <div class="form-row"><label>سبب التعديل (اختياري)</label><input type="text" id="f_profit_note" placeholder="مثال: تصحيح خطأ"></div>
      ${adjs.length ? `<div class="section-title" style="margin-top:6px;">تعديلات هذه الفترة</div>
      ${adjs.map(a=>`<div class="compute-box"><span>${esc(a.date)} — ${esc(a.note||'تعديل يدوي')}</span><span><b class="${num(a.amount)>=0?'pos':'neg'}">${money(a.amount)}</b> <button class="btn sm danger" type="button" onclick="deleteProfitAdjustment('${a.id}')">حذف</button></span></div>`).join('')}` : ''}
    `,
    onSave(){
      const tv = document.getElementById('f_profit_target').value;
      const add = num(document.getElementById('f_profit_add').value);
      const sub = num(document.getElementById('f_profit_sub').value);
      let delta = add - sub;
      if(tv!=='') delta = (num(tv) - t.netProfit) + delta;
      if(!delta){ closeModal(); return; }
      const today = todayISO();
      const date = (all || today.slice(0,7)===dashboardMonth) ? today : dashboardMonth+'-15';
      state.profitAdjustments = state.profitAdjustments || [];
      state.profitAdjustments.push({id:uid(), amount:delta, date, note:document.getElementById('f_profit_note').value.trim()});
      saveState(); closeModal(); render(); toast('تم تحديث صافي الربح');
    }
  });
}
function deleteProfitAdjustment(id){
  state.profitAdjustments = (state.profitAdjustments||[]).filter(a=>a.id!==id);
  saveState(); closeModal(); render(); openProfitModal();
}
function openCapitalModal(){
  const cur = capitalTotal();
  const base = num(state.settings.capitalBase);
  openModal({
    title: 'رأس المال / الميزانية',
    bodyHtml: `
      <div class="compute-box"><span>رأس المال الحالي</span><span><b class="${cur>=0?'pos':'neg'}">${money(cur)}</b></span></div>
      <div class="compute-box" style="margin-top:8px;"><span>مدفوعات الخياطين والفصالين والهودارية المخصومة</span><span><b class="neg">${money(workerPaymentsFromCapital())}</b></span></div>
      <div class="compute-box" style="margin-top:8px;"><span>تسديدات الديون اللي علينا المخصومة</span><span><b class="neg">${money(debtRepaymentsFromCapital())}</b></span></div>
      <div class="desc" style="margin:10px 0;">رأس المال = القيمة الأساسية (${money(base)}) + كل مبلغ استلمته من بيع أو تحصيل دين − المصاريف من رأس المال والأرباح − تسديدات الديون اللي علينا − مدفوعات العمال المعلّمة "من رأس المال". الدين نفسه ما ينخصم وقت تسجيله، ينخصم لما تسدده. تكدر تصححه بإحدى الطرق:</div>
      <div class="form-row"><label>اجعل رأس المال الحالي يساوي (د.ع)</label><input type="number" id="f_capital_target" placeholder="مثال: 0 للتصفير، أو الرقم الصحيح"></div>
      <div class="form-grid2">
        <div class="form-row"><label>أضف مبلغ</label><input type="number" id="f_capital_add" placeholder="0"></div>
        <div class="form-row"><label>انقص مبلغ</label><input type="number" id="f_capital_sub" placeholder="0"></div>
      </div>
      <div class="hint">إذا كتبتي رقم بالخانة الأولى، يصير رأس المال بالضبط هذا الرقم، ثم يُطبّق عليه الإضافة أو النقصان. التعديل يتغير فيه القيمة الأساسية فقط، وما يمس مبيعاتك ولا ديونك.</div>
    `,
    onSave(){
      const tv = document.getElementById('f_capital_target').value;
      const add = num(document.getElementById('f_capital_add').value);
      const sub = num(document.getElementById('f_capital_sub').value);
      let newBase = base;
      if(tv!=='') newBase = base + (num(tv) - capitalTotal());
      newBase += add - sub;
      state.settings.capitalBase = newBase;
      saveState(); closeModal(); render(); toast('تم تحديث رأس المال: ' + money(capitalTotal()));
    }
  });
}
function saveShopName(){
  state.settings.shopName = document.getElementById('s_shopname').value.trim() || 'ستر';
  saveState(); toast('تم الحفظ');
}
function savePin(){
  const v = document.getElementById('s_pin').value.trim();
  state.settings.pin = v || null;
  if(!state.settings.pin){
    const mn = document.querySelector('.mobile-nav');
    if(mn) mn.style.display='';
  }
  saveState(); toast(v ? 'تم تفعيل رمز الحماية' : 'تم إلغاء رمز الحماية'); render();
}
function exportBackup(){
  downloadBlob(JSON.stringify(state,null,2), 'نسخة_احتياطية_'+todayISO()+'.json','application/json');
}
function importBackup(evt){
  const file = evt.target.files[0]; if(!file) return;
  askConfirm('سيتم استبدال جميع البيانات الحالية بالنسخة المستوردة. متابعة؟', ()=>doImportBackup(file), {title:'استيراد نسخة احتياطية', yesLabel:'استيراد'});
  return;
}
function doImportBackup(file){
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      state = Object.assign(defaultState(), parsed); tsMigrate();
      saveState(); toast('تم الاستيراد بنجاح'); navigate('dashboard');
    }catch(err){ toast('ملف غير صالح'); }
  };
  reader.readAsText(file);

function fmtThousands(v){
  let s = String(v==null?'':v).replace(/[,٬\s]/g,'').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/٫/g,'.');
  if(s===''||s==='-') return s;
  const neg = s[0]==='-'; if(neg) s = s.slice(1);
  const hasDot = s.includes('.');
  const parts = s.split('.');
  let ip = parts[0].replace(/\D/g,''), fp = parts.slice(1).join('').replace(/\D/g,'');
  if(ip==='' && !hasDot) return neg?'-':'';
  ip = (ip||'0').replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return (neg?'-':'') + ip + (hasDot?'.'+fp:'');
}
(function(){
  const d = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
  Object.defineProperty(HTMLInputElement.prototype,'value',{
    configurable:true, enumerable:d.enumerable, get(){ return d.get.call(this); },
    set(v){ if(this.dataset && this.dataset.fmt){ if(typeof v==='number') v = Math.round(v*100)/100; v = fmtThousands(v); } d.set.call(this, v); }
  });
})();
document.addEventListener('input', e=>{
  const t = e.target;
  if(!t || !t.dataset || !t.dataset.fmt) return;
  const old = t.value, pos = t.selectionStart==null ? old.length : t.selectionStart;
  const before = (old.slice(0,pos).match(/[0-9٠-٩.٫]/g)||[]).length;
  const nv = fmtThousands(old);
  if(nv!==old){
    t.value = nv;
    let c = 0, p = 0;
    while(p<nv.length && c<before){ if(/[0-9.]/.test(nv[p])) c++; p++; }
    try{ t.setSelectionRange(p,p); }catch(_){}
  }
}, true);

      if(!before[id]){ out.push({kind:sp.kind, action:verbAdd, text:(sp.act ? sp.act + ' — ' : (sp.kind + ' — ')) + auditName(sp,o) + ' — ' + money(o.amount)}); return; }
      if(before[id] !== JSON.stringify(o)){
        const old = JSON.parse(before[id]), ch = [];
        sp.fields.forEach(f=>{ if(String(old[f[0]]||'') !== String(o[f[0]]||'')){ const fm = f[2] || (v=>v||'—'); ch.push(f[1] + ': ' + fm(old[f[0]]) + ' ← ' + fm(o[f[0]])); } });
        if(ch.length) out.push({kind:sp.kind, action:'تعديل' + (sp.act ? ' ' + sp.act : ''), text:auditName(sp,o) + ' — ' + ch.join('، ')});
      }
    });
    Object.keys(before).forEach(id=>{
      if(cur[id]) return;
      const old = JSON.parse(before[id]);
      if(sp.parent && removedParents[old[sp.parent[1]]]) return;
      try{ trashPush(sp,id,before[id],t,by,(sp.act ? sp.act + ' — ' : sp.kind + ' — ') + auditName(sp,old) + ' — ' + money(old.amount)); }catch(e){ console.error('trash failed',e); }
      out.push({kind:sp.kind, action:verbDel, text:(sp.act ? '' : sp.kind + ' — ') + auditName(sp,old) + ' — ' + money(old.amount)});
    });
  });
  out.forEach(e=>state.auditLog.unshift({id:uid(), t, by, ...e}));
  if(state.auditLog.length > 600) state.auditLog.length = 600;
}

function deltaBadge(cur, prev, goodUp){
  cur = num(cur); prev = num(prev);
  if(!cur && !prev) return '';
  let txt, up;
  if(!prev) return '';
  else { const p = Math.round((cur-prev)/Math.abs(prev)*100); if(p===0) return '<span class="delta flat">▬ 0%</span>'; up = p>0; txt = (up?'▲ ':'▼ ') + Math.abs(p) + '%'; }
  const good = goodUp ? up : !up;
  return `<span class="delta ${good?'good':'bad'}" title="مقارنة بالشهر الماضي">${txt}</span>`;
}
function weeklyPulseHtml(){
  const cw = weekStartOf(todayISO()), weeks = [];
  for(let i=3;i>=0;i--) weeks.push(addDaysISO(cw, -7*i));
  const ev = allDebtCashEvents();
  const data = weeks.map(s=>{
    const e = weekEndOf(s);
    const rev = state.sales.filter(x=>x.date>=s && x.date<=e).reduce((a,x)=>a+saleRevenue(x),0) + ev.filter(x=>x.date>=s && x.date<=e).reduce((a,x)=>a+x.amount,0);
    const c = weekCosts(s);
    return {s, rev, pcs:weekProduced(s), wages:c.tailors+c.cutters+c.hoodaris};
  });
  const mx = Math.max(1, ...data.map(d=>d.rev));
  return `<div class="section-title"><span class="ic">📅</span> نبض آخر 4 أسابيع <button class="btn sm ghost" style="margin-inline-start:auto" onclick="navigate('production')">كل الأسابيع ←</button></div>
  <div class="card"><div class="pulse">${data.map((d,i)=>`
    <div class="pulse-col ${i===3?'cur':''}" onclick="openWeekDetail('${d.s}')">
      <div class="pulse-val">${money(d.rev)}</div>
      <div class="pulse-bar"><i style="height:${d.rev>0?Math.max(4,Math.round(d.rev/mx*100)):0}%"></i></div>
      <div class="pulse-lbl">${weekLabel(d.s)}${i===3?' · الحالي':''}</div>
      <div class="pulse-sub">${d.pcs.toLocaleString('en-US')} قطعة · أجور ${money(d.wages)}</div>
    </div>`).join('')}</div>
    <div class="hint" style="margin-top:6px;">العمود = الوارد المقبوض بالأسبوع (مبيعات + تحصيل ديون). اضغط على أي أسبوع لتفاصيل الإنتاج والأجور.</div></div>`;
}

function fitText(ctx, text, maxW){
  text = String(text==null?'':text);
  if(ctx.measureText(text).width <= maxW) return text;
  while(text.length>1 && ctx.measureText(text + '…').width > maxW) text = text.slice(0,-1);
  return text + '…';
}
async function buildReceiptCanvas(spec){
  const W = 900, S = 2, P = 44, FONT = '"IBM Plex Sans Arabic","Cairo",Tahoma,sans-serif';
  try{ await document.fonts.load('800 26px "IBM Plex Sans Arabic"'); await document.fonts.load('400 16px "IBM Plex Sans Arabic"'); }catch(e){}
  const logo = await new Promise(r=>{ const i = new Image(); i.onload = ()=>r(i); i.onerror = ()=>r(null); i.src = RECEIPT_LOGO; });
  function paint(ctx, draw){
    ctx.direction = 'rtl'; ctx.textBaseline = 'middle';
    if(draw){ ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,9999); }
    let y = 36;
    if(logo){ const lw = 150, lh = lw*logo.height/logo.width; if(draw) ctx.drawImage(logo,(W-lw)/2,y,lw,lh); y += lh + 14; }
    ctx.textAlign = 'center'; ctx.fillStyle = '#000'; ctx.font = '800 30px ' + FONT; if(draw) ctx.fillText(spec.title, W/2, y+16); y += 40;
    ctx.fillStyle = '#666'; ctx.font = '400 15px ' + FONT; if(draw) ctx.fillText(spec.date, W/2, y+8); y += 30;
    if(draw){ ctx.setLineDash([3,6]); ctx.strokeStyle = '#999'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(P,y); ctx.lineTo(W-P,y); ctx.stroke(); ctx.setLineDash([]); }
    y += 26;
    ctx.textAlign = 'right'; ctx.fillStyle = '#777'; ctx.font = '400 15px ' + FONT; if(draw) ctx.fillText(spec.nameLabel, W-P, y); y += 30;
    ctx.fillStyle = '#000'; ctx.font = '800 30px ' + FONT; if(draw) ctx.fillText(fitText(ctx, spec.name, W-2*P), W-P, y); y += 34;
    if(spec.sub){ ctx.fillStyle = '#777'; ctx.font = '400 14px ' + FONT; if(draw) ctx.fillText(fitText(ctx, spec.sub, W-2*P), W-P, y); y += 26; }
    y += 8;
    const tw = W-2*P, totalW = (spec.cols||[]).reduce((a,c)=>a+c.w,0);
    function table(cols, rows, rowH){
      let x = W-P; const xs = cols.map(c=>{ const w = tw*c.w/totalOf(cols); const r = {x, w}; x -= w; return r; });
      if(draw){ ctx.fillStyle = '#f1f1f1'; ctx.fillRect(P, y, tw, 40); }
      ctx.font = '700 14px ' + FONT; ctx.fillStyle = '#222';
      cols.forEach((c,i)=>{ if(draw){ ctx.textAlign = c.num?'left':'right'; ctx.fillText(c.label, c.num ? xs[i].x - xs[i].w + 10 : xs[i].x - 10, y+20); } });
      y += 40;
      rows.forEach((r,ri)=>{
        ctx.font = '400 15px ' + FONT; ctx.fillStyle = '#000';
        cols.forEach((c,i)=>{ if(draw){ ctx.textAlign = c.num?'left':'right'; ctx.fillText(fitText(ctx, r[i], xs[i].w-18), c.num ? xs[i].x - xs[i].w + 10 : xs[i].x - 10, y+rowH/2); } });
        y += rowH;
        if(draw){ ctx.strokeStyle = '#e2e2e2'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(P,y); ctx.lineTo(W-P,y); ctx.stroke(); }
      });
    }
    function totalOf(cols){ return cols.reduce((a,c)=>a+c.w,0); }
    if(spec.cols && spec.cols.length){ table(spec.cols, spec.rows, 42); y += 26; }
    const n = spec.totals.length, gap = 12, bw = (tw - gap*(n-1))/n;
    spec.totals.forEach((t,i)=>{
      const bx = W-P - (i+1)*bw - i*gap;
      if(draw){
        ctx.lineWidth = 1.6; ctx.strokeStyle = '#000';
        ctx.beginPath(); ctx.roundRect(bx, y, bw, 78, 12); if(t.strong){ ctx.fillStyle = '#000'; ctx.fill(); } else ctx.stroke();
        ctx.textAlign = 'center'; ctx.fillStyle = t.strong?'#ddd':'#666'; ctx.font = '400 14px ' + FONT; ctx.fillText(t.label, bx+bw/2, y+24);
        ctx.fillStyle = t.strong?'#fff':'#000'; ctx.font = '800 22px ' + FONT; ctx.fillText(fitText(ctx, t.value, bw-12), bx+bw/2, y+54);
      }
    });
    y += 78 + 28;
    if(spec.extra && spec.extra.rows && spec.extra.rows.length){
      ctx.textAlign = 'right'; ctx.fillStyle = '#000'; ctx.font = '800 18px ' + FONT; if(draw) ctx.fillText(spec.extra.title, W-P, y+8); y += 28;
      table(spec.extra.cols, spec.extra.rows, 36); y += 14;
    }
    if(spec.pays && spec.pays.length){
      ctx.textAlign = 'right'; ctx.fillStyle = '#000'; ctx.font = '800 18px ' + FONT; if(draw) ctx.fillText(spec.payTitle || 'الدفعات', W-P, y+8); y += 28;
      table([{label:'التاريخ',w:2},{label:'المبلغ',w:2,num:true},{label:'ملاحظة',w:4}], spec.pays, 36);
      y += 14;
    }
    ctx.textAlign = 'center'; ctx.fillStyle = '#888'; ctx.font = '400 14px ' + FONT;
    if(draw) ctx.fillText(spec.footer || 'شكراً لتعاملكم — ستر', W/2, y+16); y += 44;
    if(draw){ ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(10,10,W-20,y-20); }
    return y;
  }
  const tmp = document.createElement('canvas').getContext('2d'); tmp.canvas.width = W;
  const H = Math.ceil(paint(tmp, false));
  const cv = document.createElement('canvas'); cv.width = W*S; cv.height = H*S;
  const ctx = cv.getContext('2d'); ctx.scale(S,S);
  paint(ctx, true);
  return cv;
}
async function openReceipt(spec){
  window._rcpName = spec.name; window._rcpPrefix = spec.prefix||'وصل'; window._rcpWa = spec.waText||'';
  openModal({title:spec.modalTitle || ('🖨 وصل — ' + esc(spec.name)), bodyHtml:'<div id="rcpBox" class="hint" style="text-align:center;padding:30px;">جاري تجهيز الوصل…</div>', onSave(){ closeModal(); }});
  const sb = document.getElementById('modalSaveBtn'); if(sb) sb.textContent = 'إغلاق';
  try{
    const cv = await buildReceiptCanvas(spec);
    window._rcpCanvas = cv;
    const box = document.getElementById('rcpBox'); if(!box) return;
    box.className = ''; box.style.padding = '0';
    box.innerHTML = `<div class="btn-row" style="margin-bottom:12px;"><button class="btn primary" onclick="receiptSave()">💾 حفظ كصورة</button><button class="btn" onclick="receiptPrint()">🖨 طباعة</button><button class="btn" onclick="receiptWhatsApp()">💬 واتساب</button><button class="btn" onclick="receiptPdf()">📄 PDF</button>${navigator.canShare?'<button class="btn" onclick="receiptShare()">📤 مشاركة</button>':''}</div>
      <img alt="وصل" src="${cv.toDataURL('image/png')}" style="width:100%;border:1px solid var(--border-strong);border-radius:10px;background:#fff;display:block;">`;
  }catch(e){ const box = document.getElementById('rcpBox'); if(box) box.textContent = 'تعذر تجهيز الوصل: ' + e.message; }
}
function receiptFileName(){ return (window._rcpPrefix||'وصل') + '-' + String(window._rcpName||'').replace(/[\\/:*?"<>|]/g,'') + '-' + todayISO() + '.png'; }
function receiptSave(){ window._rcpCanvas.toBlob(b=>downloadBlob(b, receiptFileName()), 'image/png'); }
function receiptPrint(){
  const url = window._rcpCanvas.toDataURL('image/png');
  const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;width:0;height:0;border:0;right:0;bottom:0;';
  document.body.appendChild(f);
  f.contentDocument.open(); f.contentDocument.write('<html><head><style>@page{margin:10mm}body{margin:0}img{width:100%;max-width:190mm;display:block;margin:auto}</style></head><body><img src="'+url+'"></body></html>'); f.contentDocument.close();
  const img = f.contentDocument.querySelector('img');
  const go = ()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){} setTimeout(()=>f.remove(), 60000); };
  if(img.complete) go(); else img.onload = go;
}
function receiptShare(){
  window._rcpCanvas.toBlob(async b=>{ try{ const file = new File([b], receiptFileName(), {type:'image/png'}); if(navigator.canShare({files:[file]})) await navigator.share({files:[file], title:'وصل'}); else receiptSave(); }catch(e){} }, 'image/png');
}

function weekReportModel(ws){
  const we=weekEndOf(ws), days=[]; for(let i=0;i<7;i++){ const d=new Date(ws+'T12:00:00'); d.setDate(d.getDate()+i); days.push(isoOfDate(d)); }

  const rev=sales.reduce((a,x)=>a+saleRevenue(x),0), coll=ev.reduce((a,x)=>a+x.amount,0);
  const profit=sales.reduce((a,x)=>a+saleProfit(x),0)+ev.reduce((a,x)=>a+x.profit,0), expT=exps.reduce((a,x)=>a+num(x.amount),0);
  const rows=days.map(k=>{ const ss=sales.filter(x=>x.date===k), ee=ev.filter(x=>x.date===k); return [k.slice(5)+' '+AR_DAYS[new Date(k+'T12:00:00').getDay()], String(new Set(ss.map(x=>x.orderId||x.id)).size), money(ss.reduce((a,x)=>a+saleRevenue(x),0)+ee.reduce((a,x)=>a+x.amount,0)), money(ss.reduce((a,x)=>a+saleProfit(x),0)+ee.reduce((a,x)=>a+x.profit,0))]; });
  const byM={}; sales.forEach(x=>{ const l=saleProductLabel(x); byM[l]=(byM[l]||0)+num(x.quantity); });
  const top=Object.entries(byM).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([n,q])=>[n,q+' قطعة']);
  return {ws,we,rows,rev,coll,profit,expT,net:profit-expT,orders:new Set(sales.map(x=>x.orderId||x.id)).size,pieces:sales.reduce((a,x)=>a+num(x.quantity),0),top,custDebt:customerDebtsOutstandingTotal(),ourDebt:debtsOutstandingTotal()};

  const d = document.createElement('div'); d.id = 'fab'; d.className = 'no-print';
  d.innerHTML = `<div class="fab-menu" id="fabMenu">
      <button type="button" data-a="cd">🔺 دين زبون جديد</button>
      <button type="button" data-a="d">🔻 دين علينا جديد</button>
      <button type="button" data-a="cc">💰 تحصيل من زبون</button>
      <button type="button" data-a="dp">💸 تسديد دين علينا</button>
    </div><button type="button" class="fab-btn" id="fabBtn" aria-label="إضافة سريعة">+</button>`;
  document.body.appendChild(d);
  const toggle = f=>{ d.classList.toggle('open', f); };
  document.getElementById('fabBtn').onclick = e=>{ e.stopPropagation(); toggle(!d.classList.contains('open')); };
  document.addEventListener('click', e=>{ if(!d.contains(e.target)) toggle(false); });
  d.querySelectorAll('.fab-menu button').forEach(b=> b.onclick = ()=>{ toggle(false); ({cd:()=>openCustomerDebtModal(), d:()=>openDebtModal(), cc:quickCollect, dp:quickPay})[b.dataset.a](); });
}
function quickCollect(){
  const g = groupCustomerDebts(), list = Object.entries(g).map(([n,ds])=>({n, r:customerDebtGroupTotals(ds).remaining})).filter(x=>x.r>0).sort((a,b)=>b.r-a.r);
  if(!list.length) return toast('ما كو زبائن عليهم ديون حالياً');
  openModal({title:'💰 تحصيل من زبون', bodyHtml:`<div class="form-row"><label>الزبون</label><select id="q_c">${list.map(x=>`<option value="${encName(x.n)}">${esc(x.n)} — متبقي ${money(x.r)}</option>`).join('')}</select></div>`,
    onSave(){ const v = document.getElementById('q_c').value; closeModal(); openCustomerBulkRepayModal(v); }});
  document.getElementById('modalSaveBtn').textContent = 'متابعة';
}
function quickPay(){
  const list = state.debts.filter(d=>debtTotals(d.id).remaining>0);
  if(!list.length) return toast('ما كو دين علينا حالياً');
  openModal({title:'💸 تسديد دين علينا', bodyHtml:`<div class="form-row"><label>الدين</label><select id="q_d">${list.map(d=>`<option value="${d.id}">${esc(d.creditor)} — متبقي ${money(debtTotals(d.id).remaining)}</option>`).join('')}</select></div>`,
    onSave(){ const v = document.getElementById('q_d').value; closeModal(); openDebtRepayModal(v); }});
  document.getElementById('modalSaveBtn').textContent = 'متابعة';
}

/* ---- قائمة ⋯ للأزرار الثانوية داخل الجداول ---- */
function closeRowMenus(){ document.querySelectorAll('body > .row-menu').forEach(m=>m.remove()); }
function enhanceRowMenus(){
  document.querySelectorAll('main .btn-row').forEach(row=>{
    if(row.dataset.rm || !row.closest('td')) return;
    const btns = Array.from(row.children).filter(b=>b.tagName==='BUTTON');
    if(btns.length < 3) return;
    row.dataset.rm = '1';
    const keep = btns.find(b=>b.classList.contains('primary')) || btns[0];
    const rest = btns.filter(b=>b!==keep);
    rest.forEach(b=>{ b.style.display='none'; });
    const more = document.createElement('button'); more.type='button'; more.className='btn sm ghost rm-more'; more.textContent='⋯'; more.title='المزيد';
    row.appendChild(more);
    more.onclick = e=>{
      e.stopPropagation();
      const had = document.querySelector('body > .row-menu'); closeRowMenus();
      if(had && had._for===more) return;
      const menu = document.createElement('div'); menu.className='row-menu show'; menu._for=more;
      rest.forEach(b=>{ const nb=document.createElement('button'); nb.type='button'; nb.className='btn'+(b.classList.contains('danger')?' danger':''); nb.textContent=b.textContent.trim(); nb.onclick=ev=>{ ev.stopPropagation(); closeRowMenus(); b.click(); }; menu.appendChild(nb); });
      document.body.appendChild(menu);
      if(window.innerWidth>900){
        const r=more.getBoundingClientRect(), mh=menu.offsetHeight, mw=menu.offsetWidth;
        menu.style.top=(r.bottom+mh+8>window.innerHeight?Math.max(8,r.top-mh-4):r.bottom+4)+'px';
        menu.style.left=Math.max(8,Math.min(window.innerWidth-mw-8,r.left))+'px';
      }
    };
  });
}
document.addEventListener('click', closeRowMenus);
window.addEventListener('scroll', ()=>{ if(window.innerWidth>900) closeRowMenus(); }, true);

/* دفعة واحدة = عملية تحصيل واحدة (حتى لو انقسمت داخلياً على أكثر من دين) */
function groupedCustomerPayments(debtIds){
  const set = debtIds instanceof Set ? debtIds : new Set(debtIds), g = {}, order = [];
  state.customerDebtPayments.filter(p=>set.has(p.customerDebtId)).forEach(p=>{
    const bulk = /^تحصيل شامل/.test(p.notes||'');
    const key = p.batchId || (bulk ? ('b|' + p.date + '|' + p.notes) : ('p|' + p.id));
    if(!g[key]){ g[key] = {date:p.date||'', amount:0, parts:0, note:String(p.notes||'').replace(/^تحصيل شامل [\d,]+ د\.ع\s*—?\s*/,'').trim(), bulk:bulk||!!p.batchId}; order.push(key); }
    g[key].amount += num(p.amount); g[key].parts++;
  });
  return order.map(k=>g[k]).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}
function customerModelsLine(debts){
  const m = {};
  debts.forEach(d=>{ const n = d.modelId ? (modelById(d.modelId)?.name || 'موديل محذوف') : 'بدون تحديد'; m[n] = (m[n]||0) + num(d.quantity); });
  return Object.entries(m).map(([n,q])=>n + (q?' ×'+q:'')).join(' · ');
}
function openCustomerPaidModal(encodedName){
  const name = decodeURIComponent(encodedName);
  const debts = state.customerDebts.filter(d=>(d.customerName||'').trim()===name);
  const pays = groupedCustomerPayments(new Set(debts.map(d=>d.id)));
  const total = pays.reduce((s,p)=>s+p.amount,0);
  openModal({title:'💰 مسدّدات ' + esc(name),
    bodyHtml:`<div class="compute-box"><span>سدّد <b>${pays.length}</b> ${pays.length===1?'مرة':'مرات'}</span><span>المجموع: <b class="pos">${money(total)}</b></span></div>`+
      paidRowsHtml(pays, p=>(p.note || (p.bulk ? 'تحصيل' : '—'))),
    onSave(){ closeModal(); }});
  const b = document.getElementById('modalSaveBtn'); if(b) b.textContent = 'إغلاق';
}

    onSave(){ closeModal(); }});

function openAllPaidModal(kind){
  const isC = kind==='c', g = {};
  if(isC){
    const byC = {};
    state.customerDebts.forEach(d=>{ const n = String(d.customerName||'').trim() || 'بدون اسم'; (byC[n] = byC[n] || []).push(d.id); });

async function rcRestore(srcId,mode){

const IDB={ _db:null,
  open(){ return this._db||(this._db=new Promise((res,rej)=>{ try{ const r=indexedDB.open('str_local',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } })); },

  async get(k){ const d=await this.open(); return new Promise((res,rej)=>{ const q=d.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); },
  async del(k){ const d=await this.open(); return new Promise((res)=>{ const t=d.transaction('kv','readwrite'); t.objectStore('kv').delete(k); t.oncomplete=()=>res(true); t.onerror=()=>res(false); }); },
  async keys(){ const d=await this.open(); return new Promise((res,rej)=>{ const q=d.transaction('kv').objectStore('kv').getAllKeys(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>rej(q.error); }); }
};

    this.busy=true;

      const day=todayISO(), mon=day.slice(0,7), text=JSON.stringify(state);
      const wr=async(dir,n,t)=>{ const f=await dir.getFileHandle(n,{create:true}); const w=await f.createWritable(); await w.write(t); await w.close(); };
      const mdir=await this.dir.getDirectoryHandle(mon,{create:true}), ddir=await mdir.getDirectoryHandle('نسخ يومية',{create:true}), name=day+'.json';
      let guard=false;
      try{ const fh=await ddir.getFileHandle(name); const old=JSON.parse(await (await fh.getFile()).text());
        guard=['sales','models','customerDebts','debts','expenses','returns'].some(k=>Array.isArray(old[k])&&old[k].length>=6&&(Array.isArray(state[k])?state[k].length:0)<old[k].length*0.7); }catch(e){}
      if(guard){ await wr(ddir,day+'_مشبوهة.json',text); this.setSt('⚠️ البيانات نقصت فجأة — نسخة اليوم السليمة ما انبدلت','bad'); toast('⚠️ النسخة التلقائية: نقص مفاجئ بالبيانات! نسخة اليوم السليمة محفوظة ما انبدلت'); }
      else{ await wr(ddir,name,text); }
      const ws=weekStartOf(day), we=weekEndOf(ws), wn=Math.floor((Number(ws.slice(8))-1)/7)+1, wm=ws.slice(0,7);
      const wdir=wm===mon?mdir:await this.dir.getDirectoryHandle(wm,{create:true});
      await wr(wdir,'ملخص أسبوع '+wn+'.html',summaryHtml('ملخص أسبوع '+wn+' — '+monthLabelAr(wm),ws,we));
      await wr(mdir,'ملخص شهر '+mon+'.html',summaryHtml('ملخص شهر '+monthLabelAr(mon),mon+'-01',mon+'-31'));
      try{ const pm=ymAdd(mon,-1), pd=await this.dir.getDirectoryHandle(pm); try{ await pd.getFileHandle('ملخص شهر '+pm+'.html'); }catch(e){ await wr(pd,'ملخص شهر '+pm+'.html',summaryHtml('ملخص شهر '+monthLabelAr(pm),pm+'-01',pm+'-31')); } }catch(e){}
      if(!guard) this.setSt('✔ آخر نسخة '+new Date().toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'}),'ok');
      if(manual && !guard) toast('✅ انحفظت النسخة بالمجلد');
    }catch(e){ console.error('auto backup failed',e); this.setSt('⚠️ فشل الحفظ: '+(e&&e.message||e),'bad'); if(manual) toast('⚠️ فشل حفظ النسخة بالمجلد'); }
    finally{ this.busy=false; }
  }
};

    <div class="btn-row">${AB.ok?'':'<button class="btn primary" onclick="AB.now()">تفعيل</button>'}<button class="btn ${AB.ok?'primary':''}" onclick="AB.now()">حفظ الآن</button><button class="btn" onclick="AB.pick()">تغيير المجلد</button><button class="btn danger" onclick="AB.stop()">إيقاف</button></div>
    <div class="hint" style="margin-top:10px">الشكل: ‏<b>${esc(nm||'المجلد')}/2026-11/نسخ يومية/2026-11-28.json</b> + ملخص أسبوع + ملخص شهر. إذا نقصت البيانات فجأة ما يبدّل نسخة اليوم السليمة ويطلعلك تنبيه.</div>`;
  return `<div class="section-title">📁 النسخ التلقائي على جهازك</div><div class="card" style="max-width:620px;">${body}</div>`;
}
async function dailySnapshot(packed,force){
  const now=Date.now(); let last=0; try{ last=Number(localStorage.getItem('str_snap_t')||0); }catch(e){}
  if(!force && now-last<3*3600*1000) return null;
  const w=Object.keys(packed).filter(k=>Array.isArray(packed[k])&&k!=='auditLog').reduce((a,k)=>a+packed[k].length,0);
  if(w<5) return null; /* ما ناخذ لقطة من نسخة فارغة */
  const d=new Date(), p2=n=>String(n).padStart(2,'0'), id='snap_'+todayISO()+'_'+p2(d.getHours())+p2(d.getMinutes());
  const c=JSON.parse(JSON.stringify(packed)); c._snapOf=FIRESTORE_DOC; c._snapAt=now; c._snapNote=force?'يدوية':'تلقائية';
  await db.doc('erp_state/'+id).set(c);
  try{ localStorage.setItem('str_snap_t',String(now)); localStorage.setItem('str_snap_day',todayISO()); }catch(e){}
  try{ const FP=firebase.firestore.FieldPath.documentId(), q=await db.collection('erp_state').where(FP,'>=','snap_').where(FP,'<','snap_').get(), ids=[]; q.forEach(x=>ids.push(x.id)); ids.sort(); ids.slice(0,Math.max(0,ids.length-40)).forEach(x=>db.doc('erp_state/'+x).delete().catch(()=>{})); }catch(e){ console.error('snap cleanup failed',e); }
  return id;
}
function bkSnapNow(){ if(!firebaseReady) return toast('السحابة غير متصلة'); toast('⏳ جاري أخذ نسخة سحابية…'); packStateForCloud().then(p=>dailySnapshot(p,true)).then(id=>{ toast(id?'✅ انحفظت نسخة سحابية':'ما انحفظت (البيانات فارغة)'); render(); }).catch(e=>{ console.error(e); toast('⚠️ فشلت النسخة السحابية'); }); }
async function bkLocalModal(){
  const ks=(await IDB.keys()).filter(k=>String(k).startsWith('mirror_')).sort().reverse(), rows=[];
  for(const k of ks){ const v=await IDB.get(k); if(!v) continue; let j={}; try{ j=JSON.parse(v.json); }catch(e){} const A=x=>Array.isArray(j[x])?j[x].length:0;

  const sb=document.getElementById('modalSaveBtn'); if(sb) sb.style.display='none';
}
async function bkRestoreLocal(k){

   استعادة أرقام نوفمبر 2026 من لقطات الشاشة (تُفتح بـ #restore-nov)

const NOV_SALES=[['2026-11-15',420000,12],['2026-11-17',215000,6],['2026-11-18',415000,12],['2026-11-19',245000,7],['2026-11-20',315000,9],['2026-11-21',170000,5],['2026-11-22',880000,25],['2026-11-23',160000,4],['2026-11-24',35000,1]];
const NOV_PROFIT=1195000, NOV_AD_NAME='قياس خاص ديل كلوش';
const NOV_ADS=[['2026-11-26',78000],['2026-11-22',78000],['2026-11-20',78000],['2026-11-18',78728],['2026-11-15',33000]];
const NOV_PARTNERS=[['سيد احمد',25],['حسن الفتلاوي',37.5],['أمجد الربيعي',37.5]];
function novBuild(lastAdDate){
  const tot=NOV_SALES.reduce((s,x)=>s+x[1],0); let acc=0;
  const sales=NOV_SALES.map((x,i)=>{ const d=x[0], rev=x[1], q=x[2];
    const pr=(i===NOV_SALES.length-1)?NOV_PROFIT-acc:Math.round(rev*NOV_PROFIT/tot); acc+=pr;
    const price=rev/q;
    return {id:'rst-s-'+d,date:d,channel:'page',customerType:'retail',customerName:'مبيعات '+d.slice(8)+' نوفمبر (مستعادة)',orderId:'rst-o-'+d,quantity:q,unitPrice:price,costSnapshot:price-pr/q,productLabel:'مبيعات مستعادة من لقطة شاشة',restored:true}; });
  const ads=NOV_ADS.map((a,i)=>({id:'rst-ad-'+i,type:'إعلانات',amount:a[1],date:(i===NOV_ADS.length-1&&lastAdDate)?lastAdDate:a[0],notes:NOV_AD_NAME,channel:'page',source:'profit',modelId:null,campaignId:null,restored:true}));
  return {sales,ads};
}
function novApply(){
  if(window._loadFailed){ toast('ما انحمّلت بياناتك من السحابة، حدّث الصفحة أولاً'); return; }
  const dEl=document.getElementById('nvAdDate'), b=novBuild(dEl&&dEl.value||null), P=PS();
  b.sales.forEach(s=>{ if(!state.sales.some(x=>x.id===s.id)) state.sales.push(s); });
  b.ads.forEach(a=>{ if(!state.expenses.some(x=>x.id===a.id)) state.expenses.push(a); });
  NOV_PARTNERS.forEach((p,i)=>{ if(P.partners[i]){ P.partners[i].name=p[0]; P.partners[i].pct=p[1]; } });
  P.empDeduct=true;
  P.resetAt='2026-11-15'; if(P.contract) P.contract.start='2026-11-15'; /* بداية الشراكة: أكتوبر يطلع من حسابات الشركاء */
  saveState(); const el=document.getElementById('nvRoot'); if(el) el.remove();
  try{ history.replaceState(null,'',location.href.split('#')[0]); }catch(e){}
  currentDetail=null; navigate('partnership'); toast('تمت استعادة أرقام نوفمبر');
}

  const m=v=>money(v);
  const el=document.createElement('div'); el.id='nvRoot';
  el.innerHTML=`<style>#nvRoot{position:fixed;inset:0;z-index:100000;background:var(--bg);color:var(--text);overflow:auto;direction:rtl;font-family:'Cairo',sans-serif;padding:18px}#nvRoot .w{max-width:760px;margin:0 auto}#nvRoot h1{font-size:22px;margin:6px 0 8px}#nvRoot p{color:var(--text-dim);line-height:1.9;font-size:14px;margin:0 0 12px}#nvRoot .c{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px}#nvRoot table{width:100%;border-collapse:collapse;font-size:13.5px}#nvRoot td,#nvRoot th{padding:7px 8px;border-bottom:1px solid var(--border);text-align:right}#nvRoot th{color:var(--text-faint);font-weight:600;font-size:12px}#nvRoot .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}#nvRoot .g div{background:var(--surface-2);border-radius:10px;padding:8px 10px}#nvRoot small{display:block;color:var(--text-faint);font-size:11px}#nvRoot .b{font:inherit;font-weight:700;padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}#nvRoot .b.p{background:var(--text);color:var(--bg);border-color:var(--text)}#nvRoot input{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text)}</style>
  <div class="w"><h1>استعادة أرقام نوفمبر من لقطاتك</h1>
  <p>هذي الأرقام مأخوذة من صورك اللي صوّرتها قبل الضياع. تُضاف كسجلات ملخّصة (مبيعات كل يوم بسطر واحد) وتطابق أرقام صورك بالضبط. تفاصيل الطلبات الأصلية (الزبائن والموديلات) ما تنرجع من الصور، وتقدر تحذف أي سطر مستعاد أو تعدّله لاحقاً.</p>

  <div class="c"><div class="g"><div><small>وارد الصفحة</small><b>${m(rev)}</b></div><div><small>الأرباح قبل الإعلانات</small><b>${m(NOV_PROFIT)}</b></div><div><small>الإعلانات</small><b>${m(ads)}</b></div><div><small>أجور الموظف (${wage/1000} قطعة)</small><b>${m(wage)}</b></div><div><small>صافي للتوزيع</small><b>${m(net)}</b></div></div></div>
  <div class="c"><b>الوارد اليومي</b><table><tr><th>التاريخ</th><th>المبلغ</th><th>القطع (تقديري)</th></tr>${NOV_SALES.map(x=>`<tr><td>${x[0]}</td><td>${m(x[1])}</td><td>${x[2]}</td></tr>`).join('')}</table></div>
  <div class="c"><b>الإعلانات (${NOV_AD_NAME})</b><table><tr><th>التاريخ</th><th>المبلغ</th></tr>${NOV_ADS.map((x,i)=>`<tr><td>${i===NOV_ADS.length-1?`<input type="date" id="nvAdDate" value="${x[0]}">`:x[0]}</td><td>${m(x[1])}</td></tr>`).join('')}</table><p style="margin-top:10px;font-size:12.5px">الإعلان الأخير (${m(NOV_ADS[NOV_ADS.length-1][1])}) ما ظهر تاريخه بصورتك. حطيت 15 نوفمبر، عدّله هنا إذا تعرف التاريخ الصحيح.</p></div>
  <div class="c"><b>الشراكة</b><p style="margin:8px 0 0">${NOV_PARTNERS.map(p=>p[0]+' '+p[1]+'%').join(' · ')}. الأسماء تنرجع، وأجور الموظفين تنخصم من الصافي.<br><b>بداية الشراكة تنضبط على 15/11/2026:</b> مبيعات أكتوبر وما قبلها تبقى بالمبيعات والتقارير، بس ما تدخل بحسابات الشركاء، ويختفي طلب «إقفال أكتوبر».</p></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="b p" onclick="novApply()">إضافة أرقام نوفمبر للتطبيق</button><button class="b" onclick="document.getElementById('nvRoot').remove();history.replaceState(null,'',location.href.split('#')[0]);">إلغاء</button></div></div>`;
  document.body.appendChild(el);
}

(async function init(){

  if(rcForce) window._loadFailed=true; /* يمنع أي حفظ أثناء الاسترجاع */

  if(window._needsFirstSave){ setTimeout(()=>saveState(), 600); }
  const foot = document.querySelector('.sidebar .foot');
  if(foot) foot.textContent = firebaseReady
    ? 'البيانات محفوظة على Firebase ومتزامنة على كل الأجهزة'

      ? 'البيانات مشتركة ومتزامنة لكل من يفتح هذا الرابط'

  try{ if(localStorage.getItem('str_client_num')!==String(CLIENT_NUM)){ localStorage.setItem('str_client_num',String(CLIENT_NUM)); setTimeout(()=>{ packStateForCloud().then(p=>dailySnapshot(p,true)).catch(()=>{}); },4000); } }catch(e){}
  enhanceInputs(); updateRateChip(); refreshUsdRate(false);
  setTheme(document.documentElement.getAttribute('data-theme')||'light');
  startSbClock(); refreshBell(); setInterval(refreshBell,6000);
  try{ const lb=localStorage.getItem('str_lastbackup'); const ds=lb?Math.floor((Date.now()-new Date(lb.slice(0,10)).getTime())/86400000):999; if(ds>=7 && !rcForce && sessionStorage.getItem('str_bk_nag')!==todayISO() && (state.sales||[]).length){ sessionStorage.setItem('str_bk_nag',todayISO()); setTimeout(()=>toast('⚠️ '+(lb?('مرّ '+ds+' يوم على آخر نسخة احتياطية'):'ما نزّلت نسخة احتياطية لحد الآن')+' — نزّل نسخة من زر 💾 حتى ما تضيع بياناتك'),3000); } }catch(e){}

  else if(firebaseReady && !window._loadFailed && !(state.sales||[]).length){ try{ const lg=await db.doc(LEGACY_FIRESTORE_DOC).get(); if(lg.exists && (lg.data().sales||[]).length){ window._loadFailed=true; openRecovery(true); } }catch(e){} }
})();
