    --border-strong:rgba(242,236,224,0.18);
    --stitch:repeating-linear-gradient(90deg, var(--border-strong) 0 6px, transparent 6px 12px);
    --radius:10px;
    --radius-sm:7px;
    --shadow:0 10px 28px rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans Arabic',sans-serif;
    font-size:15px;
    line-height:1.6;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  button,a,input,select,textarea,.model-card,.mobile-nav button,tbody tr{touch-action:manipulation;}
  button{min-height:38px;}
  .mobile-nav button{min-height:52px;}
  h1,h2,h3,h4{font-family:'Cairo',sans-serif;margin:0;font-weight:800;}
  ::selection{background:var(--accent);color:#15130f;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}
  .hidden{display:none !important;}

  /* ---------- Lock screen ---------- */
  #lockScreen{
    position:fixed;inset:0;background:var(--bg);z-index:999;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;
  }
  #lockScreen .emblem{
    width:104px;height:auto;display:flex;align-items:center;justify-content:center;
  }
  #lockScreen .emblem img{width:100%;height:auto;display:block;}
  #lockScreen .brand{font-family:'Cairo',sans-serif;font-weight:800;font-size:26px;color:var(--accent-soft);letter-spacing:0.5px;}
  #lockScreen .sub{color:var(--text-dim);font-size:13.5px;margin-top:-6px;}
  #lockScreen input{
    background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);
    padding:14px 18px;border-radius:var(--radius-sm);font-size:22px;letter-spacing:8px;text-align:center;width:220px;
    font-family:'IBM Plex Sans Arabic',sans-serif;
  }
  #lockScreen .err{color:var(--negative);font-size:13px;min-height:18px;}

  /* ---------- Layout ---------- */
  .app{display:flex;min-height:100vh;}
  .sidebar{
    width:226px;flex:none;background:var(--surface);border-left:1px solid var(--border);
    display:flex;flex-direction:column;padding:24px 12px;position:sticky;top:0;height:100vh;
  }
  .sidebar .brand{padding:0 10px 18px 10px;display:flex;align-items:center;gap:10px;}
  .sidebar .brand .mark{
    width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;
  }
  .sidebar .brand .mark img{width:100%;height:100%;object-fit:contain;}
  .sidebar .brand .name{font-family:'Cairo',sans-serif;font-weight:800;font-size:19px;color:var(--accent-soft);line-height:1.1;}
  .sidebar .brand .tag{font-size:11px;color:var(--text-faint);margin-top:2px;}
  .sidebar-rule{height:1px;background:var(--stitch);margin:0 6px 14px;}
  .navlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:1px;flex:1;}
  .navlist li button{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:4px;
    color:var(--text-dim);text-decoration:none;font-size:14px;font-weight:500;transition:.15s;
    border-inline-start:2px solid transparent;
    width:100%;background:none;border-top:none;border-bottom:none;border-inline-end:none;
    text-align:inherit;font-family:inherit;min-height:auto;
  }
  .navlist li button .ic{font-size:16px;width:18px;text-align:center;}
  .navlist li button:hover{background:var(--surface-2);color:var(--text);}
  .navlist li button.active{background:var(--surface-2);color:var(--accent-soft);font-weight:700;border-inline-start-color:var(--accent);}
  .sidebar .foot{font-size:11px;color:var(--text-faint);padding:12px 10px 0;margin-top:10px;border-top:1px solid var(--border);}

  main{flex:1;min-width:0;padding:26px 30px 90px;}
  .page-head{
    display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;
    margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--border);
  }
  .page-head h1{font-size:25px;font-weight:700;}
  .page-head .desc{color:var(--text-dim);font-size:13.5px;margin-top:5px;}

  .mobile-nav{display:none;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--border-strong);
    color:var(--text);padding:9px 16px;border-radius:6px;font-size:13.5px;font-weight:500;transition:.15s;
  }
  .btn:hover{background:var(--surface-3);border-color:var(--accent-dim);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#20180c;font-weight:700;}
  .btn.primary:hover{background:var(--accent-soft);border-color:var(--accent-soft);}
  .btn.danger{background:transparent;border-color:var(--negative);color:var(--negative);}
  .btn.danger:hover{background:rgba(193,120,95,0.12);}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--text-dim);}
  .btn.ghost:hover{color:var(--text);background:var(--surface-2);}
  .btn.sm{padding:6px 11px;font-size:12px;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}

  /* ---------- Cards / grid ---------- */
  .grid{display:grid;gap:12px;}
  .grid.stats{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px;}
  .stat-card .label{font-size:12px;color:var(--text-dim);margin-bottom:9px;}
  .stat-card .value{font-size:21px;font-weight:700;font-family:'Cairo',sans-serif;}
  .stat-card .value.pos{color:var(--positive);}
  .stat-card .value.neg{color:var(--negative);}
  .stat-card .value.accent{color:var(--accent-soft);}
  .stat-card .sub{font-size:11px;color:var(--text-faint);margin-top:7px;}
  .stat-card.hero{
    grid-column:span 2;background:linear-gradient(180deg,var(--surface-2),var(--surface));
    border-color:var(--accent-dim);
  }
  .stat-card.hero .label{font-size:13px;}
  .stat-card.hero .value{font-size:34px;}
  @media (max-width:520px){.stat-card.hero{grid-column:span 1;}}

  .section-title{
    font-family:'Cairo',sans-serif;font-size:16.5px;font-weight:800;margin:28px 0 12px;color:var(--text);
    display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px dashed var(--border-strong);
  }
  .section-title .ic{color:var(--accent);font-family:initial;}

  /* ---------- Toolbar / filters ---------- */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;justify-content:space-between;}
  .toolbar .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .field-inline{display:flex;flex-direction:column;gap:4px;}
  .field-inline label{font-size:11px;color:var(--text-faint);}
  input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{
    background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);
    padding:9px 11px;border-radius:6px;font-size:13.5px;outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  input[type=number],td.num,.compute-box b{font-family:'IBM Plex Sans Arabic',sans-serif;}
  textarea{resize:vertical;min-height:60px;}
  .search-box{min-width:190px;}

  /* ---------- Table ---------- */
  .table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px;}
  thead th{
    text-align:right;padding:11px 14px;color:var(--text-faint);font-weight:600;font-size:11.5px;
    border-bottom:1.5px solid var(--accent-dim);white-space:nowrap;background:transparent;
  }
  tbody td{padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  .num{font-variant-numeric:tabular-nums;font-family:'IBM Plex Sans Arabic',sans-serif;}
  .pos{color:var(--positive);}
  .neg{color:var(--negative);}
  .muted{color:var(--text-faint);}
  .empty-row td{text-align:center;color:var(--text-faint);padding:34px;}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;}
  .pill.in{background:rgba(127,160,124,0.16);color:var(--positive);}
  .pill.out{background:rgba(193,120,95,0.16);color:var(--negative);}
  .pill.wholesale{background:rgba(201,161,93,0.18);color:var(--accent);}
  .pill.retail{background:rgba(183,172,167,0.16);color:var(--text-dim);}

  /* ---------- Model cards ---------- */
  .model-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
  .model-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.15s;}
  .model-card:hover{border-color:var(--accent-dim);}
  .model-card .thumb{width:100%;aspect-ratio:1/1;background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--text-faint);font-size:12px;}
  .model-card .thumb img{width:100%;height:100%;object-fit:cover;}
  .model-card .info{padding:12px;}
  .model-card .code{font-size:11px;color:var(--accent-soft);font-weight:700;}
  .model-card .name{font-family:'Cairo',sans-serif;font-size:16px;font-weight:700;margin-top:3px;}
  .model-card .row{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--text-dim);}
  .add-model-card{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;border:1.5px dashed var(--border-strong);border-radius:var(--radius);color:var(--text-faint);min-height:180px;background:transparent;font-size:13px;}
  .add-model-card:hover{color:var(--accent);border-color:var(--accent-dim);}

  .gallery{display:flex;gap:8px;flex-wrap:wrap;}
  .gallery img{width:88px;height:88px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--border-strong);}
  .gallery .thumb-x{position:relative;}
  .gallery .thumb-x button{position:absolute;top:-6px;left:-6px;background:var(--negative);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1;}

  /* ---------- Modal ---------- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(10,8,10,0.6);display:flex;align-items:flex-start;justify-content:center;z-index:500;overflow-y:auto;padding:5vh 14px;}
  #confirmRoot .modal-backdrop{z-index:600;}
  .modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);width:100%;max-width:520px;box-shadow:var(--shadow);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);}
  .modal-head h3{font-family:'Cairo',sans-serif;font-size:19px;}
  .modal-head button{background:none;border:none;color:var(--text-dim);font-size:20px;}
  .modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:13px;max-height:64vh;overflow-y:auto;}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
  .form-row{display:flex;flex-direction:column;gap:5px;}
  .form-row label{font-size:12.5px;color:var(--text-dim);font-weight:500;}
  .form-row .hint{font-size:11px;color:var(--text-faint);}
  .form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .compute-box{background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;}

  /* ---------- Toast ---------- */
  #toastRoot{position:fixed;bottom:22px;left:22px;z-index:700;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--surface-3);border:1px solid var(--border-strong);color:var(--text);padding:11px 18px;border-radius:var(--radius-sm);box-shadow:var(--shadow);font-size:13.5px;animation:toastin .18s ease-out;}
  @keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- Bars (dashboard mini chart) ---------- */
  .bars{display:flex;align-items:flex-end;gap:14px;height:140px;padding:10px 4px 0;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .bar-track{width:100%;max-width:34px;height:100px;background:var(--surface-2);border-radius:6px 6px 0 0;display:flex;align-items:flex-end;overflow:hidden;}
  .bar-fill{width:100%;background:var(--accent);border-radius:6px 6px 0 0;}
  .bar-col .lbl{font-size:10.5px;color:var(--text-faint);}
  .legend{display:flex;gap:16px;font-size:11.5px;color:var(--text-dim);margin-bottom:6px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}

  /* ---------- Detail header ---------- */
  .detail-back{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-size:13px;margin-bottom:10px;background:none;border:none;}
  .detail-back:hover{color:var(--accent);}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:18px;}
  .detail-head .titles .code{color:var(--accent-soft);font-size:12.5px;font-weight:700;}
  .detail-head .titles h1{margin-top:3px;}

  @media print{
    .sidebar,.mobile-nav,.toolbar .btn,.no-print,.modal-backdrop,#toastRoot{display:none !important;}
    body{background:#fff;color:#000;}
    main{padding:0;}
    .card,.table-wrap{border-color:#ccc;background:#fff;}
    thead th{background:#f2f2f2;color:#000;}
  }

  @media (max-width:900px){
    .sidebar{display:none;}
    main{padding:16px 14px 90px;}
    .mobile-nav{
      display:flex;position:fixed;bottom:0;right:0;left:0;background:var(--surface);
      border-top:1px solid var(--border);z-index:400;overflow-x:auto;padding:6px 4px;gap:2px;
    }
    .mobile-nav button{
      flex:1;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:3px;
      padding:7px 4px;color:var(--text-faint);text-decoration:none;font-size:10px;border-radius:8px;
      background:none;border:none;font-family:inherit;min-height:52px;
    }
    .mobile-nav button .ic{font-size:18px;}
    .mobile-nav button.active{color:var(--accent-soft);font-weight:700;}
    .form-grid2{grid-template-columns:1fr;}
  }
</style>
</head>

<script>
/* =========================================================
   DATA LAYER
========================================================= */
const STORAGE_KEY = 'setr_erp_state_v1';
const hasCloudStorage = (typeof window.storage !== 'undefined' && window.storage !== null);

function defaultState(){
  return {
    settings:{ shopName:'ستر', pin:null },
    expenses:[], tailors:[], tailorWork:[], tailorPayments:[],
    cutters:[], cutterWork:[], cutterPayments:[],
    hoodaris:[], hoodariWork:[], hoodariPayments:[],
    models:[], sales:[], debts:[], debtPayments:[], customerDebts:[], customerDebtPayments:[],
    pageManagers:[{id:'seed-ahmed', name:'سيد أحمد', notes:'مدير صفحة التواصل الاجتماعي'}],
    pageManagerFees:[], pageManagerPayments:[]
  };
}
async function loadStateAsync(){
  if(hasCloudStorage){
    try{
      const res = await window.storage.get(STORAGE_KEY, true); // shared=true: same data for anyone with the link
      if(res && res.value) return Object.assign(defaultState(), JSON.parse(res.value));
    }catch(e){ /* key not created yet on first run — use defaults */ }
    return defaultState();
  }
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    return Object.assign(defaultState(), JSON.parse(raw));
  }catch(e){ return defaultState(); }
}
let state = defaultState();
let saveQueued = false;
function saveState(){
  if(hasCloudStorage){
    saveQueued = true;
    window.storage.set(STORAGE_KEY, JSON.stringify(state), true)
      .then(()=>{ saveQueued = false; })
      .catch(e=>{ saveQueued = false; console.error('cloud save failed', e); toast('⚠️ تعذر حفظ البيانات — تحقق من الاتصال بالإنترنت'); });
  } else {
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }
}

/* =========================================================
   UTILITIES
========================================================= */
const uid = () => 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const todayISO = () => new Date().toISOString().slice(0,10);
const thisMonth = () => new Date().toISOString().slice(0,7);
function money(n){
  n = Math.round(Number(n)||0);
  return n.toLocaleString('en-US') + ' د.ع';
}
function num(v){ const n = Number(v); return isNaN(n) ? 0 : n; }
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function encName(s){ return encodeURIComponent(s==null?'':s).replace(/'/g,'%27'); }
function inMonth(dateStr, ym){ if(!ym) return true; return (dateStr||'').slice(0,7) === ym; }
function inRange(dateStr, from, to){ if(from && dateStr < from) return false; if(to && dateStr > to) return false; return true; }

function toast(msg){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}
function confirmDelete(msg, onYes){
  return askConfirm(msg || 'هل أنت متأكد من الحذف؟ لا يمكن التراجع.', onYes);
}
function askConfirm(msg, onYes, opts){
  opts = opts || {};
  const root = document.getElementById('confirmRoot');
  root.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeConfirm()">
      <div class="modal" style="max-width:420px;">
        <div class="modal-head"><h3>${esc(opts.title||'تأكيد')}</h3><button type="button" onclick="closeConfirm()">×</button></div>
        <div class="modal-body"><div style="font-size:14.5px;line-height:1.7;">${esc(msg)}</div></div>
        <div class="modal-foot">
          <button type="button" class="btn ghost" onclick="closeConfirm()">إلغاء</button>
          <button type="button" class="btn danger" id="confirmYesBtn">${esc(opts.yesLabel||'حذف')}</button>
        </div>
      </div>
    </div>`;
  document.getElementById('confirmYesBtn').onclick = function(){
    closeConfirm();
    if(typeof onYes === 'function') onYes();
  };
  return false;
}
function closeConfirm(){ const r = document.getElementById('confirmRoot'); if(r) r.innerHTML=''; }

function downloadBlob(content, filename, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
function toCSV(headers, rows){
  const esc2 = v => `"${String(v===undefined||v===null?'':v).replace(/"/g,'""')}"`;
  const lines = [headers.map(esc2).join(',')];
  rows.forEach(r => lines.push(r.map(esc2).join(',')));
  return '\uFEFF' + lines.join('\r\n');
}

/* =========================================================
   COMPUTED HELPERS
========================================================= */
function modelById(id){ return state.models.find(m=>m.id===id); }
function tailorById(id){ return state.tailors.find(t=>t.id===id); }

function modelCost(m){
  if(!m) return 0;
  return num(m.fabricCost)+num(m.sewingCost)+num(m.accessoriesCost)+num(m.packagingCost)+num(m.otherCost);
}
function modelProfitPerPiece(m){ return num(m.sellingPrice) - modelCost(m); }

function tailorTotals(tailorId){
  const due = state.tailorWork.filter(w=>w.tailorId===tailorId)
    .reduce((s,w)=> s + num(w.pieceCount)*num(w.pricePerPiece), 0);
  const paid = state.tailorPayments.filter(p=>p.tailorId===tailorId)
    .reduce((s,p)=> s + num(p.amount), 0);
  return {due, paid, remaining: due - paid};
}
function cutterById(id){ return state.cutters.find(c=>c.id===id); }
function cutterTotals(cutterId){
  const due = state.cutterWork.filter(w=>w.cutterId===cutterId)
    .reduce((s,w)=> s + num(w.pieceCount)*num(w.pricePerPiece), 0);
  const paid = state.cutterPayments.filter(p=>p.cutterId===cutterId)
    .reduce((s,p)=> s + num(p.amount), 0);
  return {due, paid, remaining: due - paid};
}
function cutterDuesOutstandingTotal(){
  return state.cutters.reduce((s,c)=> s + cutterTotals(c.id).remaining, 0);
}
function hoodariById(id){ return state.hoodaris.find(h=>h.id===id); }
function hoodariTotals(hoodariId){
  const due = state.hoodariWork.filter(w=>w.hoodariId===hoodariId)
    .reduce((s,w)=> s + num(w.pieceCount)*num(w.pricePerPiece), 0);
  const paid = state.hoodariPayments.filter(p=>p.hoodariId===hoodariId)
    .reduce((s,p)=> s + num(p.amount), 0);
  return {due, paid, remaining: due - paid};
}
function hoodariDuesOutstandingTotal(){
  return state.hoodaris.reduce((s,h)=> s + hoodariTotals(h.id).remaining, 0);
}

function debtById(id){ return state.debts.find(d=>d.id===id); }
function debtTotals(debtId){
  const debt = debtById(debtId);
  const due = debt ? num(debt.amount) : 0;
  const paid = state.debtPayments.filter(p=>p.debtId===debtId).reduce((s,p)=>s+num(p.amount),0);
  return {due, paid, remaining: due - paid};
}
function debtsOutstandingTotal(){
  return state.debts.reduce((s,d)=> s + Math.max(0, debtTotals(d.id).remaining), 0);
}
function customerDebtById(id){ return state.customerDebts.find(d=>d.id===id); }
function customerDebtTotals(id){
  const d = customerDebtById(id);
  const due = d ? num(d.amount) : 0;
  const paid = state.customerDebtPayments.filter(p=>p.customerDebtId===id).reduce((s,p)=>s+num(p.amount),0);
  return {due, paid, remaining: due - paid};
}
function customerDebtsOutstandingTotal(){
  return state.customerDebts.reduce((s,d)=> s + Math.max(0, customerDebtTotals(d.id).remaining), 0);
}

function saleRevenue(s){ return num(s.quantity)*num(s.unitPrice); }
function saleCost(s){ return num(s.quantity)*num(s.costSnapshot!=null?s.costSnapshot:modelCost(modelById(s.modelId))); }
function saleProfit(s){ return saleRevenue(s) - saleCost(s); }
function saleProductLabel(s){
  if(s.modelId){ const m = modelById(s.modelId); return m ? m.name : 'موديل محذوف'; }
  return s.productLabel || 'بيع بدون موديل';
}

function periodTotals(from, to){
  const sales = state.sales.filter(s=>inRange(s.date, from, to));
  const expenses = state.expenses.filter(e=>inRange(e.date, from, to));
  const work = state.tailorWork.filter(w=>inRange(w.date, from, to));
  const cutWork = state.cutterWork.filter(w=>inRange(w.date, from, to));
  const hoodWork = state.hoodariWork.filter(w=>inRange(w.date, from, to));
  const revenue = sales.reduce((s,x)=>s+saleRevenue(x),0);
  const cogs = sales.reduce((s,x)=>s+saleCost(x),0);
  const expTotal = expenses.reduce((s,x)=>s+num(x.amount),0);
  const sewnPieces = work.reduce((s,x)=>s+num(x.pieceCount),0);
  const cutPieces = cutWork.reduce((s,x)=>s+num(x.pieceCount),0);
  const hoodPieces = hoodWork.reduce((s,x)=>s+num(x.pieceCount),0);
  const piecesProduced = cutPieces;
  const piecesSold = sales.reduce((s,x)=>s+num(x.quantity),0);
  const sewingCostPeriod = work.reduce((s,x)=>s+num(x.pieceCount)*num(x.pricePerPiece),0);
  const cuttingCostPeriod = cutWork.reduce((s,x)=>s+num(x.pieceCount)*num(x.pricePerPiece),0);
  const hoodariCostPeriod = hoodWork.reduce((s,x)=>s+num(x.pieceCount)*num(x.pricePerPiece),0);
  const netProfit = revenue - cogs - expTotal;
  return {revenue,cogs,expTotal,piecesProduced,sewnPieces,cutPieces,hoodPieces,piecesSold,sewingCostPeriod,cuttingCostPeriod,hoodariCostPeriod,netProfit,salesCount:sales.length};
}
function tailorDuesOutstandingTotal(){
  return state.tailors.reduce((s,t)=> s + tailorTotals(t.id).remaining, 0);
}
function pageManagerById(id){ return state.pageManagers.find(m=>m.id===id); }
function pageManagerTotals(managerId){
  const due = state.pageManagerFees.filter(f=>f.managerId===managerId).reduce((s,f)=>s+num(f.amount),0);
  const paid = state.pageManagerPayments.filter(p=>p.managerId===managerId).reduce((s,p)=>s+num(p.amount),0);
  return {due, paid, remaining: due - paid};
}
function pageManagerDuesOutstandingTotal(){
  return state.pageManagers.reduce((s,m)=> s + pageManagerTotals(m.id).remaining, 0);
}

/* =========================================================
   ROUTER
========================================================= */
const PAGES = [
  {id:'dashboard', label:'الرئيسية', icon:'🏠'},
  {id:'sales', label:'الوارد / المبيعات', icon:'📦'},
  {id:'models', label:'الموديلات', icon:'👗'},
  {id:'tailors', label:'الخياطين', icon:'🧵'},
  {id:'cutters', label:'الفصالين', icon:'✂️'},
  {id:'hoodaris', label:'الهودارية', icon:'🪡'},
  {id:'expenses', label:'المصاريف', icon:'💸'},
  {id:'debts', label:'ديون علينا', icon:'📒'},
  {id:'customerdebts', label:'ديون الزبائن', icon:'🧾'},

let currentPage = 'dashboard';
let currentDetail = null;

function buildNav(){
  const navList = document.getElementById('navList');
  navList.innerHTML = PAGES.map(p => `
    <li><button type="button" data-page="${p.id}" class="${currentPage===p.id?'active':''}" onclick="navigate('${p.id}')">
      <span class="ic">${p.icon}</span><span>${p.label}</span>
    </button></li>`).join('');

  const mobileNav = document.getElementById('mobileNav');
  mobileNav.innerHTML = PAGES.map(p => `
    <button type="button" class="${currentPage===p.id?'active':''}" onclick="navigate('${p.id}')">
      <span class="ic">${p.icon}</span><span>${p.label.split(' / ')[0]}</span>
    </button>`).join('');
}
function navigate(page){
  currentPage = page; currentDetail = null;
  render();
  window.scrollTo(0,0);
}
function render(){
  buildNav();
  const main = document.getElementById('mainContent');
  if(currentPage==='dashboard') main.innerHTML = renderDashboard();
  else if(currentPage==='soldmodels') main.innerHTML = renderSoldModels();
  else if(currentPage==='expenses') main.innerHTML = renderExpenses();
  else if(currentPage==='tailors') main.innerHTML = currentDetail ? renderTailorDetail(currentDetail) : renderTailors();
  else if(currentPage==='cutters') main.innerHTML = currentDetail ? renderCutterDetail(currentDetail) : renderCutters();
  else if(currentPage==='hoodaris') main.innerHTML = currentDetail ? renderHoodariDetail(currentDetail) : renderHoodaris();
  else if(currentPage==='models') main.innerHTML = currentDetail ? renderModelDetail(currentDetail) : renderModels();
  else if(currentPage==='sales') main.innerHTML = renderSales();
  else if(currentPage==='debts') main.innerHTML = renderDebts();
  else if(currentPage==='customerdebts') main.innerHTML = currentDetail ? renderCustomerDetail(currentDetail) : renderCustomerDebts();
  else if(currentPage==='social') main.innerHTML = currentDetail ? renderPageManagerDetail(currentDetail) : renderSocialPage();
  else if(currentPage==='reports') main.innerHTML = renderReports();
  else if(currentPage==='settings') main.innerHTML = renderSettings();
  attachDeferredCharts();
}

let dashboardMonth = thisMonth();
function renderDashboard(){
  const all = dashboardMonth === 'ALL';
  const from = all ? null : dashboardMonth+'-01';
  const to = all ? null : dashboardMonth+'-31';
  const t = periodTotals(from, to);
  const duesTotal = tailorDuesOutstandingTotal();
  const cutterDuesTotal = cutterDuesOutstandingTotal();
  const hoodariDuesTotal = hoodariDuesOutstandingTotal();

  const months = [];
  const base = new Date();
  for(let i=5;i>=0;i--){
    const d = new Date(base.getFullYear(), base.getMonth()-i, 1);
    months.push(d.toISOString().slice(0,7));
  }
  const monthData = months.map(ym=>({ym, ...periodTotals(ym+'-01', ym+'-31')}));
  const maxVal = Math.max(1, ...monthData.map(m=>Math.max(m.revenue, m.expTotal)));

  const salesAgg = {};
  state.sales.forEach(s=>{ salesAgg[s.modelId] = (salesAgg[s.modelId]||0) + num(s.quantity); });
  const topModels = Object.entries(salesAgg).sort((a,b)=>b[1]-a[1]).slice(0,5)
    .map(([id,qty])=>({model:modelById(id), qty}))
    .filter(x=>x.model);

  return `

    <div><h1>لوحة التحكم</h1><div class="desc">نظرة شاملة على أداء المشروع</div></div>
    <div class="toolbar" style="margin:0;">
      <div class="field-inline">
        <label>الفترة</label>
        <select onchange="dashboardMonth=this.value;render();">
          ${monthOptionsList(dashboardMonth)}

        </select>
      </div>
    </div>
  </div>

  <div class="grid stats">
    ${statCard('صافي الربح', money(t.netProfit), t.netProfit>=0?'pos':'neg', null, true)}
    ${statCard('إجمالي الوارد', money(t.revenue), 'accent', `${t.salesCount} عملية بيع`)}
    ${statCard('إجمالي المصاريف', money(t.expTotal), 'neg')}
    ${statCard('تكلفة الإنتاج المباع', money(t.cogs), '')}
    ${statCard('القطع المنتجة', t.piecesProduced.toLocaleString('en-US'), '', 'حسب الفصل')}
    ${statCard('القطع المباعة', t.piecesSold.toLocaleString('en-US'), '', null, false, "navigate('soldmodels')")}
    ${statCard('مستحقات الخياطين (الكلي)', money(duesTotal), duesTotal>0?'neg':'pos', 'رصيد تراكمي غير مرتبط بالفترة')}
    ${statCard('مستحقات الفصالين (الكلي)', money(cutterDuesTotal), cutterDuesTotal>0?'neg':'pos', 'رصيد تراكمي غير مرتبط بالفترة')}
    ${statCard('مستحقات الهودارية (الكلي)', money(hoodariDuesTotal), hoodariDuesTotal>0?'neg':'pos', 'رصيد تراكمي غير مرتبط بالفترة')}
    ${statCard('ديون علينا (الكلي)', money(debtsOutstandingTotal()), debtsOutstandingTotal()>0?'neg':'pos', 'رصيد تراكمي — للموردين وغيرهم')}
    ${statCard('ديون الزبائن لنا (الكلي)', money(customerDebtsOutstandingTotal()), customerDebtsOutstandingTotal()>0?'pos':'', 'رصيد تراكمي — جملة ومفرد')}
  </div>

  <div class="section-title"><span class="ic">📈</span> مقارنة آخر 6 أشهر (الوارد مقابل المصاريف)</div>
  <div class="card">
    <div class="legend">
      <span><i style="background:var(--accent)"></i> الوارد</span>
      <span><i style="background:var(--rose)"></i> المصاريف</span>
    </div>
    <div class="bars">
      ${monthData.map(m=>`
        <div class="bar-col">
          <div style="display:flex;gap:4px;align-items:flex-end;height:100px;">
            <div class="bar-track"><div class="bar-fill" style="height:${Math.round(m.revenue/maxVal*100)}%"></div></div>
            <div class="bar-track"><div class="bar-fill" style="height:${Math.round(m.expTotal/maxVal*100)}%;background:var(--rose)"></div></div>
          </div>
          <div class="lbl">${m.ym.slice(5)}/${m.ym.slice(2,4)}</div>
        </div>`).join('')}
    </div>
  </div>

  <div class="section-title"><span class="ic">⭐</span> الأكثر مبيعاً</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>الموديل</th><th>الكود</th><th>القطع المباعة</th></tr></thead>
      <tbody>
        ${topModels.length? topModels.map(x=>`<tr><td>${esc(x.model.name)}</td><td class="muted">${esc(x.model.code)}</td><td class="num">${x.qty}</td></tr>`).join('')

function statCard(label, value, cls, sub, hero, onClick){
  const clickAttrs = onClick ? ` style="cursor:pointer" onclick="${onClick}"` : '';
  const hint = onClick ? `<div class="sub" style="color:var(--accent-soft)">اضغط للتفاصيل ←</div>` : '';
  return `<div class="card stat-card${hero?' hero':''}"${clickAttrs}><div class="label">${label}</div><div class="value ${cls||''}">${value}</div>${sub?`<div class="sub">${sub}</div>`:''}${hint}</div>`;
}
let soldModelsMonth = 'ALL';
function renderSoldModels(){
  const all = soldModelsMonth === 'ALL';
  const from = all ? null : soldModelsMonth+'-01';
  const to = all ? null : soldModelsMonth+'-31';
  const sales = state.sales.filter(s=>inRange(s.date, from, to));

  const agg = {};
  sales.forEach(s=>{
    const key = s.modelId || ('free::' + (s.productLabel||'بيع بدون موديل'));
    if(!agg[key]) agg[key] = {modelId:s.modelId||null, label:saleProductLabel(s), qty:0, revenue:0, cost:0, profit:0, count:0};
    const a = agg[key];
    a.qty += num(s.quantity);
    a.revenue += saleRevenue(s);
    a.cost += saleCost(s);
    a.profit += saleProfit(s);
    a.count += 1;
  });
  const rows = Object.values(agg).sort((a,b)=>b.qty-a.qty);

  const totalQty = rows.reduce((s,r)=>s+r.qty,0);
  const totalRevenue = rows.reduce((s,r)=>s+r.revenue,0);
  const totalCost = rows.reduce((s,r)=>s+r.cost,0);
  const totalProfit = rows.reduce((s,r)=>s+r.profit,0);
  const best = rows[0];

  return `
  <button class="detail-back" onclick="navigate('dashboard')">→ رجوع للرئيسية</button>
  <div class="page-head">
    <div><h1>تفاصيل القطع المباعة</h1><div class="desc">كل موديل انباع، بصورته وسعره وتكلفته وربحه</div></div>
    <div class="toolbar" style="margin:0;">
      <div class="field-inline">
        <label>الفترة</label>
        <select onchange="soldModelsMonth=this.value;render();">
          <option value="ALL" ${all?'selected':''}>كل الفترات</option>
          ${monthOptionsList(soldModelsMonth)}
        </select>
      </div>
    </div>
  </div>

  <div class="grid stats">
    ${statCard('إجمالي الربح', money(totalProfit), totalProfit>=0?'pos':'neg', null, true)}
    ${statCard('القطع المباعة', totalQty.toLocaleString('en-US'), '')}
    ${statCard('إجمالي الوارد', money(totalRevenue), 'accent')}
    ${statCard('إجمالي التكلفة', money(totalCost), '')}
    ${best? statCard('الأكثر مبيعاً', esc(best.label), 'accent', `${best.qty} قطعة`) : ''}
  </div>

  <div class="section-title"><span class="ic">👗</span> تفاصيل كل موديل</div>
  ${rows.length ? `
  <div class="model-grid">
    ${rows.map(r=>{
      const m = r.modelId ? modelById(r.modelId) : null;
      const img = (m && m.images && m.images[0]) ? `<img src="${m.images[0]}">` : 'لا توجد صورة';
      const avgPrice = r.qty ? r.revenue/r.qty : 0;
      const avgCost = r.qty ? r.cost/r.qty : 0;
      const avgProfit = r.qty ? r.profit/r.qty : 0;
      const margin = r.revenue ? Math.round((r.profit/r.revenue)*100) : 0;
      return `
      <div class="model-card" ${m?`onclick="currentPage='models';currentDetail='${m.id}';render();window.scrollTo(0,0);"`:''}>
        <div class="thumb">${img}</div>
        <div class="info">
          ${m?`<div class="code">${esc(m.code)}</div>`:'<div class="code">بدون موديل</div>'}
          <div class="name">${esc(r.label)}</div>
          <div class="row"><span>القطع المباعة</span><span class="num"><b>${r.qty}</b></span></div>
          <div class="row"><span>متوسط سعر البيع</span><span class="num">${money(avgPrice)}</span></div>
          <div class="row"><span>متوسط التكلفة</span><span class="num">${money(avgCost)}</span></div>
          <div class="row"><span>الربح/قطعة</span><span class="num ${avgProfit>=0?'pos':'neg'}">${money(avgProfit)}</span></div>
          <div class="row" style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px;"><span>إجمالي الوارد</span><span class="num accent">${money(r.revenue)}</span></div>
          <div class="row"><span>إجمالي الربح</span><span class="num ${r.profit>=0?'pos':'neg'}"><b>${money(r.profit)}</b></span></div>
          <div class="row"><span>نسبة الربح</span><span class="num ${margin>=0?'pos':'neg'}">${margin}%</span></div>
        </div>
      </div>`;
    }).join('')}
  </div>` : `<div class="card" style="text-align:center;color:var(--text-faint);padding:34px;">لا توجد مبيعات مسجلة لهذه الفترة</div>`}

  <div class="section-title"><span class="ic">📊</span> جدول مقارنة</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>الموديل</th><th>القطع</th><th>عمليات البيع</th><th>الوارد</th><th>التكلفة</th><th>الربح</th><th>نسبة الربح</th></tr></thead>
      <tbody>
      ${rows.length? rows.map(r=>{
        const margin = r.revenue ? Math.round((r.profit/r.revenue)*100) : 0;
        return `<tr>
          <td>${esc(r.label)}</td>
          <td class="num">${r.qty}</td>
          <td class="num muted">${r.count}</td>

          <td class="num">${money(r.cost)}</td>
          <td class="num ${r.profit>=0?'pos':'neg'}">${money(r.profit)}</td>
          <td class="num ${margin>=0?'pos':'neg'}">${margin}%</td>
        </tr>`;
      }).join('') : `<tr class="empty-row"><td colspan="7">لا توجد بيانات</td></tr>`}
      </tbody>
    </table>
  </div>`;
}
function monthOptionsList(selected){
  const opts = [];
  const base = new Date();
  for(let i=0;i<12;i++){
    const d = new Date(base.getFullYear(), base.getMonth()-i, 1);
    const ym = d.toISOString().slice(0,7);
    const label = `شهر ${d.getMonth()+1} - ${d.getFullYear()}`;
    opts.push(`<option value="${ym}" ${ym===selected?'selected':''}>${label}</option>`);
  }
  return opts.join('');
}

function exportExpensesCSV(){
  const list = state.expenses.filter(e => inMonth(e.date, expenseFilter.month==='ALL'?null:expenseFilter.month));
  const csv = toCSV(['النوع','القناة','المبلغ','التاريخ','ملاحظات'], list.map(e=>[e.type,(e.channel||'shop')==='page'?'الصفحة':'معمل',e.amount,e.date,e.notes||'']));
  downloadBlob(csv, 'المصاريف.csv','text/csv;charset=utf-8;');
}

    title: item ? 'تعديل مصروف' : 'إضافة مصروف',
    bodyHtml: `

      </div>
      <div class="form-row"><label>القناة</label>

          <option value="shop" ${initChannel==='shop'?'selected':''}>معمل</option>

        </select>
      </div>
      <div class="form-row"><label>ملاحظات</label><textarea id="f_notes">${esc(item?.notes||'')}</textarea></div>
    `,
    onSave(){
      const type = document.getElementById('f_type').value.trim();
      const amount = num(document.getElementById('f_amount').value);
      const date = document.getElementById('f_date').value || todayISO();
      const notes = document.getElementById('f_notes').value.trim();
      const channel = document.getElementById('f_channel').value;
      if(!type) return toast('الرجاء إدخال نوع المصروف');
      if(item){ Object.assign(item, {type,amount,date,notes,channel}); }
      else state.expenses.push({id:uid(),type,amount,date,notes,channel});
      saveState(); closeModal(); render(); toast('تم الحفظ بنجاح');
    }
  });
}
function deleteExpense(id){
  confirmDelete(null, ()=>{
    state.expenses = state.expenses.filter(e=>e.id!==id);

function deleteTailor(id){

let pendingWorkModelImages = [];
function workModelPickerHtml(selectedModelId){
  return `
      <div class="form-row"><label>الموديل</label>
        <select id="f_model" onchange="onWorkModelSelectChange()">
          <option value="">بدون تحديد موديل معين</option>
          <option value="__NEW__">+ إضافة موديل جديد الآن</option>
          ${state.models.map(m=>`<option value="${m.id}" ${selectedModelId===m.id?'selected':''}>${esc(m.name)} (${esc(m.code)})</option>`).join('')}
        </select>
      </div>
      <div id="workNewModelFields" style="display:none;flex-direction:column;gap:13px;">
        <div class="form-row"><label>اسم الموديل الجديد</label><input type="text" id="f_newModelName" placeholder="مثال: عباية كتف مطرزة"></div>
        <div class="form-row"><label>صورة الموديل (اختياري)</label>
          <input type="file" accept="image/*" multiple onchange="handleWorkModelImageUpload(event)">
          <div class="gallery" id="workModelGalleryPreview"></div>
          <div class="hint">تكدر تكتب الاسم بس وتترك الصورة فارغة.</div>
        </div>
      </div>`;
}
function onWorkModelSelectChange(){
  const val = document.getElementById('f_model').value;
  const box = document.getElementById('workNewModelFields');
  if(box) box.style.display = (val==='__NEW__') ? 'flex' : 'none';
}
function workModelGalleryPreviewHtml(){
  return pendingWorkModelImages.map((src,i)=>`<div class="thumb-x"><img src="${src}"><button type="button" onclick="removeWorkModelImage(${i})">×</button></div>`).join('');
}
function removeWorkModelImage(i){
  pendingWorkModelImages.splice(i,1);
  const el = document.getElementById('workModelGalleryPreview');
  if(el) el.innerHTML = workModelGalleryPreviewHtml();
}
function handleWorkModelImageUpload(evt){
  const files = Array.from(evt.target.files || []);
  if(!files.length) return;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = e=>{
      pendingWorkModelImages.push(e.target.result);
      const el = document.getElementById('workModelGalleryPreview');
      if(el) el.innerHTML = workModelGalleryPreviewHtml();
    };
    reader.readAsDataURL(file);
  });
}
// Returns {ok:true, modelId} or {ok:false, msg}
function resolveWorkModelId(){
  const val = document.getElementById('f_model').value;
  if(val === '__NEW__'){
    const name = document.getElementById('f_newModelName').value.trim();
    if(!name) return {ok:false, msg:'الرجاء إدخال اسم الموديل الجديد، أو اختر "بدون تحديد"'};
    const newModel = {
      id: uid(), name,
      code: 'M-' + Date.now().toString(36).slice(-4).toUpperCase(),
      images: [...pendingWorkModelImages],
      fabricCost:0, sewingCost:0, accessoriesCost:0, packagingCost:0, otherCost:0,
      sellingPrice:0, notes:''
    };
    state.models.push(newModel);
    return {ok:true, modelId:newModel.id};
  }
  return {ok:true, modelId: val || null};
}

function galleryPreviewHtml(){
  return pendingImages.map((src,i)=>`<div class="thumb-x"><img src="${src}"><button onclick="removeImage(${i})">×</button></div>`).join('');
}
function removeImage(i){ pendingImages.splice(i,1); document.getElementById('galleryPreview').innerHTML = galleryPreviewHtml(); }
function handleImageUpload(evt){
  const files = Array.from(evt.target.files || []);
  let remaining = files.length;
  if(!remaining) return;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = e=>{
      pendingImages.push(e.target.result);
      document.getElementById('galleryPreview').innerHTML = galleryPreviewHtml();
    };
    reader.readAsDataURL(file);
  });
}
function updateModelCompute(){
  const m = {
    fabricCost:document.getElementById('f_fabric').value, sewingCost:document.getElementById('f_sewing').value,
    accessoriesCost:document.getElementById('f_acc').value, packagingCost:document.getElementById('f_pack').value,
    otherCost:document.getElementById('f_other').value, sellingPrice:document.getElementById('f_sell').value
  };
  document.getElementById('computeCost').textContent = money(modelCost(m));
  document.getElementById('computeProfit').textContent = money(modelProfitPerPiece(m));
}
function deleteModel(id){
  const usedInSales = state.sales.some(s=>s.modelId===id);
  const usedInWork = state.tailorWork.some(w=>w.modelId===id) || state.cutterWork.some(w=>w.modelId===id) || state.hoodariWork.some(w=>w.modelId===id);
  const msg = (usedInSales||usedInWork)
    ? 'هذا الموديل مرتبط بمبيعات أو سجلات شغل خياطين/فصالين. حذفه لن يحذف تلك السجلات لكنها ستفقد رابط الموديل. متابعة؟'
    : null;
  confirmDelete(msg, ()=>{
    state.models = state.models.filter(m=>m.id!==id);
    saveState(); currentDetail=null; render(); toast('تم الحذف');
  });
}

let salesFilter = {month: thisMonth(), q:'', channel:'ALL'};

  const list = state.sales
    .filter(s => inMonth(s.date, salesFilter.month==='ALL'?null:salesFilter.month))
    .filter(s => salesFilter.channel==='ALL' || (s.channel||'shop')===salesFilter.channel)
    .filter(s => !salesFilter.q || saleProductLabel(s).toLowerCase().includes(salesFilter.q.toLowerCase()) || (s.customerName||'').toLowerCase().includes(salesFilter.q.toLowerCase()))
    .sort((a,b)=>b.date.localeCompare(a.date));
  const totalRevenue = list.reduce((s,x)=>s+saleRevenue(x),0);

function exportSalesCSV(){
  const list = state.sales.filter(s => inMonth(s.date, salesFilter.month==='ALL'?null:salesFilter.month));

    list.map(s=>[s.date, saleProductLabel(s), (s.channel||'shop')==='page'?'الصفحة':'معمل', s.customerName||'', s.quantity, s.unitPrice, saleRevenue(s), s.amountReceived!=null?s.amountReceived:saleRevenue(s), num(s.amountRemaining), saleProfit(s), s.paymentMethod||'']));
  downloadBlob(csv,'المبيعات.csv','text/csv;charset=utf-8;');
}
let pendingSaleNewModelImages = [];
let saleAmountsTouched = false;
function openSaleModal(id, presetChannel){
  const item = id ? state.sales.find(s=>s.id===id) : null;
  pendingSaleNewModelImages = [];
  saleAmountsTouched = !!(item && num(item.amountRemaining) > 0);
  const initModel = state.models.length ? modelById(item?.modelId || state.models[0].id) : null;
  const initSelectValue = item ? (item.modelId || '__NONE__') : (state.models.length ? state.models[0].id : '__NONE__');
  const initQty = item?.quantity || 1;
  const initPrice = item?.unitPrice ?? (initModel?.sellingPrice || 0);
  const initTotal = num(initQty)*num(initPrice);
  const initReceived = item ? (item.amountReceived!=null ? item.amountReceived : initTotal) : initTotal;
  const initRemaining = item ? (item.amountRemaining!=null ? item.amountRemaining : 0) : 0;
  const initChannel = item?.channel || presetChannel || 'shop';
  openModal({
    title: item?'تعديل عملية بيع':'تسجيل عملية بيع',
    bodyHtml:`
      <div class="form-row"><label>الموديل</label>
        <select id="f_model" onchange="onSaleModelSelectChange()">
          <option value="__NONE__" ${initSelectValue==='__NONE__'?'selected':''}>بدون موديل (بيع حر)</option>
          <option value="__NEW__">+ إضافة موديل جديد الآن</option>
          ${state.models.map(m=>`<option value="${m.id}" ${initSelectValue===m.id?'selected':''}>${esc(m.name)} (${esc(m.code)})</option>`).join('')}
        </select>
      </div>
      <div id="saleNewModelFields" style="display:${initSelectValue==='__NEW__'?'flex':'none'};flex-direction:column;gap:13px;">
        <div class="form-row"><label>اسم الموديل الجديد</label><input type="text" id="f_newModelName" placeholder="مثال: عباية كتف مطرزة"></div>
        <div class="form-row"><label>صورة الموديل (اختياري)</label>
          <input type="file" accept="image/*" multiple onchange="handleSaleModelImageUpload(event)">
          <div class="gallery" id="saleModelGalleryPreview"></div>
        </div>
      </div>
      <div class="form-row" id="saleFreeDescField" style="display:${initSelectValue==='__NONE__'?'flex':'none'};">
        <label>وصف المنتج (اختياري)</label>
        <input type="text" id="f_freeDesc" value="${esc(!item?.modelId && item?.productLabel ? item.productLabel : '')}" placeholder="مثال: عباية سوداء مقاس L">
      </div>
      <div class="form-row"><label>قناة البيع</label>
        <select id="f_channel">
          <option value="shop" ${initChannel==='shop'?'selected':''}>معمل</option>
          <option value="page" ${initChannel==='page'?'selected':''}>الصفحة (سوشال ميديا)</option>
        </select>
      </div>
      <div class="form-grid2">
        <div class="form-row"><label>الكمية</label><input type="number" id="f_qty" value="${initQty}" oninput="onSaleAmountsRecalc('qty')"></div>
        <div class="form-row"><label>سعر الوحدة</label><input type="number" id="f_price" value="${initPrice}" oninput="onSaleAmountsRecalc('price')"></div>
      </div>
      <div class="compute-box"><span>الإجمالي المطلوب</span><span><b id="saleTotalDisplay">${money(initTotal)}</b></span></div>
      <div class="form-grid2">
        <div class="form-row"><label>المبلغ المستلم</label><input type="number" id="f_received" value="${initReceived}" oninput="onSaleAmountsRecalc('received')"></div>
        <div class="form-row"><label>المبلغ المتبقي (دين)</label><input type="number" id="f_remaining" value="${initRemaining}" oninput="onSaleAmountsRecalc('remaining')"></div>
      </div>
      <div class="form-row">
        <label>اسم الزبون</label>
        <input type="text" id="f_customer" value="${esc(item?.customerName||'')}" placeholder="اسم الشخص أو التاجر">
        <div class="hint" id="customerHint">لو تريد فراغ مبلغ متبقي، لازم تكتب اسم الزبون — بينسجل عليه كدين تلقائياً بصفحة "ديون الزبائن".</div>
      </div>
      <div class="form-grid2">
        <div class="form-row"><label>التاريخ</label><input type="date" id="f_date" value="${item?.date||todayISO()}"></div>
        <div class="form-row"><label>طريقة الدفع</label>
          <select id="f_pay">${PAYMENT_METHODS.map(p=>`<option ${item?.paymentMethod===p?'selected':''}>${p}</option>`).join('')}</select>
        </div>
      </div>
      <div class="form-row"><label>ملاحظات</label><textarea id="f_notes">${esc(item?.notes||'')}</textarea></div>
    `,
    onSave(){
      const selectVal = document.getElementById('f_model').value;
      const quantity = num(document.getElementById('f_qty').value);
      const unitPrice = num(document.getElementById('f_price').value);
      let modelId = null, productLabel = null, costSnapshot = 0;

      if(selectVal === '__NEW__'){
        const newName = document.getElementById('f_newModelName').value.trim();
        if(!newName) return toast('الرجاء إدخال اسم الموديل الجديد، أو اختر "بدون موديل"');
        const newModel = {
          id: uid(), name: newName, code: 'M-' + Date.now().toString(36).slice(-4).toUpperCase(),
          images: [...pendingSaleNewModelImages],
          fabricCost:0, sewingCost:0, accessoriesCost:0, packagingCost:0, otherCost:0,
          sellingPrice: unitPrice, notes:''
        };
        state.models.push(newModel);
        modelId = newModel.id;
        costSnapshot = 0;
      } else if(selectVal === '__NONE__'){
        modelId = null;
        productLabel = document.getElementById('f_freeDesc').value.trim() || 'بيع بدون موديل';
        costSnapshot = 0;
      } else {
        modelId = selectVal;
        costSnapshot = modelCost(modelById(modelId));
      }

      const total = quantity*unitPrice;
      let received = num(document.getElementById('f_received').value);
      if(received>total) received = total;
      if(received<0) received = 0;
      let remaining = Math.max(0, total - received);
      const customerName = document.getElementById('f_customer').value.trim();
      if(remaining>0 && !customerName){
        return toast('الرجاء إدخال اسم الزبون لتسجيل المبلغ المتبقي كدين عليه');
      }
      const date = document.getElementById('f_date').value || todayISO();
      const channel = document.getElementById('f_channel').value;
      const data = {
        modelId, productLabel, quantity, unitPrice, date, channel,
        paymentMethod: document.getElementById('f_pay').value,
        customerName,
        amountReceived: received,
        amountRemaining: remaining,
        notes: document.getElementById('f_notes').value.trim(),
        costSnapshot
      };

      let linkedDebtId = item?.linkedDebtId || null;
      if(remaining > 0){
        const existingDebt = linkedDebtId ? customerDebtById(linkedDebtId) : null;
        if(existingDebt){
          Object.assign(existingDebt, {
            customerName, amount: remaining, date, modelId,
            notes: 'دين ناتج من عملية بيع بتاريخ ' + date
          });
        } else {
          const debt = {
            id: uid(), customerName, amount: remaining, customerType:'retail',
            date, modelId, notes: 'دين ناتج من عملية بيع بتاريخ ' + date
          };
          state.customerDebts.push(debt);
          linkedDebtId = debt.id;
        }
      } else if(linkedDebtId){
        const existingDebt = customerDebtById(linkedDebtId);
        if(existingDebt){
          const tot = customerDebtTotals(linkedDebtId);
          if(tot.paid > 0){ existingDebt.amount = tot.paid; }
          else{ state.customerDebts = state.customerDebts.filter(d=>d.id!==linkedDebtId); }
        }
        linkedDebtId = null;
      }
      data.linkedDebtId = linkedDebtId;

      if(item) Object.assign(item, data);
      else state.sales.push({id:uid(), ...data});
      saveState(); closeModal(); render();
      toast(remaining>0 ? `تم الحفظ — سُجّل ${money(remaining)} كدين على ${customerName}` : 'تم الحفظ بنجاح');
    }
  });
}
function onSaleModelSelectChange(){
  const val = document.getElementById('f_model').value;
  const newFields = document.getElementById('saleNewModelFields');
  const freeField = document.getElementById('saleFreeDescField');
  if(newFields) newFields.style.display = (val==='__NEW__') ? 'flex' : 'none';
  if(freeField) freeField.style.display = (val==='__NONE__') ? 'flex' : 'none';
  if(val!=='__NEW__' && val!=='__NONE__'){
    const m = modelById(val);
    if(m) document.getElementById('f_price').value = m.sellingPrice||0;
  }
  onSaleAmountsRecalc('price');
}
function saleModelGalleryPreviewHtml(){
  return pendingSaleNewModelImages.map((src,i)=>`<div class="thumb-x"><img src="${src}"><button type="button" onclick="removeSaleModelImage(${i})">×</button></div>`).join('');
}
function removeSaleModelImage(i){
  pendingSaleNewModelImages.splice(i,1);
  const el = document.getElementById('saleModelGalleryPreview');
  if(el) el.innerHTML = saleModelGalleryPreviewHtml();
}
function handleSaleModelImageUpload(evt){
  const files = Array.from(evt.target.files || []);
  if(!files.length) return;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = e=>{
      pendingSaleNewModelImages.push(e.target.result);
      const el = document.getElementById('saleModelGalleryPreview');
      if(el) el.innerHTML = saleModelGalleryPreviewHtml();
    };
    reader.readAsDataURL(file);
  });
}
function onSaleAmountsRecalc(source){
  const qtyEl = document.getElementById('f_qty'), priceEl = document.getElementById('f_price');
  const receivedEl = document.getElementById('f_received'), remainingEl = document.getElementById('f_remaining');
  if(!qtyEl || !priceEl || !receivedEl || !remainingEl) return;
  const total = num(qtyEl.value)*num(priceEl.value);
  document.getElementById('saleTotalDisplay').textContent = money(total);
  if(source==='qty' || source==='price'){
    if(!saleAmountsTouched){
      receivedEl.value = total;
      remainingEl.value = 0;
    } else {
      let received = Math.min(num(receivedEl.value), total);
      receivedEl.value = received;
      remainingEl.value = Math.max(0, total-received);
    }
  } else if(source==='received'){
    saleAmountsTouched = true;
    let received = num(receivedEl.value);
    if(received>total) { received = total; receivedEl.value = received; }
    if(received<0) { received = 0; receivedEl.value = received; }
    remainingEl.value = Math.max(0, total-received);
  } else if(source==='remaining'){
    saleAmountsTouched = true;
    let remaining = num(remainingEl.value);
    if(remaining>total) { remaining = total; remainingEl.value = remaining; }
    if(remaining<0) { remaining = 0; remainingEl.value = remaining; }
    receivedEl.value = Math.max(0, total-remaining);
  }
}
function deleteSale(id){
  const sale = state.sales.find(x=>x.id===id);
  const msg = (sale && sale.linkedDebtId) ? 'هذه العملية مرتبطة بدين على زبون — حذفها راح يحذف الدين المرتبط بيه أيضاً. متابعة؟' : null;
  confirmDelete(msg, ()=>{
    if(sale && sale.linkedDebtId){
      state.customerDebts = state.customerDebts.filter(d=>d.id!==sale.linkedDebtId);
      state.customerDebtPayments = state.customerDebtPayments.filter(p=>p.customerDebtId!==sale.linkedDebtId);
    }
    state.sales = state.sales.filter(s=>s.id!==id);
    saveState(); render(); toast('تم الحذف');
  });
}

let debtsFilter = {q:''};

    .sort((a,b)=> b.date.localeCompare(a.date));

    .sort((a,b)=>{
      const la = state.debtPayments.filter(p=>p.debtId===a.id).map(p=>p.date).sort().pop()||a.date;
      const lb = state.debtPayments.filter(p=>p.debtId===b.id).map(p=>p.date).sort().pop()||b.date;

      <thead><tr><th>الدائن (منو يطلب)</th><th>المبلغ الكلي</th><th>المسدد</th><th>المتبقي</th><th>المكان</th><th>السبب</th><th>التاريخ</th><th></th></tr></thead>

      }).join('') : `<tr class="empty-row"><td colspan="8">لا توجد ديون حالية 🎉</td></tr>`}

  <div class="section-title"><span class="ic">✅</span> الديون المسددة</div>

      <tbody>
      ${paid.length? paid.map(d=>{
        const tot = debtTotals(d.id);

function openDebtModal(id){

    bodyHtml:`
      <div class="form-row"><label>الدائن (منو يطلبك)</label><input type="text" id="f_creditor" value="${esc(item?.creditor||'')}" placeholder="اسم الشخص أو الجهة"></div>

function deleteDebt(id){
  confirmDelete('سيتم حذف الدين وكل سجل التسديدات المرتبطة به. متابعة؟', ()=>{
    state.debts = state.debts.filter(d=>d.id!==id);
    state.debtPayments = state.debtPayments.filter(p=>p.debtId!==id);
    saveState(); render(); toast('تم الحذف');
  });
}
function openDebtRepayModal(id){
  const debt = debtById(id);
  const tot = debtTotals(id);
  openModal({
    title: 'تسديد دين: ' + debt.creditor,
    bodyHtml:`
      <div class="compute-box"><span>المتبقي حالياً</span><span><b class="neg">${money(tot.remaining)}</b></span></div>
      <div class="form-grid2">
        <div class="form-row"><label>المبلغ المسدد الآن</label><input type="number" id="f_amount" value="${tot.remaining}"></div>
        <div class="form-row"><label>التاريخ</label><input type="date" id="f_date" value="${todayISO()}"></div>
      </div>
      <div class="form-row"><label>ملاحظات (اختياري)</label><textarea id="f_notes"></textarea></div>
    `,
    onSave(){
      const amount = num(document.getElementById('f_amount').value);
      if(amount<=0) return toast('الرجاء إدخال مبلغ صحيح');
      const date = document.getElementById('f_date').value || todayISO();
      const notes = document.getElementById('f_notes').value.trim();
      state.debtPayments.push({id:uid(), debtId:id, amount, date, notes});

/* =========================================================

========================================================= */
let customerDebtsFilter = {q:''};
function groupCustomerDebts(){
  const groups = {};
  state.customerDebts.forEach(d=>{
    const key = (d.customerName||'').trim() || 'بدون اسم';
    if(!groups[key]) groups[key] = [];
    groups[key].push(d);
  });
  return groups;
}
function customerDebtGroupTotals(debts){
  return debts.reduce((acc,d)=>{
    const t = customerDebtTotals(d.id);
    acc.due += t.due; acc.paid += t.paid; acc.remaining += t.remaining;
    return acc;
  }, {due:0,paid:0,remaining:0});
}
function renderCustomerDebts(){
  const groups = groupCustomerDebts();
  const rows = Object.entries(groups).map(([name, debts])=>{
    const totals = customerDebtGroupTotals(debts);
    const hasPayment = debts.some(d=>state.customerDebtPayments.some(p=>p.customerDebtId===d.id));
    return {name, debts, totals, hasPayment};
  }).filter(r=> !customerDebtsFilter.q || r.name.toLowerCase().includes(customerDebtsFilter.q.toLowerCase()));

  const active = rows.filter(r=>r.totals.remaining>0).sort((a,b)=>b.totals.remaining-a.totals.remaining);
  const settled = rows.filter(r=>r.totals.remaining<=0 && r.hasPayment).sort((a,b)=>a.name.localeCompare(b.name));
  const totalRemaining = active.reduce((s,r)=>s+r.totals.remaining,0);

  return `
  <div class="page-head">
    <div><h1>ديون الزبائن</h1><div class="desc">فلوس تجار الجملة والمفرد مدينين بيها إلك — إجمالي المتبقي: <b class="pos">${money(totalRemaining)}</b></div></div>
    <button class="btn primary" onclick="openCustomerDebtModal()">+ إضافة دين زبون</button>
  </div>
  <div class="toolbar">
    <div class="filters">
      <div class="field-inline"><label>بحث</label>
        <input type="text" class="search-box" placeholder="اسم الزبون" value="${esc(customerDebtsFilter.q)}" oninput="customerDebtsFilter.q=this.value;render();">
      </div>
    </div>
  </div>

  <div class="section-title"><span class="ic">🧾</span> زبائن عليهم ديون حالية</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>الزبون</th><th>عدد الطلبات</th><th>الإجمالي</th><th>المسدد</th><th>المتبقي</th></tr></thead>
      <tbody>
      ${active.length? active.map(r=>`
        <tr style="cursor:pointer" onclick="openCustomerDetail('${encName(r.name)}')">
          <td><b>${esc(r.name)}</b></td>
          <td class="num muted">${r.debts.length}</td>
          <td class="num">${money(r.totals.due)}</td>
          <td class="num pos">${money(r.totals.paid)}</td>
          <td class="num accent">${money(r.totals.remaining)}</td>
        </tr>`).join('') : `<tr class="empty-row"><td colspan="5">لا توجد ديون حالية على الزبائن</td></tr>`}
      </tbody>
    </table>
  </div>

  <div class="section-title"><span class="ic">✅</span> زبائن سددوا بالكامل</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>الزبون</th><th>عدد الطلبات</th><th>إجمالي ما دفعوه</th></tr></thead>
      <tbody>
      ${settled.length? settled.map(r=>`
        <tr style="cursor:pointer" onclick="openCustomerDetail('${encName(r.name)}')">
          <td>${esc(r.name)}</td>
          <td class="num muted">${r.debts.length}</td>
          <td class="num pos">${money(r.totals.due)}</td>
        </tr>`).join('') : `<tr class="empty-row"><td colspan="3">لا توجد ديون محصّلة بعد</td></tr>`}
      </tbody>
    </table>
  </div>`;
}

function deleteCustomerDebt(id){
  confirmDelete('سيتم حذف الدين وكل سجل التحصيلات المرتبطة به. متابعة؟', ()=>{
    state.customerDebts = state.customerDebts.filter(d=>d.id!==id);

    state.sales.forEach(s=>{ if(s.linkedDebtId===id) s.linkedDebtId = null; });

      if(!state.customerDebts.some(d=>(d.customerName||'').trim()===nm)) currentDetail = null;

    saveState(); render(); toast('تم الحذف');

  const all = socialMonth === 'ALL';

  const pageSales = state.sales.filter(s=>(s.channel||'shop')==='page' && inRange(s.date, from, to));
  const pageExpenses = state.expenses.filter(e=>(e.channel||'shop')==='page' && inRange(e.date, from, to));
  const revenue = pageSales.reduce((s,x)=>s+saleRevenue(x),0);
  const profit = pageSales.reduce((s,x)=>s+saleProfit(x),0);
  const expTotal = pageExpenses.reduce((s,x)=>s+num(x.amount),0);
  const adsTotal = pageExpenses.filter(e=>e.type==='إعلانات').reduce((s,x)=>s+num(x.amount),0);
  const net = profit - expTotal;
  const managersDue = pageManagerDuesOutstandingTotal();

  const salesRows = pageSales.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
  const expenseRows = pageExpenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);

    ${statCard('مصاريف الصفحة', money(expTotal), 'neg')}
    ${statCard('من ضمنها إعلانات', money(adsTotal), '')}

    ${statCard('مستحقات مدير/مدراء الصفحة', money(managersDue), managersDue>0?'neg':'pos', 'رصيد تراكمي غير مرتبط بالفترة')}

let reportRange = {from:'', to:''};
function renderReports(){
  const from = reportRange.from || null, to = reportRange.to || null;
  const sales = state.sales.filter(s=>inRange(s.date,from,to));
  const expenses = state.expenses.filter(e=>inRange(e.date,from,to));
  const work = state.tailorWork.filter(w=>inRange(w.date,from,to));
  const cutWork = state.cutterWork.filter(w=>inRange(w.date,from,to));
  const hoodWork = state.hoodariWork.filter(w=>inRange(w.date,from,to));

  // profit by month
  const byMonth = {};
  sales.forEach(s=>{ const k=s.date.slice(0,7); byMonth[k]=byMonth[k]||{revenue:0,cogs:0}; byMonth[k].revenue+=saleRevenue(s); byMonth[k].cogs+=saleCost(s); });
  expenses.forEach(e=>{ const k=e.date.slice(0,7); byMonth[k]=byMonth[k]||{revenue:0,cogs:0,exp:0}; byMonth[k].exp=(byMonth[k].exp||0)+num(e.amount); });
  const months = Object.keys(byMonth).sort();

  // profit by model
  const byModel = {};
  sales.forEach(s=>{ byModel[s.modelId]=byModel[s.modelId]||{qty:0,revenue:0,profit:0}; byModel[s.modelId].qty+=num(s.quantity); byModel[s.modelId].revenue+=saleRevenue(s); byModel[s.modelId].profit+=saleProfit(s); });
  const modelRows = Object.entries(byModel).map(([id,v])=>({model:modelById(id), ...v})).filter(x=>x.model).sort((a,b)=>b.qty-a.qty);

  // expenses by month/type
  const expByType = {};
  expenses.forEach(e=>{ expByType[e.type]=(expByType[e.type]||0)+num(e.amount); });

  // tailor production
  const byTailor = {};
  work.forEach(w=>{ byTailor[w.tailorId]=byTailor[w.tailorId]||{pieces:0,cost:0}; byTailor[w.tailorId].pieces+=num(w.pieceCount); byTailor[w.tailorId].cost+=num(w.pieceCount)*num(w.pricePerPiece); });
  const tailorRows = Object.entries(byTailor).map(([id,v])=>({tailor:tailorById(id), ...v, ...(function(){const t=tailorTotals(id);return {remaining:t.remaining};})()})).filter(x=>x.tailor);

  // cutter production
  const byCutter = {};
  cutWork.forEach(w=>{ byCutter[w.cutterId]=byCutter[w.cutterId]||{pieces:0,cost:0}; byCutter[w.cutterId].pieces+=num(w.pieceCount); byCutter[w.cutterId].cost+=num(w.pieceCount)*num(w.pricePerPiece); });
  const cutterRows = Object.entries(byCutter).map(([id,v])=>({cutter:cutterById(id), ...v, ...(function(){const t=cutterTotals(id);return {remaining:t.remaining};})()})).filter(x=>x.cutter);

  // hoodari production
  const byHoodari = {};
  hoodWork.forEach(w=>{ byHoodari[w.hoodariId]=byHoodari[w.hoodariId]||{pieces:0,cost:0}; byHoodari[w.hoodariId].pieces+=num(w.pieceCount); byHoodari[w.hoodariId].cost+=num(w.pieceCount)*num(w.pricePerPiece); });
  const hoodariRows = Object.entries(byHoodari).map(([id,v])=>({hoodari:hoodariById(id), ...v, ...(function(){const t=hoodariTotals(id);return {remaining:t.remaining};})()})).filter(x=>x.hoodari);

  return `
  <div class="page-head">
    <div><h1>التقارير</h1><div class="desc">حدد فترة زمنية لعرض التقارير التفصيلية</div></div>
    <button class="btn no-print" onclick="window.print()">🖨 طباعة / حفظ PDF</button>
  </div>
  <div class="toolbar no-print">
    <div class="filters">
      <div class="field-inline"><label>من تاريخ</label><input type="date" value="${reportRange.from}" onchange="reportRange.from=this.value;render();"></div>
      <div class="field-inline"><label>إلى تاريخ</label><input type="date" value="${reportRange.to}" onchange="reportRange.to=this.value;render();"></div>
      <button class="btn sm ghost" onclick="reportRange={from:'',to:''};render();">إعادة تعيين</button>
    </div>
  </div>

  <div class="section-title">📅 الأرباح حسب الشهر</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>الشهر</th><th>الوارد</th><th>تكلفة البضاعة</th><th>المصاريف</th><th>صافي الربح</th></tr></thead>
      <tbody>
      ${months.length? months.map(k=>{
        const v = byMonth[k]; const exp = v.exp||0; const profit = (v.revenue||0)-(v.cogs||0)-exp;
        return `<tr><td>${k}</td><td class="num">${money(v.revenue||0)}</td><td class="num">${money(v.cogs||0)}</td><td class="num neg">${money(exp)}</td><td class="num ${profit>=0?'pos':'neg'}">${money(profit)}</td></tr>`;
      }).join('') : `<tr class="empty-row"><td colspan="5">لا توجد بيانات</td></tr>`}
      </tbody>
    </table>
  </div>

  <div class="section-title">👗 أرباح كل موديل <button class="btn sm no-print" style="margin-right:auto" onclick="exportModelReportCSV()">⬇ Excel</button></div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>الموديل</th><th>الكود</th><th>القطع المباعة</th><th>الوارد</th><th>الربح</th></tr></thead>
      <tbody>
      ${modelRows.length? modelRows.map(r=>`<tr><td>${esc(r.model.name)}</td><td class="muted">${esc(r.model.code)}</td><td class="num">${r.qty}</td><td class="num">${money(r.revenue)}</td><td class="num ${r.profit>=0?'pos':'neg'}">${money(r.profit)}</td></tr>`).join('')
        : `<tr class="empty-row"><td colspan="5">لا توجد بيانات</td></tr>`}
      </tbody>
    </table>
  </div>

  <div class="section-title">💸 المصاريف حسب النوع</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>نوع المصروف</th><th>الإجمالي</th></tr></thead>
      <tbody>
      ${Object.keys(expByType).length? Object.entries(expByType).sort((a,b)=>b[1]-a[1]).map(([type,amt])=>`<tr><td>${esc(type)}</td><td class="num neg">${money(amt)}</td></tr>`).join('')
        : `<tr class="empty-row"><td colspan="2">لا توجد بيانات</td></tr>`}
      </tbody>
    </table>
  </div>

  <div class="section-title">🧵 إنتاج كل خياط والمستحقات</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>الخياط</th><th>القطع المنتجة</th><th>تكلفة الخياطة</th><th>المتبقي له (كلي)</th></tr></thead>
      <tbody>
      ${tailorRows.length? tailorRows.map(r=>`<tr><td>${esc(r.tailor.name)}</td><td class="num">${r.pieces}</td><td class="num">${money(r.cost)}</td><td class="num ${r.remaining>0?'neg':'pos'}">${money(r.remaining)}</td></tr>`).join('')
        : `<tr class="empty-row"><td colspan="4">لا توجد بيانات</td></tr>`}
      </tbody>
    </table>
  </div>

  <div class="section-title">✂️ إنتاج كل فصّال والمستحقات</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>الفصّال</th><th>القطع المفصولة</th><th>تكلفة الفصل</th><th>المتبقي له (كلي)</th></tr></thead>
      <tbody>
      ${cutterRows.length? cutterRows.map(r=>`<tr><td>${esc(r.cutter.name)}</td><td class="num">${r.pieces}</td><td class="num">${money(r.cost)}</td><td class="num ${r.remaining>0?'neg':'pos'}">${money(r.remaining)}</td></tr>`).join('')
        : `<tr class="empty-row"><td colspan="4">لا توجد بيانات</td></tr>`}
      </tbody>
    </table>
  </div>

  <div class="section-title">🪡 إنتاج كل هوداري والمستحقات</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>الاسم</th><th>القطع المنجزة</th><th>التكلفة</th><th>المتبقي له (كلي)</th></tr></thead>
      <tbody>
      ${hoodariRows.length? hoodariRows.map(r=>`<tr><td>${esc(r.hoodari.name)}</td><td class="num">${r.pieces}</td><td class="num">${money(r.cost)}</td><td class="num ${r.remaining>0?'neg':'pos'}">${money(r.remaining)}</td></tr>`).join('')
        : `<tr class="empty-row"><td colspan="4">لا توجد بيانات</td></tr>`}
      </tbody>
    </table>
  </div>

  <div class="section-title">📒 الديون (المتبقية حالياً)</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>الدائن</th><th>المبلغ الكلي</th><th>المتبقي</th><th>المكان</th><th>السبب</th></tr></thead>
      <tbody>
      ${(function(){
        const activeDebts = state.debts.filter(d=>debtTotals(d.id).remaining>0);
        return activeDebts.length? activeDebts.map(d=>{ const t=debtTotals(d.id); return `<tr><td>${esc(d.creditor)}</td><td class="num">${money(t.due)}</td><td class="num neg">${money(t.remaining)}</td><td class="muted">${esc(d.location||'—')}</td><td class="muted">${esc(d.reason||'—')}</td></tr>`; }).join('')
          : `<tr class="empty-row"><td colspan="5">لا توجد ديون حالية</td></tr>`;
      })()}
      </tbody>
    </table>
  </div>

  <div class="section-title">🧾 ديون الزبائن (المتبقية حالياً)</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>الزبون</th><th>النوع</th><th>المبلغ الكلي</th><th>المتبقي</th></tr></thead>
      <tbody>
      ${(function(){
        const activeCD = state.customerDebts.filter(d=>customerDebtTotals(d.id).remaining>0);
        return activeCD.length? activeCD.map(d=>{ const t=customerDebtTotals(d.id); return `<tr><td>${esc(d.customerName)}</td><td>${d.customerType==='wholesale'?'جملة':'مفرد'}</td><td class="num">${money(t.due)}</td><td class="num accent">${money(t.remaining)}</td></tr>`; }).join('')
          : `<tr class="empty-row"><td colspan="4">لا توجد ديون زبائن حالية</td></tr>`;
      })()}
      </tbody>
    </table>
  </div>
  `;
}
function exportModelReportCSV(){
  const from = reportRange.from||null, to = reportRange.to||null;
  const sales = state.sales.filter(s=>inRange(s.date,from,to));
  const byModel = {};
  sales.forEach(s=>{ byModel[s.modelId]=byModel[s.modelId]||{qty:0,revenue:0,profit:0}; byModel[s.modelId].qty+=num(s.quantity); byModel[s.modelId].revenue+=saleRevenue(s); byModel[s.modelId].profit+=saleProfit(s); });
  const rows = Object.entries(byModel).map(([id,v])=>({model:modelById(id), ...v})).filter(x=>x.model);
  const csv = toCSV(['الموديل','الكود','القطع المباعة','الوارد','الربح'], rows.map(r=>[r.model.name,r.model.code,r.qty,r.revenue,r.profit]));
  downloadBlob(csv,'تقرير_الموديلات.csv','text/csv;charset=utf-8;');
}

function saveShopName(){

}
function savePin(){
  const v = document.getElementById('s_pin').value.trim();
  state.settings.pin = v || null;
  if(!state.settings.pin){
    const mn = document.querySelector('.mobile-nav');
    if(mn) mn.style.display='';
  }
  saveState(); toast(v ? 'تم تفعيل رمز الحماية' : 'تم إلغاء رمز الحماية'); render();
}
function exportBackup(){
  downloadBlob(JSON.stringify(state,null,2), 'نسخة_احتياطية_'+todayISO()+'.json','application/json');
}
function importBackup(evt){
  const file = evt.target.files[0]; if(!file) return;
  askConfirm('سيتم استبدال جميع البيانات الحالية بالنسخة المستوردة. متابعة؟', ()=>doImportBackup(file), {title:'استيراد نسخة احتياطية', yesLabel:'استيراد'});
  return;
}
function doImportBackup(file){
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      state = Object.assign(defaultState(), parsed);
      saveState(); toast('تم الاستيراد بنجاح'); navigate('dashboard');
    }catch(err){ toast('ملف غير صالح'); }
  };
  reader.readAsText(file);
}
function resetAllData(){
  askConfirm('سيتم حذف جميع البيانات نهائياً من هذا الجهاز. هل أنت متأكد؟', ()=>{
    askConfirm('تأكيد أخير: لا يمكن التراجع عن هذا الإجراء. هل تريد المتابعة؟', ()=>{
      state = defaultState();
      saveState(); toast('تم حذف جميع البيانات'); navigate('dashboard');
    }, {title:'تأكيد نهائي', yesLabel:'حذف نهائي'});
  }, {title:'حذف جميع البيانات', yesLabel:'متابعة'});
}

    document.getElementById('lockScreen').classList.remove('hidden');
    document.getElementById('appRoot').style.display='none';
    document.querySelector('.mobile-nav').style.display='none';
    setTimeout(()=>document.getElementById('pinInput').focus(), 50);
  } else {
    document.getElementById('lockScreen').classList.add('hidden');
    document.getElementById('appRoot').style.display='';
  }
}
function tryUnlock(){
  const v = document.getElementById('pinInput').value;
  if(v === state.settings.pin){
    document.getElementById('lockScreen').classList.add('hidden');
    document.getElementById('appRoot').style.display='';
    const mn = document.querySelector('.mobile-nav');
    if(mn) mn.style.display='';
    render();
  } else {
    document.getElementById('pinErr').textContent = 'رمز غير صحيح، حاول مجدداً';
  }
}
document.addEventListener('keydown', e=>{
  if(!document.getElementById('lockScreen').classList.contains('hidden') && e.key==='Enter') tryUnlock();
});

/* =========================================================
   INIT
========================================================= */
(async function init(){
  state = await loadStateAsync();
  const foot = document.querySelector('.sidebar .foot');
  if(foot) foot.textContent = hasCloudStorage
    ? 'البيانات مشتركة ومتزامنة لكل من يفتح هذا الرابط'
    : 'البيانات محفوظة محلياً على هذا الجهاز فقط';
  checkLock();
  render();
})();
</script>
</body>
</html>
